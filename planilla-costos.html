<script>
(function () {
  "use strict";

  var CURRENCIES = {
    CLP: { symbol: "$",    decimals: 0, label: "CLP · Peso chileno" },
    USD: { symbol: "US$",  decimals: 2, label: "USD · Dólar" },
    EUR: { symbol: "€",    decimals: 2, label: "EUR · Euro" },
    ARS: { symbol: "AR$",  decimals: 0, label: "ARS · Peso argentino" },
    PEN: { symbol: "S/",   decimals: 2, label: "PEN · Sol" },
    COP: { symbol: "COP$", decimals: 0, label: "COP · Peso colombiano" },
    MXN: { symbol: "MX$",  decimals: 2, label: "MXN · Peso mexicano" },
    BRL: { symbol: "R$",   decimals: 2, label: "BRL · Real" },
    UYU: { symbol: "$U",   decimals: 2, label: "UYU · Peso uruguayo" },
    GBP: { symbol: "£",    decimals: 2, label: "GBP · Libra" }
  };

  var UNITS = ["unidad", "hora", "g", "kg", "ml", "l", "cm", "m", "cm²", "m²", "pliego", "paquete"];
  var AREA_UNITS = { "cm²": "cm", "m²": "m" };

  /* un CSV editado en Excel puede traer "cm2" o el ² dañado; lo devolvemos a la forma canónica */
  function normalizeUnit(raw) {
    var u = String(raw == null ? "" : raw).trim();
    if (!u) return "unidad";
    if (AREA_UNITS[u]) return u;
    var flat = u.toLowerCase().replace(/[\s.]/g, "");
    if (/^cm(2|²|\u00b2|\ufffd|\u00c2\u00b2)$/.test(flat) || flat === "cm2") return "cm²";
    if (/^m(2|²|\u00b2|\ufffd|\u00c2\u00b2)$/.test(flat) || flat === "m2") return "m²";
    for (var i = 0; i < UNITS.length; i++) {
      if (UNITS[i].toLowerCase() === u.toLowerCase()) return UNITS[i];
    }
    return u;
  }

  function isArea(unit) { return !!AREA_UNITS[unit]; }
  function sideUnit(unit) { return AREA_UNITS[unit] || ""; }

  /* La caché del dispositivo se separa por cuenta: en un equipo compartido
     nadie ve, ni por un instante, los datos de otra persona. */
  var STORAGE_BASE = "costos:v1";
  var storageKey = STORAGE_BASE;

  /* Configuración del proyecto de Firebase. Son valores públicos por diseño:
     viajan dentro de la página. Lo que protege los datos son las reglas de
     Firestore, no el secreto de estas claves. */
  /* Servida desde Firebase Hosting, la app inicia sesión en su mismo dominio:
     Safari y las apps instaladas bloquean el inicio de sesión cuando la página
     y el dominio de autenticación son distintos (por ejemplo, desde GitHub Pages). */
  var DOMINIOS_FIREBASE = ["tiendas-f9af9.firebaseapp.com", "tiendas-f9af9.web.app"];
  var FIREBASE = {
    apiKey: "AIzaSyAAE6l_UwOVE1KB1QiXBNXhunzhJs78tL8",
    authDomain: DOMINIOS_FIREBASE.indexOf(location.hostname) > -1 ? location.hostname : DOMINIOS_FIREBASE[0],
    projectId: "tiendas-f9af9",
    appId: "1:39811090432:web:9e462dc5388f39265b30e5"
  };

  function estadoInicial() {
    return {
      settings: { currency: "CLP", taxEnabled: false, taxRate: 19,
        tienda: { nombre: "", whatsapp: "" } },
      materials: [],
      products: [],
      orders: [],
      historial: [],
      compras: []
    };
  }

  var state = estadoInicial();

  /* cada lista del estado y su colección en Firestore */
  var COLECCIONES = [
    { nombre: "materiales", campo: "materials" },
    { nombre: "productos", campo: "products" },
    { nombre: "pedidos", campo: "orders" },
    { nombre: "historial", campo: "historial" },
    { nombre: "compras", campo: "compras" }
  ];

  var ESTADOS = [
    { id: "pendiente", label: "Anotado" },
    { id: "proceso", label: "Armando" },
    { id: "listo", label: "Listo" },
    { id: "entregado", label: "Entregado" },
    { id: "cancelado", label: "Cancelado" }
  ];

  var METODOS = ["Retiro", "Punto de encuentro", "Envío"];

  var ui = { tab: "pedidos", vista: "materiales", open: {}, ready: false, confirming: null, filtros: {},
    verCategoria: {}, cambiando: {}, editando: {}, hechosAntiguos: false, foco: null, buscarPedidos: "",
    filtroCompras: "", todasCompras: false, ultimoTipo: "" };

  /* ---------------- utilidades ---------------- */

  function uid() { return Math.random().toString(36).slice(2, 9); }

  function cfg() { return CURRENCIES[state.settings.currency] || CURRENCIES.CLP; }

  function money(n) {
    if (!isFinite(n)) n = 0;
    var d = cfg().decimals;
    var s = Math.abs(n).toLocaleString("es-CL", { minimumFractionDigits: d, maximumFractionDigits: d });
    return (n < 0 ? "-" : "") + cfg().symbol + " " + s;
  }

  function pct(n) {
    if (!isFinite(n)) return "—";
    return n.toLocaleString("es-CL", { minimumFractionDigits: 0, maximumFractionDigits: 1 }) + "%";
  }

  function fmtQty(n) {
    n = parseNum(n);
    if (!isFinite(n)) return "0";
    return n.toLocaleString("es-CL", { maximumFractionDigits: 2 });
  }

  function parseNum(v) {
    if (typeof v === "number") return v;
    if (!v) return 0;
    var s = String(v).replace(/[^0-9,.\-]/g, "");
    if (s.indexOf(",") > -1 && s.indexOf(".") > -1) {
      s = s.lastIndexOf(",") > s.lastIndexOf(".") ? s.replace(/\./g, "").replace(",", ".") : s.replace(/,/g, "");
    } else if (/^-?\d{1,3}(\.\d{3})+$/.test(s)) {
      /* 2.000 en formato chileno son dos mil, no dos */
      s = s.replace(/\./g, "");
    } else {
      s = s.replace(",", ".");
    }
    var n = parseFloat(s);
    return isFinite(n) ? n : 0;
  }

  /* añade un hijo solo si existe: algunas piezas se omiten según el caso */
  function agregar(padre, hijo) { if (hijo) padre.appendChild(hijo); }

  function el(tag, attrs, children) {
    var node = document.createElement(tag);
    if (attrs) Object.keys(attrs).forEach(function (k) {
      if (k === "class") node.className = attrs[k];
      else if (k === "text") node.textContent = attrs[k];
      else if (k === "html") node.innerHTML = attrs[k];
      else if (k.slice(0, 2) === "on") node.addEventListener(k.slice(2), attrs[k]);
      /* los aria-* son de valor "true"/"false": un booleano suelto los dejaba vacíos
         y ni el CSS de seleccionado ni los lectores de pantalla los reconocían */
      else if (k.slice(0, 5) === "aria-" && typeof attrs[k] === "boolean") node.setAttribute(k, attrs[k] ? "true" : "false");
      else if (attrs[k] === true) node.setAttribute(k, "");
      else if (attrs[k] !== false && attrs[k] != null) node.setAttribute(k, attrs[k]);
    });
    (children || []).forEach(function (c) { if (c) node.appendChild(c); });
    return node;
  }

  /* ---------------- cálculo ---------------- */

  function sheetArea(m) {
    return parseNum(m.sheetH) * parseNum(m.sheetW);
  }

  /* costo por unidad de uso (por cm², m², kg, hora, etc.) */
  function materialCost(m) {
    if (!m) return 0;
    /* lo comprado en la planilla de compras cuesta el PPP de su tipo */
    var ppp = costoPPP(m);
    if (ppp != null) return ppp;
    if (m.mode === "compra") {
      if (isArea(m.unit)) {
        var qty = parseNum(m.sheetQty) || 1;
        var total = sheetArea(m) * qty;
        return total > 0 ? parseNum(m.buyPrice) / total : 0;
      }
      var q = parseNum(m.buyQty);
      return q > 0 ? parseNum(m.buyPrice) / q : 0;
    }
    return parseNum(m.cost);
  }

  function hasSheet(m) {
    return !!m && isArea(m.unit) && m.mode === "compra" && sheetArea(m) > 0;
  }

  /* cálculo de una línea de material dentro de un producto */
  function lineCost(line) {
    var m = materialById(line.materialId);
    var out = { cost: 0, area: 0, costArea: 0, costSheets: null, perSheet: 0, sheets: 0, sheetPrice: 0, material: m };
    if (!m) return out;

    var unitCost = materialCost(m);

    if (!isArea(m.unit)) {
      out.cost = unitCost * parseNum(line.qty);
      return out;
    }

    var h = parseNum(line.h), w = parseNum(line.w);
    var pieces = parseNum(line.pieces);
    if (pieces <= 0) pieces = 0;

    out.area = h * w * pieces;
    out.costArea = out.area * unitCost;

    if (hasSheet(m) && h > 0 && w > 0) {
      var sh = parseNum(m.sheetH), sw = parseNum(m.sheetW);
      var fitA = Math.floor(sh / h) * Math.floor(sw / w);
      var fitB = Math.floor(sh / w) * Math.floor(sw / h);
      out.perSheet = Math.max(fitA, fitB);
      out.sheetPrice = sheetArea(m) * unitCost;
      if (out.perSheet > 0) {
        out.sheets = Math.ceil(pieces / out.perSheet);
        out.costSheets = out.sheets * out.sheetPrice;
      }
    }

    out.cost = (m.areaMode === "pliego" && out.costSheets != null) ? out.costSheets : out.costArea;
    return out;
  }

  function materialById(id) {
    for (var i = 0; i < state.materials.length; i++) if (state.materials[i].id === id) return state.materials[i];
    return null;
  }

  /* ---------------- la flor: pétalos y hojas de color elegible ----------------
     Una flor de limpiapipas lleva pétalos y hojas cuyo color pide el cliente,
     más materiales fijos (barra, cinta) que van siempre igual. La receta dice
     cuántos pétalos usa en un color y en bicolor; el pedido dice cuáles. */

  function florDe(p) {
    var f = p.flor || {};
    return {
      catPetalos: f.catPetalos || "",
      petalosUno: parseNum(f.petalosUno),
      petalosPrim: parseNum(f.petalosPrim),
      petalosSec: parseNum(f.petalosSec),
      colorDefecto: f.colorDefecto || "",
      catHojas: f.catHojas || "",
      hojas: parseNum(f.hojas),
      colorHojas: f.colorHojas || ""
    };
  }

  function admiteBicolor(p) {
    var f = florDe(p);
    return f.petalosPrim > 0 && f.petalosSec > 0;
  }

  /* la elección de una línea de pedido, completada con los valores de la receta */
  function eleccionDe(p, it) {
    var f = florDe(p);
    it = it || {};
    var modo = it.modo === "dos" && admiteBicolor(p) ? "dos" : "uno";
    return {
      modo: modo,
      primario: it.primario || f.colorDefecto,
      secundario: it.secundario || "",
      hojas: it.hojasColor || f.colorHojas
    };
  }

  /* materiales de color que consume UNA flor con esa elección */
  function lineasFlor(p, it) {
    var f = florDe(p), e = eleccionDe(p, it), out = [];
    function sumar(id, cant) {
      if (!id || cant <= 0) return;
      var previo = out.filter(function (x) { return x.materialId === id; })[0];
      if (previo) previo.use += cant; else out.push({ materialId: id, use: cant });
    }
    if (e.modo === "dos") {
      sumar(e.primario, f.petalosPrim);
      sumar(e.secundario || e.primario, f.petalosSec);
    } else {
      sumar(e.primario, f.petalosUno);
    }
    sumar(e.hojas, f.hojas);
    return out;
  }

  /* ¿le falta a la línea elegir algún color que la receta exige? */
  function coloresPendientes(p, it) {
    var f = florDe(p), e = eleccionDe(p, it), faltan = [];
    var petalos = e.modo === "dos" ? f.petalosPrim + f.petalosSec : f.petalosUno;
    if (petalos > 0 && !materialById(e.primario)) faltan.push("color primario");
    if (e.modo === "dos" && f.petalosSec > 0 && !materialById(e.secundario)) faltan.push("color secundario");
    if (f.hojas > 0 && !materialById(e.hojas)) faltan.push("color de hojas");
    return faltan;
  }

  function describirColores(p, it) {
    var f = florDe(p), e = eleccionDe(p, it), partes = [];
    var nombre = function (id) { var m = materialById(id); return m ? m.name : "sin elegir"; };
    var petalos = e.modo === "dos" ? f.petalosPrim + f.petalosSec : f.petalosUno;
    if (petalos > 0) {
      partes.push(e.modo === "dos"
        ? "pétalos " + nombre(e.primario) + " + " + nombre(e.secundario)
        : "pétalos " + nombre(e.primario));
    }
    if (f.hojas > 0) partes.push("hojas " + nombre(e.hojas));
    return partes.join(" · ");
  }

  function calc(p) {
    var mats = 0;
    p.materials.forEach(function (line) {
      mats += lineCost(line).cost;
    });
    lineasFlor(p, null).forEach(function (l) {
      var m = materialById(l.materialId);
      if (m) mats += materialCost(m) * l.use;
    });
    var fijos = 0, variables = 0;
    p.costs.forEach(function (c) {
      var v = parseNum(c.amount);
      if (c.kind === "fijo") fijos += v; else variables += v;
    });
    var total = mats + fijos + variables;

    var neto = 0;
    neto = parseNum(p.manualPrice);
    if (!isFinite(neto)) neto = 0;

    var ganancia = neto - total;
    var tax = state.settings.taxEnabled ? neto * parseNum(state.settings.taxRate) / 100 : 0;

    return {
      mats: mats, fijos: fijos, variables: variables, total: total,
      neto: neto, tax: tax, final: neto + tax, ganancia: ganancia,
      margen: neto > 0 ? ganancia / neto * 100 : NaN,
      markup: total > 0 ? ganancia / total * 100 : NaN
    };
  }

  /* ---------------- inventario ---------------- */

  /* el stock se cuenta en pliegos si el material se compra por pliego, y si no en su unidad de uso */
  function stockUnit(m) { return hasSheet(m) ? "pliego" : (m ? m.unit : ""); }

  /* "9 unidad" se lee mal: las unidades contables llevan plural */
  var PLURALES = { unidad: "unidades", pliego: "pliegos", paquete: "paquetes", hora: "horas" };

  function conUnidad(cantidad, unidad) {
    var n = parseNum(cantidad);
    var texto = Math.abs(n - 1) < 1e-9 ? unidad : (PLURALES[unidad] || unidad);
    return fmtQty(n) + " " + texto;
  }

  function stockUnitValue(m) {
    if (!m) return 0;
    return hasSheet(m) ? sheetArea(m) * materialCost(m) : materialCost(m);
  }

  /* cuánto stock consume una línea del producto, en unidades de stock */
  function lineStockUse(line) {
    var r = lineCost(line);
    var m = r.material;
    if (!m) return 0;
    if (hasSheet(m)) {
      if (m.areaMode === "pliego") return r.sheets;
      var area = sheetArea(m);
      return area > 0 ? r.area / area : 0;
    }
    if (isArea(m.unit)) return r.area;
    return parseNum(line.qty);
  }

  /* cuánto trae un paquete de compra y cuánto cuesta, en unidades de stock */
  function packSize(m) {
    if (!m || m.mode !== "compra") return 0;
    return hasSheet(m) ? (parseNum(m.sheetQty) || 1) : parseNum(m.buyQty);
  }

  function packPrice(m) {
    if (!m || m.mode !== "compra") return 0;
    return parseNum(m.buyPrice);
  }

  function stockTarget(m) {
    if (!m) return 0;
    return parseNum(m.stockTarget != null ? m.stockTarget : m.stockMin);
  }

  /* reponer se compra por paquetes enteros: no puedes comprar 12 limpiapipas sueltos */
  function restockCost(m, deficit) {
    if (deficit <= 1e-9) return { packs: 0, cost: 0, whole: true };
    var size = packSize(m), price = packPrice(m);
    if (size > 0 && price > 0) {
      var packs = Math.ceil(deficit / size - 1e-9);
      return { packs: packs, cost: packs * price, whole: true };
    }
    return { packs: 0, cost: deficit * stockUnitValue(m), whole: false };
  }

  /* simula producir un lote: qué consume, qué hay que recomprar y cuántas ventas lo pagan */
  function batchPlan(p, units) {
    var n = parseNum(units);
    var lines = [], total = 0, sobra = 0;
    p.materials.forEach(function (line) {
      var m = materialById(line.materialId);
      if (!m) return;
      var use = lineStockUse(line) * n;
      if (use <= 0) return;
      var after = parseNum(m.stock) - use;
      var deficit = Math.max(0, stockTarget(m) - after);
      var rc = restockCost(m, deficit);
      total += rc.cost;
      if (rc.whole && rc.packs > 0) sobra += rc.packs * packSize(m) - deficit;
      lines.push({ material: m, use: use, after: after, deficit: deficit,
        packs: rc.packs, cost: rc.cost, whole: rc.whole });
    });
    var r = calc(p);
    return {
      units: n, lines: lines, cost: total, sobra: sobra,
      neto: r.neto, ganancia: r.ganancia,
      sell: r.neto > 0 ? Math.ceil(total / r.neto - 1e-9) : null
    };
  }

  function inventoryTotals() {
    var valor = 0, reposicion = 0, bajos = 0;
    state.materials.forEach(function (m) {
      var v = stockUnitValue(m);
      var stock = parseNum(m.stock), target = stockTarget(m);
      valor += stock * v;
      if (target > 0 && stock < target) { bajos++; reposicion += restockCost(m, target - stock).cost; }
    });
    return { valor: valor, reposicion: reposicion, bajos: bajos };
  }

  /* cuántas unidades del producto alcanzan con el stock actual, y qué material lo limita */
  function capacity(p) {
    var limit = Infinity, limiting = null, any = false;
    p.materials.forEach(function (line) {
      var m = materialById(line.materialId);
      if (!m) return;
      var use = lineStockUse(line);
      if (use <= 0) return;
      any = true;
      var posible = Math.floor(parseNum(m.stock) / use);
      if (posible < limit) { limit = posible; limiting = m; }
    });
    return { units: any ? limit : null, limiting: limiting };
  }

  /* Antes el precio podía salir de un margen o un markup sobre el costo.
     Ahora solo hay precio fijo: se convierte el valor que el producto ya
     mostraba, para que ningún precio cambie al actualizar la aplicación. */
  function migrarPrecio(p) {
    if (!p || p.pricingMode === "manual" || p.pricingMode == null) {
      if (p) p.pricingMode = "manual";
      return false;
    }
    var costo = 0;
    (p.materials || []).forEach(function (line) { costo += lineCost(line); });
    (p.costs || []).forEach(function (c) { costo += parseNum(c.amount); });

    var pct = parseNum(p.pricingValue), neto;
    if (p.pricingMode === "margen") neto = pct >= 100 ? 0 : costo / (1 - pct / 100);
    else neto = costo * (1 + pct / 100);
    if (!isFinite(neto)) neto = 0;

    p.manualPrice = Math.round(neto);
    p.pricingMode = "manual";
    delete p.pricingValue;
    return true;
  }

  /* ---------------- historial de costos ----------------
     Los insumos suben de precio y el margen se erosiona sin que se note.
     Cada cambio real de costo se anota con su fecha. */

  function registrarCosto(m, costoAnterior) {
    var nuevo = materialCost(m);
    if (!isFinite(nuevo) || nuevo <= 0) return;
    if (Math.abs(nuevo - costoAnterior) < 0.01) return;   /* no cambió de verdad */
    if (costoAnterior <= 0) return;                       /* primer precio: no es una subida */

    var registro = {
      id: uid(),
      materialId: m.id,
      fecha: new Date().toISOString(),
      antes: costoAnterior,
      despues: nuevo
    };
    state.historial.push(registro);
    /* un año de cambios por material basta para ver la tendencia */
    if (state.historial.length > 500) state.historial = state.historial.slice(-500);
    sucios.historial[registro.id] = true;
    pedirSubida();
  }

  /* se anota al dejar de escribir: tecla por tecla serían decenas de registros */
  var anotarTimers = {};

  function anotarCosto(m, costoAnterior) {
    clearTimeout(anotarTimers[m.id]);
    anotarTimers[m.id] = setTimeout(function () {
      registrarCosto(m, costoAnterior);
      if (ui.tab === "inventario") render();
    }, 1800);
  }

  function historialDe(materialId) {
    return state.historial.filter(function (h) { return h.materialId === materialId; })
      .sort(function (a, b) { return String(a.fecha).localeCompare(String(b.fecha)); });
  }

  var MESES = ["enero", "febrero", "marzo", "abril", "mayo", "junio",
    "julio", "agosto", "septiembre", "octubre", "noviembre", "diciembre"];

  function mesDe(iso) {
    var d = new Date(iso);
    if (isNaN(d)) return "";
    var ahora = new Date();
    return MESES[d.getMonth()] + (d.getFullYear() !== ahora.getFullYear() ? " de " + d.getFullYear() : "");
  }

  /* cuánto subió (o bajó) un material desde su primer registro */
  function variacionCosto(m) {
    var h = historialDe(m.id);
    if (!h.length) return null;
    var desde = h[0].antes, hasta = materialCost(m);
    if (desde <= 0) return null;
    var pctCambio = (hasta - desde) / desde * 100;
    if (Math.abs(pctCambio) < 1) return null;
    return { pct: pctCambio, desde: desde, hasta: hasta, mes: mesDe(h[0].fecha), cambios: h.length };
  }

  function textoVariacion(v) {
    var signo = v.pct > 0 ? "Subió" : "Bajó";
    return signo + " " + Math.round(Math.abs(v.pct)) + "% desde " + v.mes +
      " · de " + money(v.desde) + " a " + money(v.hasta);
  }

  /* productos cuyo margen se comió la subida de un insumo */
  function productosErosionados() {
    var afectados = [];
    state.products.forEach(function (p) {
      var precio = parseNum(p.manualPrice);
      if (precio <= 0) return;
      var r = calc(p);
      if (r.ganancia >= 0 && r.margen >= 15) return;   /* todavía deja margen razonable */

      /* solo interesa si algún insumo suyo subió: los fijos o los pétalos y hojas de la receta */
      var subio = (p.materials || []).concat(lineasFlor(p, null)).some(function (line) {
        var m = materialById(line.materialId);
        var v = m && variacionCosto(m);
        return v && v.pct > 0;
      });
      if (!subio) return;
      afectados.push({ producto: p, margen: r.margen, ganancia: r.ganancia });
    });
    return afectados;
  }

  /* ---------------- existencias de producto terminado ----------------
     Un producto puede estar ya fabricado (unidades hechas y guardadas) o
     por fabricar (se produce descontando materiales). Todo consumo pasa
     por aquí para que las dos cosas nunca se descuadren. */

  function hechos(p) { return Math.max(0, parseNum(p.stock)); }

  function llevaFabricados() { return moduloActivo("fabricados"); }
  function llevaMateriales() { return moduloActivo("materiales"); }

  function textoFaltantes(plan) {
    var sinElegir = plan.faltantes.filter(function (f) { return f.sinCantidad; });
    var cortos = plan.faltantes.filter(function (f) { return !f.sinCantidad; });
    var partes = [];
    if (sinElegir.length) partes.push(sinElegir.map(function (f) { return f.nombre; }).join(", "));
    if (cortos.length) partes.push("No alcanza: " + cortos.map(function (f) {
      return f.nombre + " (faltan " + conUnidad(f.falta, f.unidad) + ")";
    }).join(", "));
    return partes.join(". ");
  }

  /* fabricar guarda las unidades como existencia y descuenta materiales */
  function fabricar(p, units) {
    var n = parseNum(units);
    if (n <= 0) return { error: "Indica cuántas unidades vas a fabricar." };
    if (!llevaMateriales()) {
      p.stock = hechos(p) + n;
      marcarSucio(p);
      return { units: n, sinMateriales: true };
    }

    var faltantes = [], usos = [];
    p.materials.forEach(function (line) {
      var m = materialById(line.materialId);
      if (!m) return;
      var need = lineStockUse(line) * n;
      if (need <= 0) return;
      usos.push({ material: m, use: need });
      if (need > parseNum(m.stock) + 1e-9) {
        faltantes.push({ nombre: m.name || "Sin nombre", falta: need - parseNum(m.stock), unidad: stockUnit(m) });
      }
    });
    if (faltantes.length) return { error: textoFaltantes({ faltantes: faltantes }) };

    usos.forEach(function (u) {
      u.material.stock = Math.max(0, parseNum(u.material.stock) - u.use);
      marcarSucio(u.material);
    });
    if (llevaFabricados()) p.stock = hechos(p) + n;
    marcarSucio(p);
    return { units: n };
  }

  function productById(id) {
    for (var i = 0; i < state.products.length; i++) if (state.products[i].id === id) return state.products[i];
    return null;
  }

  /* consumo de material que exige un conjunto de items, sumando todos los productos */
  /* materiales que hacen falta; lo que ya está fabricado no se vuelve a producir */
  function aggregateUse(items) {
    var use = {}, disponible = {};
    state.products.forEach(function (p) { disponible[p.id] = llevaFabricados() ? hechos(p) : 0; });
    (items || []).forEach(function (it) {
      var p = productById(it.productId);
      if (!p) return;
      var pedidas = parseNum(it.qty);
      var deHechos = Math.min(disponible[p.id] || 0, pedidas);
      disponible[p.id] = (disponible[p.id] || 0) - deHechos;
      var qty = pedidas - deHechos;
      if (qty <= 0) return;
      p.materials.forEach(function (line) {
        var m = materialById(line.materialId);
        if (!m) return;
        use[m.id] = (use[m.id] || 0) + lineStockUse(line) * qty;
      });
      lineasFlor(p, it).forEach(function (l) {
        if (!materialById(l.materialId)) return;
        use[l.materialId] = (use[l.materialId] || 0) + l.use * qty;
      });
    });
    return use;
  }

  /* qué falta y cuánto cuesta comprarlo, en paquetes enteros */
  function shoppingFor(items) {
    var use = aggregateUse(items), lines = [], total = 0, ok = true;
    Object.keys(use).forEach(function (id) {
      var m = materialById(id);
      if (!m) return;
      var need = use[id], stock = parseNum(m.stock);
      var falta = Math.max(0, need - stock);
      var rc = restockCost(m, falta);
      if (falta > 1e-9) ok = false;
      total += rc.cost;
      lines.push({ material: m, need: need, stock: stock, falta: falta, packs: rc.packs, cost: rc.cost });
    });
    lines.sort(function (a, b) { return b.falta - a.falta; });
    return { lines: lines, total: total, ok: ok };
  }

  function orderTotals(o) {
    var ingreso = 0, costo = 0, unidades = 0;
    (o.items || []).forEach(function (it) {
      var p = productById(it.productId);
      if (!p) return;
      var r = calc(p), q = parseNum(it.qty);
      ingreso += (parseNum(it.price) || r.final) * q;
      costo += r.total * q;
      unidades += q;
    });
    return { ingreso: ingreso, costo: costo, ganancia: ingreso - costo, unidades: unidades };
  }

  /* un pedido está atrasado si su fecha comprometida ya pasó y sigue abierto */
  function atrasado(o) {
    if (!o.fecha) return false;
    if (!estaAbierto(o)) return false;
    return o.fecha < hoy();
  }

  /* fecha local AAAA-MM-DD: toISOString va en UTC, y en Chile pasadas las
     21:00 ya marcaba el día siguiente */
  function fechaLocal(d) {
    d = d || new Date();
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  }

  function hoy() { return fechaLocal(new Date()); }

  function pendingOrders() {
    return state.orders.filter(estaAbierto);
  }

  function pendingItems() {
    var items = [];
    pendingOrders().forEach(function (o) { items = items.concat(o.items || []); });
    return items;
  }

  /* entregar descuenta el material de todos los items del pedido */
  /* qué sale de lo ya hecho y qué hay que fabricar para todo el pedido */
  function planEntrega(o) {
    var res = { lineas: [], faltantes: [], ok: true, deHechos: 0, aFabricar: 0 };
    /* se simula sobre copias: dos líneas del mismo material no deben pisarse */
    var simStock = {}, simHechos = {};
    state.materials.forEach(function (m) { simStock[m.id] = parseNum(m.stock); });
    state.products.forEach(function (p) { simHechos[p.id] = hechos(p); });

    (o.items || []).forEach(function (it) {
      var p = productById(it.productId);
      if (!p) return;
      var n = parseNum(it.qty);
      if (n <= 0) return;

      var deHechos = llevaFabricados() ? Math.min(simHechos[p.id] || 0, n) : 0;
      simHechos[p.id] = (simHechos[p.id] || 0) - deHechos;
      var aFabricar = n - deHechos;
      res.deHechos += deHechos;
      res.aFabricar += aFabricar;

      var consumos = [];
      if (aFabricar > 0) {
        if (!llevaMateriales()) {
          res.faltantes.push({ nombre: p.name || "Sin nombre", falta: aFabricar, unidad: "unidad" });
        } else {
          p.materials.forEach(function (line) {
            var m = materialById(line.materialId);
            if (!m) return;
            var use = lineStockUse(line) * aFabricar;
            if (use <= 0) return;
            simStock[m.id] -= use;
            consumos.push({ material: m, use: use });
          });
          /* pétalos y hojas en los colores que pidió el cliente */
          coloresPendientes(p, it).forEach(function (q) {
            res.faltantes.push({ nombre: (p.name || "Flor") + ": falta elegir " + q, falta: 0, unidad: "", sinCantidad: true });
          });
          lineasFlor(p, it).forEach(function (l) {
            var m = materialById(l.materialId);
            if (!m) return;
            var use = l.use * aFabricar;
            simStock[m.id] -= use;
            consumos.push({ material: m, use: use });
          });
        }
      }
      res.lineas.push({ producto: p, qty: n, deHechos: deHechos, aFabricar: aFabricar, consumos: consumos });
    });

    state.materials.forEach(function (m) {
      if (simStock[m.id] < -1e-9) {
        res.faltantes.push({ nombre: m.name || "Sin nombre", falta: -simStock[m.id], unidad: stockUnit(m) });
      }
    });
    res.ok = res.faltantes.length === 0;
    return res;
  }

  /* ajuste: cantidades por material que reemplazan lo calculado por la receta
     (lo que de verdad se usó). Con ajuste, la falta de stock no impide entregar:
     el material ya se gastó y el stock queda en cero. */
  function deliverOrder(o, ajuste) {
    var plan = planEntrega(o);
    var sinElegir = plan.faltantes.filter(function (f) { return f.sinCantidad; });
    if (ajuste ? sinElegir.length : !plan.ok) return { error: textoFaltantes(plan) };

    var usos = {}, orden = [];
    plan.lineas.forEach(function (l) {
      if (l.deHechos > 0) {
        l.producto.stock = hechos(l.producto) - l.deHechos;
        marcarSucio(l.producto);
      }
      l.consumos.forEach(function (c) {
        if (!usos[c.material.id]) { usos[c.material.id] = { material: c.material, use: 0 }; orden.push(c.material.id); }
        usos[c.material.id].use += c.use;
      });
    });
    Object.keys(ajuste || {}).forEach(function (k) {
      if (!usos[k]) {
        var m = materialById(k);
        if (!m) return;
        usos[k] = { material: m, use: 0 }; orden.push(k);
      }
      usos[k].use = Math.max(0, parseNum(ajuste[k]));
    });
    orden.forEach(function (k) {
      var c = usos[k];
      if (c.use <= 0) return;
      c.material.stock = Math.max(0, parseNum(c.material.stock) - c.use);
      marcarSucio(c.material);
    });
    /* lo consumido queda en el pedido, con el nombre de ese día:
       si el material se renombra o se borra, el registro sigue siendo cierto */
    o.consumo = orden.filter(function (k) { return usos[k].use > 0; }).map(function (k) {
      var m = usos[k].material;
      return { materialId: k, nombre: m.name || "Sin nombre", categoria: (m.categoria || "").trim(),
        cantidad: usos[k].use, unidad: stockUnit(m) };
    });
    o.colores = (o.items || []).map(function (it) {
      var p = productById(it.productId);
      return p ? { flor: p.name || "Flor", qty: parseNum(it.qty), detalle: describirColores(p, it) } : null;
    }).filter(Boolean);
    o.estado = "entregado";
    o.entregado = hoy();
    return { ok: true, plan: plan };
  }

  function publicCatalog() {
    return state.products.filter(function (p) { return p.publicado; }).map(function (p) {
      var r = calc(p);
      return {
        id: p.id,
        nombre: p.name || "Sin nombre",
        descripcion: p.descripcionPublica || "",
        precio: Math.round(r.final),
        moneda: state.settings.currency
      };
    });
  }

  /* ---------------- persistencia ---------------- */

  var saveTimer = null, memoryOnly = false, pendiente = false;

  function setSaveState(txt) {
    var n = document.getElementById("saveState");
    if (n) n.textContent = txt;
  }

  /* escritura inmediata en el dispositivo: caché de lo que hay en la nube */
  function guardarLocal() {
    if (memoryOnly || !window.storage) return Promise.resolve();
    return window.storage.set(storageKey, JSON.stringify(state)).catch(function () {});
  }

  /* ---------------- qué está pendiente de subir ----------------
     Subir el estado entero en cada cambio costaba una escritura por cada
     registro del usuario: con cuatrocientos, cuatrocientas escrituras por
     tecla guardada, y por encima de quinientos el lote de Firestore ni
     siquiera se acepta. Aquí se anota solo lo que cambió. */

  var sucios = { materiales: {}, productos: {}, pedidos: {}, historial: {}, compras: {} };
  var borrados = { materiales: {}, productos: {}, pedidos: {}, historial: {}, compras: {} };
  var sucioAjustes = false;

  function coleccionDe(obj) {
    if (!obj || !obj.id) return null;
    if (state.materials.indexOf(obj) > -1) return "materiales";
    if (state.products.indexOf(obj) > -1) return "productos";
    if (state.orders.indexOf(obj) > -1) return "pedidos";
    if (state.historial.indexOf(obj) > -1) return "historial";
    if ((state.compras || []).indexOf(obj) > -1) return "compras";
    return null;
  }

  function marcarSucio(obj) {
    var col = coleccionDe(obj);
    if (col) { sucios[col][obj.id] = true; delete borrados[col][obj.id]; }
    else sucioAjustes = true;   /* ajustes, o algo que ya salió de su lista */
  }

  /* lo borrado se recuerda aparte: su objeto ya no está en ninguna lista */
  function marcarBorrado(coleccion, id) {
    if (!id) return;
    borrados[coleccion][id] = true;
    delete sucios[coleccion][id];
    pedirSubida();
  }

  function hayPendientes() {
    if (sucioAjustes) return true;
    return COLECCIONES.some(function (c) {
      return Object.keys(sucios[c.nombre]).length || Object.keys(borrados[c.nombre]).length;
    });
  }

  function limpiarPendientes() {
    sucios = { materiales: {}, productos: {}, pedidos: {}, historial: {}, compras: {} };
    borrados = { materiales: {}, productos: {}, pedidos: {}, historial: {}, compras: {} };
    sucioAjustes = false;
  }

  /* Firestore es la fuente de verdad; el dispositivo guarda una copia para
     seguir trabajando sin señal. `que` es el objeto que cambió: un material,
     un producto o un pedido. Sin argumento, se entiende que son los ajustes. */
  function save(que) {
    invalidarPPP();
    if (fb && fb.aplicando) return;
    marcarSucio(que);
    pedirSubida();
  }

  /* para cambios masivos (importar, vaciar) donde no hay un objeto que señalar */
  function guardarTodo() {
    if (fb && fb.aplicando) return;
    sucioAjustes = true;
    COLECCIONES.forEach(function (c) {
      (state[c.campo] || []).forEach(function (item) {
        if (!item.id) item.id = uid();
        sucios[c.nombre][item.id] = true;
      });
      /* lo que la nube tenía y aquí ya no está, se borra */
      Object.keys((fb.remotos && fb.remotos[c.nombre]) || {}).forEach(function (id) {
        var vive = (state[c.campo] || []).some(function (x) { return x.id === id; });
        if (!vive) borrados[c.nombre][id] = true;
      });
    });
    pedirSubida();
  }

  function pedirSubida() {
    pendiente = true;
    clearTimeout(saveTimer);
    saveTimer = setTimeout(function () {
      setSaveState("Guardando…");
      guardarLocal().then(function () {
        if (!fb.user) { pendiente = false; setSaveState("Sin sesión"); return; }
        return subirCambios().then(function () {
          pendiente = hayPendientes();
          setSaveState(pendiente ? "Pendiente de subir" : "Sincronizado");
        });
      }).catch(function () {
        setSaveState("Pendiente de subir");
      });
    }, 450);
  }

  /* lee la caché de esta cuenta para pintar algo mientras baja la nube */
  function load() {
    if (!window.storage) { memoryOnly = true; setSaveState("Sin guardado en este visor"); return Promise.resolve(); }
    return window.storage.get(storageKey).then(function (res) {
      if (!res || !res.value) return;
      var data = JSON.parse(res.value);
      if (data.settings) {
        state.settings = Object.assign(state.settings, data.settings);
        state.settings.tienda = Object.assign({ nombre: "", whatsapp: "" }, data.settings.tienda || {});
        delete state.settings.firebase; /* la configuración del proyecto ya no se guarda */
      }
      if (Array.isArray(data.materials)) state.materials = data.materials;
      if (Array.isArray(data.products)) { state.products = data.products; state.products.forEach(migrarPrecio); }
      if (Array.isArray(data.orders)) state.orders = data.orders;
      if (Array.isArray(data.historial)) state.historial = data.historial;
      if (Array.isArray(data.compras)) state.compras = data.compras;
      invalidarPPP();
      state.materials.forEach(function (m) {
        if (m.stockTarget == null && m.stockMin != null) m.stockTarget = m.stockMin;
      });
    }).catch(function () {});
  }

  /* al cambiar de cuenta se vacía todo antes de cargar lo de la nueva */
  function limpiarEstado() {
    clearTimeout(saveTimer);
    pendiente = false;
    limpiarPendientes();   /* lo de la cuenta anterior no se sube a la nueva */
    state = estadoInicial();
    ui.open = {};
    ui.confirming = null;
    ui.tab = "pedidos";
  }

  window.addEventListener("beforeunload", function (e) {
    if (!pendiente) return;
    e.preventDefault();
    e.returnValue = "";
  });

  /* ---------------- toast ---------------- */

  var toastTimer = null;
  function toast(msg) {
    var old = document.querySelector(".toast");
    if (old) old.remove();
    var t = el("div", { class: "toast", text: msg });
    document.body.appendChild(t);
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.remove(); }, 2200);
  }

  /* ---------------- borrado en dos pasos ---------------- */

  function deleteButton(label, onDelete) {
    var btn = el("button", { class: "icon-btn", type: "button", title: label, text: "✕", "aria-label": label });
    var armed = false, timer = null;
    btn.addEventListener("click", function (e) {
      e.stopPropagation();
      if (armed) { clearTimeout(timer); onDelete(); return; }
      armed = true;
      btn.classList.add("confirm");
      btn.textContent = "Borrar";
      timer = setTimeout(function () {
        armed = false; btn.classList.remove("confirm"); btn.textContent = "✕";
      }, 2600);
    });
    return btn;
  }

  /* ---------------- duplicar ----------------
     Un producto parecido al anterior no debería costar diez toques. */

  function copiaNombre(nombre) {
    var base = (nombre || "Sin nombre").replace(/\s*\(copia( \d+)?\)$/, "");
    var n = 2, intento = base + " (copia)";
    var usados = {};
    state.products.concat(state.materials).forEach(function (x) { usados[x.name] = true; });
    while (usados[intento]) { intento = base + " (copia " + n + ")"; n++; }
    return intento;
  }

  function duplicarProducto(p) {
    var copia = JSON.parse(JSON.stringify(p));
    copia.id = uid();
    copia.name = copiaNombre(p.name);
    copia.publicado = false;   /* se publica a propósito, nunca por herencia */
    copia.stock = "";          /* las unidades hechas son del original */
    copia.materials = (copia.materials || []).map(function (l) {
      return Object.assign({}, l);
    });
    copia.costs = (copia.costs || []).map(function (c) {
      return Object.assign({}, c, { id: uid() });
    });
    var pos = state.products.indexOf(p);
    state.products.splice(pos + 1, 0, copia);
    ui.open[copia.id] = true;
    ui.open[p.id] = false;
    save(copia); render();
    toast("Duplicado como “" + copia.name + "”");
    enfocarTarjeta(copia.id);
  }

  function duplicarMaterial(m) {
    /* duplicar un color para crear otro es el caso normal: la categoría viaja */
    var copia = Object.assign({}, m, { id: uid(), name: copiaNombre(m.name), stock: "" });
    ui.open[copia.id] = true;
    var pos = state.materials.indexOf(m);
    state.materials.splice(pos + 1, 0, copia);
    save(copia); render();
    toast("Duplicado como “" + copia.name + "”");
  }

  /* deja el nombre listo para escribir encima */
  function enfocarTarjeta(id) {
    setTimeout(function () {
      var card = document.querySelector('[data-card="' + id + '"]');
      var input = card && card.querySelector("input[type=text]");
      if (input) { input.focus(); input.select(); }
    }, 60);
  }

  /* crea el material, lo deja asignado a este producto y pide su nombre */
  function crearMaterialDesdeProducto(p) {
    abrirVentana("Nuevo " + rubro().insumo.toLowerCase(), function (cuerpo, sheet, cerrar) {
      var nombre = el("input", { type: "text", placeholder: "Ej: Papel couché 300g", "aria-label": "Nombre" });
      var unitSel = el("select", { "aria-label": "Unidad" });
      UNITS.forEach(function (u) { unitSel.appendChild(el("option", { value: u, text: u })); });
      unitSel.value = "unidad";
      var costo = el("input", { class: "num", type: "text", inputmode: "decimal", placeholder: "0",
        "aria-label": "Costo por unidad" });

      cuerpo.appendChild(el("label", { class: "field", text: "Nombre" }));
      cuerpo.appendChild(nombre);
      cuerpo.appendChild(el("label", { class: "field", style: "margin-top:10px", text: "Unidad de uso" }));
      cuerpo.appendChild(unitSel);
      cuerpo.appendChild(el("label", { class: "field", style: "margin-top:10px", text: "Costo por unidad" }));
      cuerpo.appendChild(costo);
      cuerpo.appendChild(el("p", { class: "note", text: "El resto (existencias, compra por paquete) lo ajustas en Inventario." }));
      setTimeout(function () { nombre.focus(); }, 40);

      function guardar() {
        if (!nombre.value.trim()) { toast("Ponle un nombre"); nombre.focus(); return; }
        var m = { id: uid(), name: nombre.value.trim(), unit: unitSel.value, mode: "directo",
          cost: costo.value, buyPrice: "", buyQty: "", sheetH: "", sheetW: "", sheetQty: "1",
          areaMode: "area", stock: "", stockMin: "", categoria: "" };
        state.materials.push(m);
        p.materials.push({ materialId: m.id, qty: 1, h: "", w: "", pieces: 1 });
        save(m); save(p); render(); cerrar();
        toast(m.name + " agregado al producto");
        enfocarUltimaLinea(p.id);
      }

      nombre.addEventListener("keydown", function (e) { if (e.key === "Enter") guardar(); });
      sheet.appendChild(el("div", { class: "actions" }, [
        el("button", { class: "btn", type: "button", text: "Cancelar", onclick: cerrar }),
        el("button", { class: "btn primary", type: "button", text: "Agregar", onclick: guardar })
      ]));
    });
  }

  /* tras agregar una línea, el cursor va a la cantidad: es lo que toca escribir */
  function enfocarUltimaLinea(productId) {
    setTimeout(function () {
      var card = document.querySelector('[data-card="' + productId + '"]');
      if (!card) return;
      var qtys = card.querySelectorAll(".sec .qty input, .sec .amt input");
      if (qtys.length) { qtys[qtys.length - 1].focus(); qtys[qtys.length - 1].select(); }
    }, 60);
  }

  /* ---------------- buscar, filtrar y ordenar ----------------
     Una sola barra para todas las listas: al crecer el catálogo, encontrar
     algo no debería obligar a recorrer la pantalla entera. */

  function norm(txt) {
    return String(txt == null ? "" : txt).toLowerCase()
      .normalize("NFD").replace(/[̀-ͯ]/g, "");
  }

  function coincide(texto, consulta) {
    if (!consulta) return true;
    var t = norm(texto);
    return norm(consulta).split(/\s+/).every(function (palabra) {
      return !palabra || t.indexOf(palabra) > -1;
    });
  }

  /* estado de búsqueda por lista, para no mezclar pestañas */
  function filtro(lista) {
    if (!ui.filtros[lista]) ui.filtros[lista] = { q: "", tag: "", orden: "" };
    return ui.filtros[lista];
  }

  /* Con pocos elementos la barra estorba más de lo que ayuda: se muestra
     a partir de cinco, o si ya hay una búsqueda escrita. */
  var MINIMO_BUSCADOR = 5;

  function barraBusqueda(opts) {
    var f = filtro(opts.lista);
    if (opts.total < MINIMO_BUSCADOR && !f.q && !f.tag) return null;
    var caja = el("div", { class: "buscador" });

    var input = el("input", { type: "search", value: f.q, placeholder: opts.placeholder || "Buscar…",
      "aria-label": opts.placeholder || "Buscar" });
    /* se repinta solo la lista: repintar todo quitaría el foco */
    input.addEventListener("input", function () {
      f.q = input.value;
      opts.repintar();
    });
    caja.appendChild(input);

    if (opts.filtros && opts.filtros.length) {
      var chips = el("div", { class: "chips-filtro" });
      [{ id: "", label: "Todos" }].concat(opts.filtros).forEach(function (op) {
        var n = op.id === "" ? opts.total : op.contar();
        chips.appendChild(el("button", { type: "button", class: "chip-filtro",
          "aria-pressed": f.tag === op.id,
          text: op.label + (n != null ? " · " + n : ""),
          onclick: function () { f.tag = f.tag === op.id ? "" : op.id; opts.repintar(); } }));
      });
      caja.appendChild(chips);
    }

    if (opts.ordenes && opts.ordenes.length > 1 && opts.total >= MINIMO_BUSCADOR) {
      var sel = el("select", { class: "orden", "aria-label": "Ordenar" });
      opts.ordenes.forEach(function (o) {
        sel.appendChild(el("option", { value: o.id, text: "Orden: " + o.label }));
      });
      sel.value = f.orden || opts.ordenes[0].id;
      sel.addEventListener("change", function () { f.orden = sel.value; opts.repintar(); });
      caja.appendChild(sel);
    }

    return caja;
  }

  /* aplica consulta, chip y orden sobre una lista */
  function aplicarFiltro(lista, items, opts) {
    var f = filtro(lista);
    var out = items.filter(function (it) {
      if (!coincide(opts.texto(it), f.q)) return false;
      if (!f.tag) return true;
      var def = null;
      (opts.filtros || []).forEach(function (o) { if (o.id === f.tag) def = o; });
      return def ? def.test(it) : true;
    });

    var orden = f.orden || (opts.ordenes && opts.ordenes.length ? opts.ordenes[0].id : "");
    (opts.ordenes || []).forEach(function (o) {
      if (o.id === orden && o.comparar) out.sort(o.comparar);
    });
    return out;
  }

  function sinResultados(lista, repintar) {
    var f = filtro(lista);
    return el("div", { class: "empty" }, [
      el("p", { text: "Nada coincide con “" + (f.q || "ese filtro") + "”." }),
      el("button", { class: "btn small", type: "button", text: "Limpiar búsqueda",
        onclick: function () { f.q = ""; f.tag = ""; repintar(); } })
    ]);
  }

  /* ---------------- render: inicio ----------------
     Lo que hay que mirar hoy: qué urge, qué falta comprar y cómo va el mes. */

  function mesActual() { return hoy().slice(0, 7); }

  function mesAnterior() {
    var d = new Date();
    d.setDate(1);
    d.setMonth(d.getMonth() - 1);
    return fechaLocal(d).slice(0, 7);
  }

  /* ingreso, costo y ganancia de lo entregado en un mes */
  function balanceMes(mes) {
    var b = { ingreso: 0, costo: 0, ganancia: 0, pedidos: 0 };
    state.orders.forEach(function (o) {
      if (o.estado !== "entregado") return;
      var fecha = o.entregado || o.fecha || o.creado || "";
      if (String(fecha).slice(0, 7) !== mes) return;
      var t = orderTotals(o);
      b.ingreso += t.ingreso; b.costo += t.costo; b.ganancia += t.ganancia;
      b.pedidos++;
    });
    return b;
  }

  function diasHasta(fecha) {
    if (!fecha) return null;
    var ms = new Date(fecha + "T00:00:00") - new Date(hoy() + "T00:00:00");
    return Math.round(ms / 86400000);
  }

  function textoPlazo(o) {
    var d = diasHasta(o.fecha);
    if (d == null) return "sin fecha comprometida";
    if (d < 0) return "atrasado " + Math.abs(d) + (Math.abs(d) === 1 ? " día" : " días");
    if (d === 0) return "entrega hoy";
    if (d === 1) return "entrega mañana";
    return "entrega en " + d + " días";
  }

  /* ---------------- Caja ----------------
     Lo cobrado en el mes y cómo, lo que falta cobrar pedido por pedido,
     la ganancia de lo entregado y los colores que más salen. */

  var MESES_LARGOS = ["enero", "febrero", "marzo", "abril", "mayo", "junio", "julio", "agosto",
    "septiembre", "octubre", "noviembre", "diciembre"];

  function renderCaja() {
    var root = document.getElementById("tab-caja");
    root.innerHTML = "";
    root.appendChild(el("h2", { text: "Caja · " + MESES_LARGOS[new Date().getMonth()] }));

    /* --- cobrado y por cobrar --- */
    var porMetodo = { efectivo: 0, transferencia: 0 };
    state.orders.forEach(function (o) {
      (o.pagos || []).forEach(function (x) {
        if (String(x.fecha || "").slice(0, 7) !== mesActual()) return;
        porMetodo[x.metodo === "transferencia" ? "transferencia" : "efectivo"] += parseNum(x.monto);
      });
    });
    var deudas = state.orders.filter(function (o) {
      return o.estado !== "cancelado" && estadoPago(o).saldo > 0.5;
    }).sort(ordenEntrega);
    var porCobrar = deudas.reduce(function (t, o) { return t + estadoPago(o).saldo; }, 0);

    root.appendChild(el("div", { class: "caja-resumen" }, [
      el("div", { class: "caja-tile cobrado" }, [
        el("span", { class: "et", text: "Cobrado este mes" }),
        el("strong", { text: money(porMetodo.efectivo + porMetodo.transferencia) }),
        el("span", { text: "Efectivo " + money(porMetodo.efectivo) }),
        el("span", { text: "Transferencia " + money(porMetodo.transferencia) })
      ]),
      el("div", { class: "caja-tile porcobrar" }, [
        el("span", { class: "et", text: "Falta cobrar" }),
        el("strong", { text: money(porCobrar) }),
        el("span", { text: deudas.length + (deudas.length === 1 ? " pedido con saldo" : " pedidos con saldo") })
      ])
    ]));

    /* --- ganancia de lo entregado --- */
    var mes = balanceMes(mesActual()), previo = balanceMes(mesAnterior());
    var detalle;
    if (!mes.pedidos) detalle = "Cuando entregues pedidos, aquí verás cuánto te queda.";
    else {
      detalle = mes.pedidos + (mes.pedidos === 1 ? " pedido entregado" : " pedidos entregados") +
        (mes.ingreso > 0 ? " · te queda " + pct(mes.ganancia / mes.ingreso * 100) : "");
      if (previo.ganancia) {
        var dif = mes.ganancia - previo.ganancia;
        detalle += " · " + (dif >= 0 ? "+" : "−") + Math.round(Math.abs(dif) / Math.abs(previo.ganancia) * 100) + "% frente al mes pasado";
      }
    }
    root.appendChild(el("div", { class: "caja-ganancia" }, [
      el("div", { class: "grow" }, [
        el("span", { class: "et", text: "Ganancia del mes" }),
        el("strong", { class: mes.ganancia < 0 ? "neg" : "", text: money(mes.ganancia) }),
        el("span", { class: "det", text: detalle })
      ]),
      el("div", { class: "lado" }, [
        el("span", {}, [document.createTextNode("Ingreso "), el("b", { text: money(mes.ingreso) })]),
        el("span", {}, [document.createTextNode("Costo "), el("b", { text: money(mes.costo) })])
      ])
    ]));

    /* --- pedidos con saldo --- */
    if (deudas.length) {
      root.appendChild(el("h3", { class: "etiqueta", text: "Por cobrar" }));
      var ul = el("ul", { class: "lista-deudas" });
      deudas.forEach(function (o) {
        var est = estadoPago(o), pagado = cobrado(o);
        var metodos = {};
        (o.pagos || []).forEach(function (x) { metodos[x.metodo === "transferencia" ? "transferencia" : "efectivo"] = true; });
        var medio = metodos.efectivo && metodos.transferencia ? "mixto" : metodos.transferencia ? "transferencia" : "efectivo";
        ul.appendChild(el("li", {}, [
          el("div", { class: "fila" }, [
            el("span", { class: "cli", text: o.cliente || "Sin nombre" }),
            el("span", { class: "chip pago-" + est.id, text: est.label }),
            el("span", { class: "falta", text: money(est.saldo) })
          ]),
          el("span", { class: "det", text: resumenFlores(o) + (estaAbierto(o) ? "" : " · entregado") + " · " +
            (pagado > 0 ? "abonó " + money(pagado) + " · " + medio : "sin abono") }),
          el("div", { class: "acciones" }, [
            el("button", { class: "btn", type: "button", text: "Registrar abono", onclick: function () { abrirAbono(o); } }),
            el("button", { class: "btn primary", type: "button", text: "Pagó el resto", onclick: function () { abrirAbono(o, true); } })
          ])
        ]));
      });
      root.appendChild(ul);
    }

    /* --- colores más usados en 30 días, de lo que se entregó --- */
    var catPetalos = {};
    state.products.forEach(function (p) {
      var f = florDe(p);
      if (f.catPetalos) catPetalos[f.catPetalos] = true;
    });
    var desde = new Date(); desde.setDate(desde.getDate() - 30);
    var desdeIso = fechaLocal(desde), usados = {};
    state.orders.forEach(function (o) {
      if (o.estado !== "entregado" || String(o.entregado || "") < desdeIso) return;
      (o.consumo || []).forEach(function (c) {
        if (!catPetalos[String(c.categoria || "").trim()]) return;
        var k = c.materialId;
        if (!usados[k]) usados[k] = { id: k, nombre: c.nombre, cantidad: 0, unidad: c.unidad };
        usados[k].cantidad += parseNum(c.cantidad);
      });
    });
    var ranking = Object.keys(usados).map(function (k) { return usados[k]; })
      .sort(function (a, b) { return b.cantidad - a.cantidad; }).slice(0, 5);
    if (ranking.length) {
      root.appendChild(el("h3", { class: "etiqueta", text: "Colores más usados · 30 días" }));
      var max = ranking[0].cantidad || 1;
      var lista = el("ul", { class: "colores-usados" });
      ranking.forEach(function (u) {
        lista.appendChild(el("li", {}, [
          el("span", { class: "punto-color", style: "background:" + colorDe(u.id) }),
          el("span", { class: "nom", text: u.nombre }),
          el("span", { class: "barra", "aria-hidden": "true" }, [el("span", { style: "width:" + Math.round(u.cantidad / max * 100) + "%" })]),
          el("span", { class: "cant", text: conUnidad(u.cantidad, u.unidad) })
        ]));
      });
      root.appendChild(lista);
    }
  }

  /* costos por unidad pequeños (un limpiapipas, un cm²) necesitan decimales */
  function moneyUnit(n) {
    if (Math.abs(n) >= 100 || Math.abs(n % 1) < 1e-9) return money(n);
    var s = Math.abs(n).toLocaleString("es-CL", { maximumFractionDigits: 2 });
    return (n < 0 ? "-" : "") + cfg().symbol + " " + s;
  }

  /* ---------------- Flores: costo, precio y lo que queda ---------------- */

  function claseMargen(r) { return r.ganancia < 0 || r.margen < 15 ? "neg" : r.margen < 30 ? "c" : "g"; }

  function avisoPrecios() {
    var erosionados = productosErosionados();
    if (!erosionados.length) return null;
    var caja = el("section", { class: "aviso-precios", "aria-labelledby": "aviso-precios-t" }, [
      el("h3", { id: "aviso-precios-t", text: "Revisa estos precios" }),
      el("p", { text: "Subió el costo de algún insumo y el precio quedó corto." })
    ]);
    erosionados.slice(0, 5).forEach(function (x) {
      caja.appendChild(el("button", { type: "button", class: "fila-aviso", onclick: function () {
        ui.open[x.producto.id] = true; render();
        setTimeout(function () {
          var c = document.querySelector('[data-card="' + x.producto.id + '"]');
          if (c) c.scrollIntoView({ block: "start" });
        }, 60);
      } }, [
        el("span", { class: "nom", text: x.producto.name || "Sin nombre" }),
        el("span", { class: "txt", text: x.ganancia < 0 ? "pierdes " + money(-x.ganancia) + " por unidad" : "solo te queda " + pct(x.margen) }),
        el("span", { class: "precio", text: money(calc(x.producto).final) })
      ]));
    });
    return caja;
  }

  function seccionHistorialCostos() {
    var cambios = state.historial.filter(function (h) { return materialById(h.materialId); })
      .sort(function (a, b) { return String(b.fecha).localeCompare(String(a.fecha)); }).slice(0, 8);
    if (!cambios.length) return null;
    var caja = el("div", {}, [el("h3", { class: "etiqueta", text: "Historial de costos" })]);
    var ul = el("ul", { class: "historial-costos" });
    cambios.forEach(function (h) {
      var m = materialById(h.materialId);
      var antes = parseNum(h.antes), despues = parseNum(h.despues);
      var pc = antes > 0 ? Math.round((despues - antes) / antes * 100) : 0;
      ul.appendChild(el("li", {}, [
        el("span", { class: "punto-color", style: "background:" + colorDe(m.id, true) }),
        el("span", { class: "txt" }, [el("strong", { text: m.name || "Sin nombre" }),
          el("span", { text: diaCorto(String(h.fecha).slice(0, 10)) })]),
        el("span", { class: "cambio" }, [el("span", { text: moneyUnit(antes) + " → " + moneyUnit(despues) }),
          el("strong", { class: pc > 0 ? "sube" : "baja", text: (pc > 0 ? "subió " : "bajó ") + Math.abs(pc) + "%" })])
      ]));
    });
    caja.appendChild(ul);
    return caja;
  }

  /* ---------------- Compras · PPP ----------------
     Cada compra es una fila: qué se compró, de qué tipo, cuántas bolsas y a
     qué precio. El costo unitario de cada tipo es el precio promedio
     ponderado (PPP): gasto total ÷ unidades totales de todas sus compras. Así
     no hay que rastrear de qué bolsa sale cada limpiapipa. Los materiales
     comprados toman como costo el PPP de su tipo. */

  var TIPOS_COMPRA = ["Limpiapipas", "Varillas", "Cinta", "Envoltura"];

  function tiposCompra() {
    if (!Array.isArray(state.settings.tiposCompra) || !state.settings.tiposCompra.length) {
      state.settings.tiposCompra = TIPOS_COMPRA.slice();
    }
    return state.settings.tiposCompra;
  }

  function unidadesCompra(c) { return parseNum(c.unidadesBolsa) * parseNum(c.bolsas); }
  function gastoCompra(c) { return parseNum(c.precioBolsa) * parseNum(c.bolsas); }
  function unitarioCompra(c) { var u = parseNum(c.unidadesBolsa); return u > 0 ? parseNum(c.precioBolsa) / u : 0; }

  /* se recalcula solo cuando algo cambió: materialCost se consulta muchas veces por pintada */
  var pppCache = null;
  function invalidarPPP() { pppCache = null; }

  function datosPPP() {
    if (pppCache) return pppCache;
    var tipos = {}, deMaterial = {}, fechaMaterial = {};
    (state.compras || []).forEach(function (c) {
      /* una fila a medio llenar no mueve el promedio */
      if (!c.tipo || unidadesCompra(c) <= 0 || gastoCompra(c) <= 0) return;
      var t = tipos[c.tipo] || (tipos[c.tipo] = { unidades: 0, gasto: 0, compras: 0 });
      t.unidades += unidadesCompra(c);
      t.gasto += gastoCompra(c);
      t.compras++;
      /* el material queda en el tipo de su compra más reciente */
      if (c.materialId && String(c.fecha || "") >= (fechaMaterial[c.materialId] || "")) {
        deMaterial[c.materialId] = c.tipo;
        fechaMaterial[c.materialId] = String(c.fecha || "");
      }
    });
    Object.keys(tipos).forEach(function (k) {
      tipos[k].ppp = tipos[k].unidades > 0 ? tipos[k].gasto / tipos[k].unidades : 0;
    });
    pppCache = { tipos: tipos, deMaterial: deMaterial };
    return pppCache;
  }

  function tipoDeMaterial(m) { return m ? datosPPP().deMaterial[m.id] || "" : ""; }

  /* costo por unidad de stock según las compras, o null si no se compró por aquí */
  function costoPPP(m) {
    var t = tipoDeMaterial(m);
    if (!t) return null;
    var d = datosPPP().tipos[t];
    if (!d || d.ppp <= 0) return null;
    /* un material por pliego se compra por pliegos, pero su costo va por cm² o m² */
    return hasSheet(m) && sheetArea(m) > 0 ? d.ppp / sheetArea(m) : d.ppp;
  }

  /* cambia las compras y anota en el historial los costos que se movieron.
     Se anota unos segundos después, con el costo de antes de empezar: llenar
     una fila celda por celda no debe dejar un registro por cada número. */
  var antesPPP = {}, timerPPP = null;
  function conCostos(cambio) {
    invalidarPPP();
    var antes = {};
    state.materials.forEach(function (m) { antes[m.id] = materialCost(m); });
    cambio();
    invalidarPPP();
    state.materials.forEach(function (m) {
      if (Math.abs(materialCost(m) - antes[m.id]) > 0.001 && !(m.id in antesPPP)) antesPPP[m.id] = antes[m.id];
    });
    clearTimeout(timerPPP);
    timerPPP = setTimeout(function () {
      Object.keys(antesPPP).forEach(function (id) {
        var m = materialById(id);
        if (m) registrarCosto(m, antesPPP[id]);
      });
      antesPPP = {};
    }, 4000);
  }

  /* tipo probable de un material, por su categoría o su nombre */
  function tipoSugerido(m) {
    if (!m) return "";
    var n = norm(m.name), cat = (m.categoria || "").trim();
    var deFlor = state.products.some(function (p) { var f = florDe(p); return cat && (f.catPetalos === cat || f.catHojas === cat); });
    if (deFlor || n.indexOf("limpiapipa") > -1) return "Limpiapipas";
    if (/varilla|barra|alambre|tallo/.test(n)) return "Varillas";
    if (/cinta/.test(n)) return "Cinta";
    if (/envolt|papel|celofan|bolsa/.test(n)) return "Envoltura";
    return "";
  }

  /* la compra suma (o resta, al corregirla) sus unidades al stock; la inicial no, ya estaba */
  function aplicarStock(c, signo) {
    if (c.inicial) return;
    var m = materialById(c.materialId);
    var n = unidadesCompra(c);
    if (!m || !n) return;
    m.stock = Math.max(0, Math.round((parseNum(m.stock) + signo * n) * 100) / 100);
    marcarSucio(m);
  }

  function moneyPPP(n) {
    return cfg().symbol + " " + (isFinite(n) ? n : 0).toLocaleString("es-CL", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }

  function nuevaCompra() {
    var ultima = (state.compras || []).slice().sort(function (a, b) { return String(b.fecha).localeCompare(String(a.fecha)); })[0];
    var c = { id: uid(), fecha: hoy(), proveedor: ultima ? ultima.proveedor || "" : "",
      tipo: "", materialId: "", unidadesBolsa: "", bolsas: 1, precioBolsa: "" };
    state.compras.push(c);
    save(c);
    render();
    elegirMaterialCompra(c);
  }

  /* lo que ya había en stock entra como una compra inicial a su costo de hoy */
  function cargarStockActual() {
    var creadas = 0, sinCosto = 0;
    state.materials.forEach(function (m) {
      var stock = parseNum(m.stock);
      if (stock <= 0) return;
      var valor = stockUnitValue(m);
      if (valor <= 0) { sinCosto++; return; }
      var c = { id: uid(), fecha: hoy(), proveedor: "Stock inicial", tipo: tipoSugerido(m), materialId: m.id,
        unidadesBolsa: stock, bolsas: 1, precioBolsa: Math.round(stock * valor), inicial: true };
      state.compras.push(c);
      marcarSucio(c);
      creadas++;
    });
    invalidarPPP();
    pedirSubida();
    render();
    toast(creadas ? creadas + (creadas === 1 ? " material cargado" : " materiales cargados") +
      (sinCosto ? " · " + sinCosto + " sin costo quedaron fuera" : "") : "No hay materiales con stock y costo para cargar");
  }

  function seccionCompras() {
    if (!state.compras) state.compras = [];
    var caja = el("div", { class: "compras-ppp" }, [el("h3", { class: "etiqueta", text: "Compras · PPP" })]);
    var d = datosPPP();

    /* fichas: un PPP por tipo */
    var conDatos = tiposCompra().filter(function (t) { return d.tipos[t] && d.tipos[t].compras; });
    Object.keys(d.tipos).forEach(function (t) { if (conDatos.indexOf(t) < 0) conDatos.push(t); });
    if (conDatos.length) {
      var fichas = el("ul", { class: "fichas-ppp" });
      conDatos.forEach(function (t) {
        var x = d.tipos[t];
        fichas.appendChild(el("li", {}, [
          el("span", { class: "tipo", text: t }),
          el("strong", { text: moneyPPP(x.ppp) }),
          el("span", { class: "det", text: fmtQty(x.unidades) + " u · " + money(x.gasto) })
        ]));
      });
      caja.appendChild(fichas);
    }

    if (!state.compras.length) {
      caja.appendChild(el("div", { class: "empty" }, [
        el("p", { text: "Anota cada bolsa que compras: el costo de cada tipo se calcula solo con el precio promedio ponderado (gasto total ÷ unidades)." }),
        el("button", { class: "btn primary", type: "button", text: "+ Compra", onclick: nuevaCompra }),
        el("button", { class: "btn", type: "button", text: "Cargar stock actual", style: "margin-left:8px", onclick: cargarStockActual })
      ]));
      return caja;
    }

    /* filtro por tipo y alta */
    var filtro = ui.filtroCompras || "";
    var barra = el("div", { class: "chips-filtro barra-compras", role: "group", "aria-label": "Filtrar por tipo" });
    barra.appendChild(botonChip("Todas", !filtro, function () { ui.filtroCompras = ""; render(); }));
    tiposCompra().forEach(function (t) {
      if (!d.tipos[t]) return;
      barra.appendChild(botonChip(t, filtro === t, function () { ui.filtroCompras = filtro === t ? "" : t; render(); }));
    });
    caja.appendChild(barra);

    var filas = state.compras.filter(function (c) { return !filtro || c.tipo === filtro; })
      .sort(function (a, b) { return String(b.fecha || "").localeCompare(String(a.fecha || "")); });
    var limite = ui.todasCompras ? filas.length : 30;

    var proveedores = {};
    state.compras.forEach(function (c) { if (c.proveedor) proveedores[c.proveedor] = true; });
    caja.appendChild(el("datalist", { id: "lista-proveedores" }, Object.keys(proveedores).map(function (p) {
      return el("option", { value: p });
    })));

    var tabla = el("table", { class: "planilla" }, [
      el("caption", { class: "solo-lector", text: "Compras registradas; cada celda se puede editar" }),
      el("thead", {}, [el("tr", {}, ["Fecha", "Proveedor", "Tipo", "Material", "Unid./bolsa", "Bolsas", "Precio bolsa",
        "Total u.", "Total $", "$ / u", ""].map(function (h, i) {
        return el("th", { scope: "col", class: i >= 4 && i <= 9 ? "n" : "", text: h });
      }))])
    ]);
    var cuerpo = el("tbody");
    filas.slice(0, limite).forEach(function (c) { cuerpo.appendChild(filaCompra(c)); });
    tabla.appendChild(cuerpo);
    caja.appendChild(el("div", { class: "planilla-caja", tabindex: "0", role: "region", "aria-label": "Planilla de compras" }, [tabla]));

    if (filas.length > limite) {
      caja.appendChild(el("button", { class: "btn wide ver-anteriores", type: "button", text: "Ver todas (" + filas.length + ")",
        onclick: function () { ui.todasCompras = true; render(); } }));
    }
    caja.appendChild(el("div", { class: "acciones-compras" }, [
      el("button", { class: "btn primary", type: "button", text: "+ Compra", onclick: nuevaCompra })
    ]));
    return caja;
  }

  function filaCompra(c) {
    var m = materialById(c.materialId);
    /* un número se aplica al salir de la celda: así el stock se corrige una sola vez */
    function celdaNum(campo, etiqueta, dec) {
      return el("td", { class: "n" }, [el("input", { type: "text", inputmode: dec ? "decimal" : "numeric", class: "num",
        value: c[campo] === "" || c[campo] == null ? "" : String(c[campo]), "aria-label": etiqueta, placeholder: "0",
        onchange: function (e) {
          var v = e.target.value;
          conCostos(function () { aplicarStock(c, -1); c[campo] = v === "" ? "" : parseNum(v); aplicarStock(c, 1); });
          save(c); renderPronto();
        } })]);
    }
    return el("tr", { class: c.inicial ? "inicial" : "" }, [
      el("td", { class: "fecha" }, [el("input", { type: "date", value: c.fecha || "", "aria-label": "Fecha",
        onchange: function (e) { conCostos(function () { c.fecha = e.target.value; }); save(c); renderPronto(); } })]),
      el("td", {}, [el("input", { type: "text", value: c.proveedor || "", list: "lista-proveedores", "aria-label": "Proveedor",
        placeholder: c.inicial ? "Stock inicial" : "Proveedor",
        onchange: function (e) { c.proveedor = e.target.value; save(c); } })]),
      el("td", {}, [el("button", { type: "button", class: "celda-btn" + (c.tipo ? "" : " falta"), text: c.tipo || "Elegir",
        "aria-label": "Tipo: " + (c.tipo || "sin elegir"), onclick: function () { elegirTipoCompra(c); } })]),
      el("td", {}, [el("button", { type: "button", class: "celda-btn" + (m ? "" : " falta"), text: m ? m.name || "Sin nombre" : "Elegir",
        "aria-label": "Material: " + (m ? m.name : "sin elegir"), onclick: function () { elegirMaterialCompra(c); } })]),
      celdaNum("unidadesBolsa", "Unidades por bolsa", true),
      celdaNum("bolsas", "Cantidad de bolsas", false),
      celdaNum("precioBolsa", "Precio por bolsa", true),
      el("td", { class: "n calc", text: fmtQty(unidadesCompra(c)) }),
      el("td", { class: "n calc", text: money(gastoCompra(c)) }),
      el("td", { class: "n calc", text: moneyPPP(unitarioCompra(c)) }),
      el("td", {}, [deleteButton("Quitar compra", function () {
        conCostos(function () {
          aplicarStock(c, -1);
          state.compras = state.compras.filter(function (x) { return x !== c; });
        });
        marcarBorrado("compras", c.id);
        render();
      })])
    ]);
  }

  function elegirTipoCompra(c) {
    var nuevo = "";
    abrirHoja("Tipo de compra", function (cuerpo, cerrar, h) {
      cuerpo.appendChild(el("p", { class: "lead", text: "Cada tipo tiene su propio PPP. Todos los colores de limpiapipas comparten uno." }));
      var chips = el("div", { class: "chips-filtro", role: "group", "aria-label": "Tipos" });
      tiposCompra().forEach(function (t) {
        chips.appendChild(botonChip(t, c.tipo === t, function () {
          conCostos(function () { c.tipo = t; });
          ui.ultimoTipo = t;
          save(c); cerrar(); render();
        }));
      });
      cuerpo.appendChild(chips);
      cuerpo.appendChild(el("div", { class: "hoja-fila", style: "margin-top:16px;align-items:end" }, [
        campoHoja("tipo-nuevo", "Nuevo tipo", nuevo, { placeholder: "Ej: Ojos móviles", oninput: function (e) { nuevo = e.target.value; } }),
        el("button", { class: "btn", type: "button", text: "Agregar", style: "margin-bottom:12px", onclick: function () {
          var t = nuevo.trim();
          if (!t) return;
          if (tiposCompra().indexOf(t) < 0) { tiposCompra().push(t); save(); }
          conCostos(function () { c.tipo = t; });
          ui.ultimoTipo = t;
          save(c); cerrar(); render();
        } })
      ]));
    });
  }

  function elegirMaterialCompra(c) {
    var nombre = "", categoria = "";
    abrirHoja("¿Qué compraste?", function (cuerpo, cerrar, h) {
      function usar(id) {
        conCostos(function () {
          aplicarStock(c, -1);
          c.materialId = id;
          /* el tipo sale del material: el que ya tiene, o el probable */
          if (!c.tipo) {
            var m = materialById(id);
            c.tipo = tipoDeMaterial(m) || tipoSugerido(m) || ui.ultimoTipo || "";
          }
          aplicarStock(c, 1);
        });
        save(c); cerrar(); render();
      }
      var grupos = {}, orden = [];
      state.materials.forEach(function (m) {
        var cat = (m.categoria || "").trim() || "Sin categoría";
        if (!grupos[cat]) { grupos[cat] = []; orden.push(cat); }
        grupos[cat].push(m);
      });
      orden.sort(function (a, b) { return a.localeCompare(b); }).forEach(function (cat) {
        cuerpo.appendChild(el("h4", { class: "cat-fichas", text: cat }));
        var chips = el("div", { class: "chips-filtro", role: "group", "aria-label": cat });
        grupos[cat].sort(function (a, b) { return norm(a.name).localeCompare(norm(b.name)); }).forEach(function (m) {
          chips.appendChild(el("button", { type: "button", class: "chip-filtro chip-mat", "aria-pressed": c.materialId === m.id,
            onclick: function () { usar(m.id); } }, [
            el("span", { class: "punto-color", style: "width:14px;height:14px;background:" + colorDe(m.id, true) }),
            el("span", { class: "nom", text: m.name || "Sin nombre" }),
            el("small", { text: fmtQty(parseNum(m.stock)) })
          ]));
        });
        cuerpo.appendChild(chips);
      });

      /* un color o material que aún no está en el inventario */
      var cats = orden.filter(function (x) { return x !== "Sin categoría"; });
      cuerpo.appendChild(el("h4", { class: "cat-fichas", style: "margin-top:20px", text: "Otro material" }));
      cuerpo.appendChild(campoHoja("mat-nuevo", "Nombre", nombre, { placeholder: "Ej: Dorado", oninput: function (e) { nombre = e.target.value; } }));
      if (cats.length) {
        var chipsCat = el("div", { class: "chips-filtro", role: "group", "aria-label": "Categoría del material nuevo" });
        cats.forEach(function (cat) {
          chipsCat.appendChild(botonChip(cat, categoria === cat, function () { categoria = categoria === cat ? "" : cat; h.repintar(); }));
        });
        cuerpo.appendChild(el("fieldset", { class: "hoja-grupo" }, [el("legend", { text: "Categoría" }), chipsCat]));
      }
      cuerpo.appendChild(el("button", { class: "btn primary wide", type: "button", text: "Crear y usar", onclick: function () {
        var n = nombre.trim();
        if (!n) { toast("Escribe el nombre del material"); return; }
        var m = { id: uid(), name: n, unit: "unidad", mode: "directo", cost: "", buyPrice: "", buyQty: "",
          sheetH: "", sheetW: "", sheetQty: "1", areaMode: "area", stock: 0, stockMin: "", categoria: categoria };
        state.materials.push(m);
        marcarSucio(m);
        usar(m.id);
      } }));
    });
  }

  /* ---------------- Taller: lo que tienes frente a lo que piden ---------------- */

  function fichasTaller() {
    var uso = aggregateUse(pendingItems());
    var ids = Object.keys(uso).filter(function (k) { return uso[k] > 1e-9 && materialById(k); });
    if (!ids.length) return null;
    var grupos = {}, orden = [];
    ids.forEach(function (k) {
      var m = materialById(k), cat = (m.categoria || "").trim() || "Sin categoría";
      if (!grupos[cat]) { grupos[cat] = []; orden.push(cat); }
      grupos[cat].push(m);
    });
    var caja = el("div", { class: "fichas-taller" }, [el("h3", { class: "etiqueta", text: "Para los pedidos por hacer" })]);
    orden.forEach(function (cat) {
      caja.appendChild(el("h4", { class: "cat-fichas", text: cat }));
      var ul = el("ul", { class: "fichas" });
      grupos[cat].sort(function (a, b) {
        return (parseNum(a.stock) - uso[a.id] < 0 ? 0 : 1) - (parseNum(b.stock) - uso[b.id] < 0 ? 0 : 1);
      }).forEach(function (m) {
        var need = uso[m.id], stock = parseNum(m.stock), corto = need - stock > 1e-9;
        var pc = need > 0 ? Math.min(100, Math.round(stock / need * 100)) : 100;
        ul.appendChild(el("li", { class: corto ? "corto" : "" }, [
          el("span", { class: "madeja", "aria-hidden": "true" }, [el("span", { style: "height:" + pc + "%;background-color:" + colorDe(m.id, true) })]),
          el("span", { class: "txt" }, [
            el("strong", { text: m.name || "Sin nombre" }),
            el("span", { text: "Tienes " + fmtQty(stock) + " · usarán " + fmtQty(need) }),
            el("span", { class: "estado", text: corto ? "Faltan " + fmtQty(need - stock) : "Sobran " + fmtQty(stock - need) })
          ])
        ]));
      });
      caja.appendChild(ul);
    });
    return caja;
  }

  /* lo que hay que comprar: lo que falta para los pedidos y lo bajo el mínimo */
  function tarjetaCompras(abiertos) {
    var card = el("div", { class: "mat-card" });
    card.appendChild(el("div", { class: "row" }, [
      el("div", { class: "grow" }, [el("h3", { class: "titulo-tarjeta", text: "Qué falta comprar" })])
    ]));

    var porPedidos = abiertos.length ? shoppingFor(pendingItems()) : { lines: [], total: 0, ok: true };
    var faltanPedidos = porPedidos.lines.filter(function (l) { return l.falta > 1e-9; });

    var bajos = state.materials.filter(function (m) { return falta(m) > 0; });
    var yaListados = {};
    faltanPedidos.forEach(function (l) { yaListados[l.material.id] = true; });

    if (!faltanPedidos.length && !bajos.length) {
      card.appendChild(el("div", { class: "unit-cost", style: "margin-top:8px" }, [
        el("span", { text: "No falta nada por ahora" }),
        el("b", { text: money(0) })
      ]));
      return card;
    }

    var total = 0;
    var plan = el("div", { class: "plan" });

    faltanPedidos.forEach(function (l) {
      total += l.cost;
      plan.appendChild(el("div", { class: "plan-row short" }, [
        el("span", { class: "plan-name", text: l.material.name || "Sin nombre" }),
        el("span", { class: "plan-use", text: "faltan " + conUnidad(l.falta, stockUnit(l.material)) + " para los pedidos" }),
        el("span", { class: "plan-cost", text: l.packs
          ? l.packs + (l.packs === 1 ? " paquete " : " paquetes ") + money(l.cost) : money(l.cost) })
      ]));
    });

    bajos.forEach(function (m) {
      if (yaListados[m.id]) return;
      var rc = restockCost(m, falta(m));
      total += rc.cost;
      plan.appendChild(el("div", { class: "plan-row" }, [
        el("span", { class: "plan-name", text: m.name || "Sin nombre" }),
        el("span", { class: "plan-use", text: "bajo el mínimo · faltan " + conUnidad(falta(m), stockUnit(m)) }),
        el("span", { class: "plan-cost", text: rc.packs
          ? rc.packs + (rc.packs === 1 ? " paquete " : " paquetes ") + money(rc.cost) : money(rc.cost) })
      ]));
    });

    card.appendChild(plan);
    card.appendChild(el("div", { class: "unit-cost" + (faltanPedidos.length ? " low" : "") }, [
      el("span", { text: faltanPedidos.length ? "Comprar para los pedidos" : "Para volver al nivel inicial" }),
      el("b", { text: money(total) })
    ]));
    return card;
  }

  /* ---------------- render: productos ---------------- */

  function productCard(p) {
    var r = calc(p);
    var open = !!ui.open[p.id];

    /* cabecera: la flor en su color habitual, cuánto cuesta y cuánto queda */
    var f = florDe(p);
    var c1 = f.colorDefecto ? colorDe(f.colorDefecto) : "#E6DCCB";
    var head = el("div", { class: "card-head flor-head" + (open ? " open" : ""), role: "button", tabindex: "0",
      "aria-expanded": open, onclick: function () {
      ui.open[p.id] = !ui.open[p.id];
      render();
    } }, [
      svgEl(petalosSvg(c1, c1, 40)),
      el("span", { class: "flor-nombre" }, [
        el("h3", { text: p.name || "Sin nombre" }),
        el("span", { class: "flor-resumen", text: "Cuesta " + money(r.total) + " · vendes a " + money(r.final) })
      ]),
      el("span", { class: "chip " + claseMargen(r), text: r.final <= 0 ? "sin precio"
        : r.ganancia < 0 ? "pierdes " + money(-r.ganancia) : "te queda " + pct(r.margen) })
    ]);
    head.addEventListener("keydown", function (e) {
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); head.click(); }
    });
    var pc = r.final > 0 ? Math.max(0, Math.min(100, Math.round(r.total / r.final * 100))) : 100;
    var chips = el("div", { class: "barra-costo", "aria-hidden": "true" }, [
      el("span", { class: "costo", style: "width:" + pc + "%" }),
      el("span", { class: "gana", style: "width:" + (100 - pc) + "%" })
    ]);

    var card = el("div", { class: "card " + (p.type === "servicio" ? "servicio" : "producto"),
      "data-card": p.id }, [head, chips]);
    if (!open) return card;

    var body = el("div", { class: "card-body" });

    /* nombre + tipo */
    body.appendChild(el("div", { class: "sec" }, [
      el("label", { class: "field", text: "Nombre" }),
      el("input", { type: "text", value: p.name, placeholder: "Ej: Tulipán",
        oninput: function (e) { p.name = e.target.value; head.querySelector("h3").textContent = p.name || "Sin nombre"; save(p); } })
    ]));


    body.appendChild(seccionFlor(p));

    /* materiales fijos: barra, cinta, etc. */
    var matSec = el("div", { class: "sec" });
    matSec.appendChild(el("header", {}, [
      el("h4", { text: "Otros materiales" }),
      el("span", { class: "sub", text: money(r.mats) })
