  /* ---------------- firebase ---------------- */

  var fb = { app: null, db: null, auth: null, user: null, unsubs: [], estado: "apagado",
    aplicando: false, remotos: { materiales: {}, productos: {}, pedidos: {}, historial: {}, compras: {} } };

  function loadScript(src) {
    return new Promise(function (resolve, reject) {
      var s = document.createElement("script");
      s.src = src; s.onload = resolve; s.onerror = function () { reject(new Error("sin_red")); };
      document.head.appendChild(s);
    });
  }

  var SDK = "https://www.gstatic.com/firebasejs/10.12.2/";

  function fbInit() {
    if (fb.app) return Promise.resolve();
    fb.estado = "cargando";
    return loadScript(SDK + "firebase-app-compat.js")
      .then(function () { return loadScript(SDK + "firebase-auth-compat.js"); })
      .then(function () { return loadScript(SDK + "firebase-firestore-compat.js"); })
      .then(function () {
        fb.app = window.firebase.initializeApp(FIREBASE);
        fb.auth = window.firebase.auth();
        fb.db = window.firebase.firestore();
        fb.estado = "listo";
        /* caché offline: la planilla sigue viva sin señal y reenvía al volver */
        fb.db.enablePersistence({ synchronizeTabs: true }).catch(function () {});
        /* la sesión sobrevive al cierre del navegador */
        return fb.auth.setPersistence(window.firebase.auth.Auth.Persistence.LOCAL).catch(function () {});
      })
      .then(function () {
        fb.auth.onAuthStateChanged(sesionCambio);
        /* si se entró por redirección (móvil), aquí llega el resultado */
        return fb.auth.getRedirectResult().catch(function (err) { mostrarErrorAcceso(err); });
      })
      .catch(function (err) { fb.estado = "error"; throw err; });
  }

  /* ---------------- pantalla de acceso ---------------- */

  var uidActual = null;

  function verGate(ver) {
    document.getElementById("gate").hidden = !ver;
    document.querySelector(".app").hidden = ver;
  }

  function gateOcupado(ocupado, txt) {
    var b = document.getElementById("btnGoogle");
    b.disabled = ocupado;
    document.getElementById("btnGoogleTxt").textContent = txt || "Entrar con Google";
  }

  var ERRORES = {
    "auth/popup-blocked": "Tu navegador bloqueó la ventana de Google. Permite las ventanas emergentes de este sitio e intenta otra vez.",
    "auth/popup-closed-by-user": "Cerraste la ventana de Google antes de terminar.",
    "auth/cancelled-popup-request": "Quedó otra ventana de acceso abierta. Ciérrala e intenta de nuevo.",
    "auth/unauthorized-domain": "Este sitio todavía no está autorizado en Firebase. Agrega su dominio en Authentication → Settings → Authorized domains.",
    "auth/operation-not-allowed": "El acceso con Google no está habilitado en Firebase. Actívalo en Authentication → Sign-in method.",
    "auth/network-request-failed": "Sin conexión. Revisa tu internet e intenta otra vez.",
    "auth/user-disabled": "Esta cuenta está deshabilitada.",
    "auth/too-many-requests": "Demasiados intentos seguidos. Espera un momento y vuelve a probar.",
    "sin_red": "No pude cargar Firebase. Revisa tu conexión y recarga la página."
  };

  function textoError(err) {
    if (!err) return "No pude entrar. Intenta otra vez.";
    return ERRORES[err.code] || ERRORES[err.message] || "No pude entrar. Intenta otra vez.";
  }

  function mostrarErrorAcceso(err) {
    if (!err) return;
    var n = document.getElementById("gateAviso");
    n.className = "aviso error";
    n.textContent = textoError(err);
    gateOcupado(false);
  }

  function entrarConGoogle() {
    document.getElementById("gateAviso").textContent = "";
    gateOcupado(true, "Conectando…");
    fbInit().then(function () {
      var prov = new window.firebase.auth.GoogleAuthProvider();
      prov.setCustomParameters({ prompt: "select_account" });
      return fb.auth.signInWithPopup(prov).catch(function (err) {
        /* en móvil o con emergentes bloqueadas se entra por redirección */
        var code = (err && err.code) || "";
        if (code === "auth/popup-blocked" || code === "auth/operation-not-supported-in-this-environment") {
          gateOcupado(true, "Redirigiendo…");
          return fb.auth.signInWithRedirect(prov);
        }
        throw err;
      });
    }).catch(mostrarErrorAcceso);
  }

  /* ---------------- sesión ---------------- */

  function sesionCambio(u) {
    if (u && uidActual === u.uid) return;

    pararSync();
    limpiarEstado();
    fb.user = u || null;
    uidActual = u ? u.uid : null;

    if (!u) {
      storageKey = STORAGE_BASE;
      pintarCuenta();
      gateOcupado(false);
      verGate(true);
      return;
    }

    storageKey = STORAGE_BASE + ":" + u.uid;
    verGate(false);
    setSaveState("Cargando…");
    load().then(function () {
      pintarCuenta();
      aplicarLenguaje();
      render();
      arrancarSync();
    });
  }

  function pintarCuenta() {
    var n = document.getElementById("cuenta");
    n.innerHTML = "";
    if (!fb.user) return;
    /* la cuenta y los ajustes viven detrás de este botón; cerrar sesión está en Ajustes */
    var btn = el("button", { type: "button", id: "btnCuenta", "aria-label": "Mi cuenta y ajustes",
      "aria-pressed": ui.tab === "ajustes",
      onclick: function () { ui.tab = ui.tab === "ajustes" ? "pedidos" : "ajustes"; render(); } });
    if (fb.user.photoURL) btn.appendChild(el("img", { src: fb.user.photoURL, alt: "" }));
    else btn.innerHTML = '<svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>';
    n.appendChild(btn);
  }

  function cerrarSesion() {
    if (pendiente && !window.confirm("Hay cambios sin subir. ¿Cerrar sesión de todas formas?")) return;
    pararSync();
    fb.auth.signOut().catch(function () {});
  }

  /* ---------------- rutas por usuario ---------------- */

  function tiendaRef() { return fb.db.collection("tiendas").doc(fb.user.uid); }
  function colRef(nombre) { return tiendaRef().collection(nombre); }
  function publicoRef() { return tiendaRef().collection("publico").doc("tienda"); }

  /* ---------------- sincronización ---------------- */

  function pararSync() {
    fb.unsubs.forEach(function (u) { try { u(); } catch (e) {} });
    fb.unsubs = [];
    fb.remotos = { materiales: {}, productos: {}, pedidos: {}, historial: {}, compras: {} };
  }

  /* Firestore es la fuente de verdad: al entrar bajamos la nube; si está
     vacía, subimos lo que ya había en este dispositivo (migración). */
  function arrancarSync() {
    if (fb.unsubs.length) return;
    setSaveState("Sincronizando…");
    Promise.all(COLECCIONES.map(function (c) { return colRef(c.nombre).get(); }))
      .then(function (snaps) {
        var vacia = snaps.every(function (s) { return s.empty; });
        return tiendaRef().get().then(function (doc) {
          if (doc.exists && doc.data().settings) aplicarSettings(doc.data().settings);
          /* una cuenta que ya venía trabajando no pasa por el asistente */
          if (!vacia && !state.settings.configurado) state.settings.configurado = true;
          if (vacia && state.settings.configurado) return subirTodo();
        });
      })
      .then(function () {
        escucharNube();
        revisarAsistente();
      })
      .catch(function () { setSaveState("Sin conexión"); toast("No pude sincronizar. Reintentaré al volver la señal."); });
  }

  /* el asistente solo aparece la primera vez, con la nube ya consultada */
  function revisarAsistente() {
    /* cuentas creadas con el asistente genérico: pasan a flores por encargo */
    if (state.settings.configurado && (state.settings.modo !== "encargo" || state.settings.rubro !== "manualidades")) {
      fijarRubroFlores(); save();
    }
    if (necesitaAsistente()) abrirAsistente();
    else { aplicarLenguaje(); render(); }
  }

  function aplicarSettings(s) {
    state.settings = Object.assign(state.settings, s);
    delete state.settings.firebase; /* quedó en respaldos antiguos; ya no se usa */
    state.settings.tienda = Object.assign({ nombre: "", whatsapp: "" }, s.tienda || {});
  }

  function escucharNube() {
    COLECCIONES.forEach(function (c) {
      fb.unsubs.push(colRef(c.nombre).onSnapshot(function (snap) {
        /* el eco de lo que acabamos de subir no trae nada nuevo: repintar
           con él le quitaría el foco a quien está escribiendo */
        if (snap.metadata && snap.metadata.hasPendingWrites) { setSaveState("Sincronizado"); return; }

        /* Se actualiza cada objeto en su sitio en vez de reemplazarlo: si la
           pantalla aún no se repintó, sus botones apuntan a estos objetos, y
           con copias nuevas el siguiente toque modificaría uno ya descartado. */
        var previos = {};
        (state[c.campo] || []).forEach(function (x) { if (x && x.id) previos[x.id] = x; });
        var items = [], mapa = {};
        snap.forEach(function (d) {
          var datos = d.data(), item = previos[d.id];
          if (item) {
            Object.keys(item).forEach(function (k) { if (k !== "id" && !(k in datos)) delete item[k]; });
            Object.assign(item, datos);
          } else {
            item = Object.assign({ id: d.id }, datos);
          }
          items.push(item); mapa[d.id] = true;
        });
        fb.remotos[c.nombre] = mapa;
        fb.aplicando = true;
        state[c.campo] = items;
        invalidarPPP();
        if (c.campo === "materials") {
          state.materials.forEach(function (m) {
            if (m.stockTarget == null && m.stockMin != null) m.stockTarget = m.stockMin;
          });
        }
        if (c.campo === "orders") normalizarPedidos();
        /* productos de versiones con margen o markup: se pasan a precio fijo */
        var migrados = c.campo === "products" ? state.products.filter(migrarPrecio) : [];
        guardarLocal();
        fb.aplicando = false;
        if (migrados.length) {
          migrados.forEach(save);
          toast(migrados.length + (migrados.length === 1 ? " producto pasó" : " productos pasaron") + " a precio fijo");
        }
        setSaveState("Sincronizado");
        renderSeguro();
      }, function () { setSaveState("Sin conexión"); }));
    });

    fb.unsubs.push(tiendaRef().onSnapshot(function (doc) {
      if (!doc.exists || (doc.metadata && doc.metadata.hasPendingWrites)) return;
      var d = doc.data();
      if (!d.settings) return;
      fb.aplicando = true;
      aplicarSettings(d.settings);
      guardarLocal();
      fb.aplicando = false;
      renderSeguro();
    }, function () {}));
  }

  /* Un cambio que llega de otro dispositivo no debe borrar lo que se está
     escribiendo aquí: se espera a que el campo pierda el foco. */
  var esperaRender = null, prontoTimer = null;

  /* Un cambio confirmado (salir de un campo) suele venir de un clic en otro
     sitio: si se repinta de inmediato, ese clic se pierde con el nodo. */
  function renderPronto() {
    clearTimeout(prontoTimer);
    prontoTimer = setTimeout(function () {
      if (escribiendo()) { renderSeguro(); return; }
      render();
    }, 300);
  }

  function escribiendo() {
    var a = document.activeElement;
    if (!a) return false;
    var tag = a.tagName;
    return (tag === "INPUT" || tag === "TEXTAREA") && !!a.closest(".app");
  }

  /* Repintar en el blur reconstruiría la pantalla justo mientras se pulsa un
     botón, y ese toque se perdería. Se espera a que nadie esté escribiendo. */
  function renderSeguro() {
    if (!escribiendo()) {
      if (esperaRender) { clearInterval(esperaRender); esperaRender = null; }
      render();
      return;
    }
    if (esperaRender) return;
    esperaRender = setInterval(function () {
      if (escribiendo()) return;
      clearInterval(esperaRender);
      esperaRender = null;
      render();
    }, 700);
  }

  /* los pedidos que entran desde la tienda traen fechas y números en crudo */
  function normalizarPedidos() {
    state.orders.forEach(function (o) {
      o.estado = o.estado || "pendiente";
      o.metodo = o.metodo || METODOS[0];
      o.origen = o.origen || "tienda";
      if (o.creado) o.creado = String(o.creado).slice(0, 10);
      /* se corrigen los tipos en el mismo objeto: reconstruir la línea borraba
         todo lo que no fuera producto, cantidad y precio (colores, modo...) */
      (o.items || []).forEach(function (i) {
        i.qty = parseNum(i.qty);
        i.price = parseNum(i.price);
      });
    });
    state.orders.sort(function (a, b) { return String(b.creado || "").localeCompare(String(a.creado || "")); });
  }

  /* sube todo el estado; borra en la nube lo que ya no existe aquí */
  /* Firestore acepta como mucho 500 operaciones por lote */
  var TOPE_LOTE = 400;

  function enviarOperaciones(ops) {
    if (!ops.length) return Promise.resolve();
    var tandas = [];
    for (var i = 0; i < ops.length; i += TOPE_LOTE) tandas.push(ops.slice(i, i + TOPE_LOTE));
    return tandas.reduce(function (cadena, tanda) {
      return cadena.then(function () {
        var batch = fb.db.batch();
        tanda.forEach(function (op) {
          if (op.borrar) batch.delete(op.ref);
          else batch.set(op.ref, op.datos, op.fundir ? { merge: true } : undefined);
        });
        return batch.commit();
      });
    }, Promise.resolve());
  }

  function opAjustes() {
    var settings = Object.assign({}, state.settings);
    delete settings.firebase; /* pudo venir de un respaldo antiguo */
    return { ref: tiendaRef(), datos: { settings: settings, actualizado: new Date().toISOString() }, fundir: true };
  }

  /* sube solo lo marcado como sucio, y borra lo marcado como borrado */
  function subirCambios() {
    if (!fb.user) return Promise.resolve();

    var ops = [], aLimpiar = { materiales: [], productos: [], pedidos: [] };

    COLECCIONES.forEach(function (c) {
      Object.keys(sucios[c.nombre]).forEach(function (id) {
        var item = null;
        (state[c.campo] || []).forEach(function (x) { if (x.id === id) item = x; });
        /* si ya no está en la lista, se borró: lo resuelve la rama de borrados */
        if (!item) return;
        ops.push({ ref: colRef(c.nombre).doc(id), datos: limpiar(item) });
        aLimpiar[c.nombre].push(id);
      });
      Object.keys(borrados[c.nombre]).forEach(function (id) {
        ops.push({ ref: colRef(c.nombre).doc(id), borrar: true });
        aLimpiar[c.nombre].push(id);
      });
    });

    var subiaAjustes = sucioAjustes;
    if (subiaAjustes) ops.push(opAjustes());
    if (!ops.length) return Promise.resolve();

    return enviarOperaciones(ops).then(function () {
      /* se limpia solo lo efectivamente enviado: lo editado entretanto sigue pendiente */
      COLECCIONES.forEach(function (c) {
        aLimpiar[c.nombre].forEach(function (id) {
          delete sucios[c.nombre][id];
          delete borrados[c.nombre][id];
        });
      });
      if (subiaAjustes) sucioAjustes = false;
    });
  }

  /* subida completa: migración inicial y el botón de Ajustes */
  function subirTodo() {
    if (!fb.user) return Promise.resolve();
    var ops = [];
    COLECCIONES.forEach(function (c) {
      var vivos = {};
      (state[c.campo] || []).forEach(function (item) {
        if (!item.id) item.id = uid();
        vivos[item.id] = true;
        ops.push({ ref: colRef(c.nombre).doc(item.id), datos: limpiar(item) });
      });
      Object.keys(fb.remotos[c.nombre] || {}).forEach(function (id) {
        if (!vivos[id]) ops.push({ ref: colRef(c.nombre).doc(id), borrar: true });
      });
    });
    ops.push(opAjustes());
    return enviarOperaciones(ops).then(function () { limpiarPendientes(); });
  }

  /* Firestore no acepta undefined ni el id duplicado dentro del documento */
  function limpiar(item) {
    var out = {};
    Object.keys(item).forEach(function (k) {
      if (k === "id" || item[k] === undefined) return;
      out[k] = item[k] === null ? null : item[k];
    });
    return out;
  }

  /* ---------------- publicación de la tienda ---------------- */

  function publicarCatalogo() {
    if (!fb.user) return Promise.reject(new Error("Inicia sesión primero."));
    var cat = publicCatalog();
    var batch = fb.db.batch();
    cat.forEach(function (item) {
      batch.set(colRef("catalogo").doc(item.id), item);
    });
    return colRef("catalogo").get().then(function (snap) {
      var vivos = {};
      cat.forEach(function (i) { vivos[i.id] = true; });
      snap.forEach(function (doc) { if (!vivos[doc.id]) batch.delete(doc.ref); });
      batch.set(publicoRef(), {
        nombre: state.settings.tienda.nombre || "",
        whatsapp: state.settings.tienda.whatsapp || "",
        moneda: state.settings.currency,
        actualizado: new Date().toISOString()
      });
      return batch.commit();
    }).then(function () { return cat.length; });
  }

    if (!fb.user) return "";
    return location.href.replace(/[^/]*$/, "") + "tienda.html?tienda=" + fb.user.uid;

    var card = document.getElementById("wizardCard");

  /* pone en pantalla las palabras del rubro y esconde lo que no se usa */

    if (tabInv) tabInv.hidden = !moduloActivo("inventario");

  /* un punto en la barra inferior marca la sección que reclama atención,
     y la cabecera resume el día */
  function pintarContadores() {
    var abiertos = pendingOrders();
    var nAtrasados = abiertos.filter(atrasado).length;
    var avisos = {
      pedidos: nAtrasados ? (nAtrasados === 1 ? "1 pedido atrasado" : nAtrasados + " pedidos atrasados") : "",
      productos: productosErosionados().length ? "hay precios por revisar" : "",
      inventario: llevaMateriales() && (!shoppingFor(pendingItems()).ok || inventoryTotals().bajos) ? "falta material" : ""
    };
    Object.keys(avisos).forEach(function (tab) {

      + (abiertos.length ? abiertos.length + " por hacer" : "nada por hacer");
    var n = document.getElementById("resumenDia");

  /* ---------------- ventanas de producción y entrega ---------------- */

  var contadorVentanas = 0;

  function enfocables(raiz) {
    var nodos = raiz.querySelectorAll('a[href], button:not([disabled]), input:not([disabled]), select:not([disabled]), textarea:not([disabled]), [tabindex]:not([tabindex="-1"])');
    return Array.prototype.filter.call(nodos, function (n) { return n.offsetParent !== null; });
  }

  function abrirVentana(titulo, construir, alCerrar) {
    var devolverFoco = document.activeElement;
    var tituloId = "ventana-" + (++contadorVentanas);

    var bg = el("div", { class: "sheet-bg", onclick: function (e) { if (e.target === bg) cerrar(); } });
    var cuerpo = el("div", { class: "cuerpo" });
    var sheet = el("div", { class: "sheet", role: "dialog", "aria-modal": "true", "aria-labelledby": tituloId },
      [el("h3", { id: tituloId, text: titulo }), cuerpo]);

    function cerrar() {
      if (!bg.parentNode) return;
      bg.remove();
      if (alCerrar) alCerrar();
      document.removeEventListener("keydown", teclado, true);
      /* el foco vuelve a donde estaba: sin esto se pierde al principio de la página */
      if (devolverFoco && devolverFoco.focus) devolverFoco.focus();
    }

    /* mientras la ventana está abierta, el tabulador no sale de ella */
    function teclado(e) {
      if (e.key === "Escape") { e.preventDefault(); cerrar(); return; }
      if (e.key !== "Tab") return;
      var lista = enfocables(sheet);
      if (!lista.length) return;
      var primero = lista[0], ultimo = lista[lista.length - 1];
      if (e.shiftKey && document.activeElement === primero) { e.preventDefault(); ultimo.focus(); }
      else if (!e.shiftKey && document.activeElement === ultimo) { e.preventDefault(); primero.focus(); }
      else if (!sheet.contains(document.activeElement)) { e.preventDefault(); primero.focus(); }
    }

    document.addEventListener("keydown", teclado, true);
    bg.appendChild(sheet);
    document.body.appendChild(bg);
    construir(cuerpo, sheet, cerrar);

    var lista = enfocables(sheet);
    if (lista.length) lista[0].focus();
    return cerrar;
  }

  function filaPlan(nombre, detalle, cls) {
    return el("div", { class: "plan-row" + (cls ? " " + cls : "") }, [
      el("span", { class: "plan-name", text: nombre }),
      el("span", { class: "plan-use", text: detalle })
    ]);
  }

  /* fabricar un lote: qué consume, qué falta, cuánto cuesta reponer */
  function abrirProducir(p) {
    abrirVentana("Fabricar " + (p.name || "producto"), function (cuerpo, sheet, cerrar) {
      var cap = capacity(p);
      var lote = cap.units != null && cap.units > 0 ? String(cap.units) : "1";

      var input = el("input", { class: "num", type: "text", inputmode: "decimal", value: lote,
        "aria-label": "Unidades a fabricar" });
      cuerpo.appendChild(el("div", { class: "row" }, [
        el("div", { class: "grow" }, [el("label", { class: "field", style: "margin:0", text: "Unidades a fabricar" })]),
        el("div", { class: "qty" }, [input])
      ]));

      if (llevaFabricados()) {
        cuerpo.appendChild(el("p", { class: "note", style: "margin:6px 0 0",
          text: "Tienes " + fmtQty(hechos(p)) + (hechos(p) === 1 ? " unidad hecha" : " unidades hechas") +
            ". Lo que fabriques se suma a esa existencia." }));
      }

      var detalle = el("div", { class: "plan" });
      var resumen = el("div", { class: "unit-cost" });
      var accion = el("button", { class: "btn primary", type: "button", text: "Registrar fabricación" });

      function refrescar() {
        var n = parseNum(input.value);
        detalle.innerHTML = "";
        resumen.innerHTML = "";

        if (!llevaMateriales()) {
          resumen.className = "unit-cost";
          resumen.appendChild(el("span", { text: "Se sumarán a tus existencias" }));
          resumen.appendChild(el("b", { text: fmtQty(n) + (n === 1 ? " unidad" : " unidades") }));
          accion.disabled = n <= 0;
          return;
        }

        var plan = batchPlan(p, n);
        plan.lines.forEach(function (l) {
          var unidad = stockUnit(l.material);
          detalle.appendChild(filaPlan(l.material.name || "Sin nombre",
            "usa " + conUnidad(l.use, unidad) + " · quedan " + fmtQty(Math.max(0, l.after)),
            l.after < 0 ? "short" : ""));
        });
        if (!plan.lines.length) {
          detalle.appendChild(el("p", { class: "note", style: "margin:8px 0 0",
            text: "Este producto no tiene " + rubro().insumoPlural + " con consumo definido." }));
        }

        var faltan = plan.lines.filter(function (l) { return l.deficit > 0; });
        if (faltan.length) {
          resumen.className = "unit-cost low";
          resumen.appendChild(el("span", { text: "No alcanza para ese lote · reponer cuesta " + money(plan.cost) }));
          resumen.appendChild(el("b", { text: faltan.length + (faltan.length === 1 ? " faltante" : " faltantes") }));
        } else {
          resumen.className = "unit-cost";
          resumen.appendChild(el("span", { text: "Costo de los " + rubro().insumoPlural + " que consume" }));
          resumen.appendChild(el("b", { text: money(costoLote(p, n)) }));
        }
        accion.disabled = n <= 0 || faltan.length > 0;
      }

      input.addEventListener("input", refrescar);
      cuerpo.appendChild(detalle);
      cuerpo.appendChild(resumen);
      refrescar();

      accion.addEventListener("click", function () {
        var res = fabricar(p, input.value);
        if (res.error) { toast(res.error); return; }

  /* ---------------- CSV ---------------- */

  function csvCell(v) {
    var s = String(v == null ? "" : v);
    if (/[";\n]/.test(s)) s = '"' + s.replace(/"/g, '""') + '"';
    return s;
  }

  function csvNum(n) {
    if (!isFinite(n)) return "";
    return n.toFixed(cfg().decimals).replace(".", ",");
  }

  /* el costo por unidad puede ser menor a 1 (ej: $0,8 por cm²), así que no se redondea a la moneda */
  function csvNumPrecise(n) {
    if (!isFinite(n)) return "";
    var s = n.toFixed(6).replace(/0+$/, "").replace(/\.$/, "");
    return s.replace(".", ",");
  }

  function buildProductsCsv() {
    var head = ["Nombre", "Tipo", "Materiales", "Costos fijos", "Costos variables", "Costo total",
      "Precio neto", "Impuesto %", "Impuesto", "Precio final",
      "Ganancia", "Margen %", "Markup %", "Moneda"];
    var lines = [head.map(csvCell).join(";")];
    state.products.forEach(function (p) {
      var r = calc(p);
      lines.push([
        p.name || "Sin nombre", p.type,
        csvNum(r.mats), csvNum(r.fijos), csvNum(r.variables), csvNum(r.total),
        csvNum(r.neto),
        state.settings.taxEnabled ? String(parseNum(state.settings.taxRate)).replace(".", ",") : "0",
        csvNum(r.tax), csvNum(r.final), csvNum(r.ganancia),
        isFinite(r.margen) ? r.margen.toFixed(1).replace(".", ",") : "",
        isFinite(r.markup) ? r.markup.toFixed(1).replace(".", ",") : "",
        state.settings.currency
      ].map(csvCell).join(";"));
    });
    return lines.join("\n");
  }

  function buildMaterialsCsv() {
    var lines = [["Material", "Categoría", "Unidad", "Origen del costo", "Precio de compra", "Unidades o pliegos",
      "Alto pliego", "Ancho pliego", "Cobro en producto", "Costo unitario",
      "Unidad de stock", "Stock", "Stock inicial", "Paquete", "Precio paquete", "Valor en inventario", "Moneda"].map(csvCell).join(";")];
    state.materials.forEach(function (m) {
      var compra = m.mode === "compra";
      var area = isArea(m.unit);
      lines.push([
        m.name || "Sin nombre", (m.categoria || "").trim(), m.unit,
        compra ? "compra" : "directo",
        compra ? csvNum(parseNum(m.buyPrice)) : "",
        compra ? String(parseNum(area ? (m.sheetQty || 1) : m.buyQty)).replace(".", ",") : "",
        area && compra ? String(parseNum(m.sheetH)).replace(".", ",") : "",
        area && compra ? String(parseNum(m.sheetW)).replace(".", ",") : "",
        hasSheet(m) ? (m.areaMode === "pliego" ? "pliego completo" : "área usada") : "",
        csvNumPrecise(materialCost(m)),
        stockUnit(m),
        String(parseNum(m.stock)).replace(".", ","),
        String(stockTarget(m)).replace(".", ","),
        String(packSize(m)).replace(".", ","),
        csvNum(packPrice(m)),
        csvNum(parseNum(m.stock) * stockUnitValue(m)),
        state.settings.currency
      ].map(csvCell).join(";"));
    });
    return lines.join("\n");
  }

  function download(filename, text) {
    try {
      var json = /\.json$/i.test(filename);
      var blob = new Blob([json ? text : "\ufeff" + text],
        { type: json ? "application/json;charset=utf-8;" : "text/csv;charset=utf-8;" });
      var url = URL.createObjectURL(blob);
      var a = el("a", { href: url, download: filename });
      document.body.appendChild(a);
      a.click();
      setTimeout(function () { URL.revokeObjectURL(url); a.remove(); }, 1500);
      toast("Descargando " + filename);
    } catch (err) {

    }
  }

  function copy(ta) {
    ta.removeAttribute("readonly");
    ta.select();
    ta.setSelectionRange(0, ta.value.length);
    var ok = false;
    try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
    ta.setAttribute("readonly", "");
    if (!ok && navigator.clipboard) {
      navigator.clipboard.writeText(ta.value).then(function () { toast("Copiado"); }).catch(function () { toast("Selecciona el texto y cópialo"); });
      return;

  /* ---------------- importación ---------------- */

  function norm(s) {
    var t = String(s == null ? "" : s).toLowerCase().trim();
    if (t.normalize) t = t.normalize("NFD").replace(/[\u0300-\u036f]/g, "");
    return t;
  }

  function parseCsv(text) {
    text = String(text || "").replace(/^\ufeff/, "");
    var firstLine = text.split(/\r?\n/)[0] || "";
    var counts = { ";": 0, ",": 0, "\t": 0 };
    Object.keys(counts).forEach(function (d) { counts[d] = firstLine.split(d).length - 1; });
    var delim = ";";
    if (counts[","] > counts[";"] && counts[","] >= counts["\t"]) delim = ",";
    else if (counts["\t"] > counts[";"] && counts["\t"] > counts[","]) delim = "\t";

    var rows = [], row = [], field = "", inQ = false, i = 0;
    while (i < text.length) {
      var c = text.charAt(i);
      if (inQ) {
        if (c === '"') {
          if (text.charAt(i + 1) === '"') { field += '"'; i += 2; continue; }
          inQ = false; i++; continue;
        }
        field += c; i++; continue;
      }
      if (c === '"') { inQ = true; i++; continue; }
      if (c === delim) { row.push(field); field = ""; i++; continue; }
      if (c === "\r") { i++; continue; }
      if (c === "\n") { row.push(field); rows.push(row); row = []; field = ""; i++; continue; }
      field += c; i++;
    }
    row.push(field); rows.push(row);
    return rows.filter(function (r) {
      return r.some(function (v) { return String(v).trim() !== ""; });
    });
  }

  function headerMap(row) {
    var map = {};
    row.forEach(function (h, idx) { map[norm(h)] = idx; });
    return map;
  }

  function pick(map, row, names) {
    for (var i = 0; i < names.length; i++) {
      var key = norm(names[i]);
      if (map[key] !== undefined) return String(row[map[key]] || "").trim();
    }
    return "";
  }

  function importMaterialsCsv(text, mode) {
    var rows = parseCsv(text);
    if (rows.length < 2) return { error: "El CSV no tiene filas de datos." };
    var map = headerMap(rows[0]);
    if (map["material"] === undefined && map["nombre"] === undefined) {
      return { error: "No encuentro la columna Material. Usa un CSV exportado desde esta planilla." };
    }

    var nuevos = [];
    for (var i = 1; i < rows.length; i++) {
      var row = rows[i];
      var name = pick(map, row, ["material", "nombre"]);
      var unit = normalizeUnit(pick(map, row, ["unidad"]));
      var origen = norm(pick(map, row, ["origen del costo", "origen"]));
      var m = { id: uid(), name: name, unit: unit, mode: origen.indexOf("compra") > -1 ? "compra" : "directo",
        /* los CSV anteriores no traen categoría: quedan sin ella */
        categoria: String(pick(map, row, ["categoría", "categoria"]) || "").trim(),
        cost: "", buyPrice: "", buyQty: "", sheetH: "", sheetW: "", sheetQty: "1", areaMode: "area",
        stock: parseNum(pick(map, row, ["stock", "existencias"])),
        stockTarget: parseNum(pick(map, row, ["stock inicial", "stock minimo", "minimo"])),
        stockMin: parseNum(pick(map, row, ["stock inicial", "stock minimo", "minimo"])) };

      if (m.mode === "compra") {
        m.buyPrice = parseNum(pick(map, row, ["precio de compra", "precio pagado"]));
        var cantidad = pick(map, row, ["unidades o pliegos", "unidades compradas", "cantidad"]);
        if (isArea(unit)) {
          m.sheetH = parseNum(pick(map, row, ["alto pliego", "alto"]));
          m.sheetW = parseNum(pick(map, row, ["ancho pliego", "ancho"]));
          m.sheetQty = parseNum(cantidad) || 1;
        } else {
          m.buyQty = parseNum(cantidad);
        }
      } else {
        m.cost = parseNum(pick(map, row, ["costo unitario", "costo"]));
      }
      if (norm(pick(map, row, ["cobro en producto"])).indexOf("pliego") > -1) m.areaMode = "pliego";

      if (!name && !m.cost && !m.buyPrice) continue;
      nuevos.push(m);
    }

    if (!nuevos.length) return { error: "No encontré materiales válidos en ese CSV." };

    var relinked = 0;
    if (mode === "reemplazar") {
      /* el CSV no guarda ids: reconectamos las líneas de los productos por nombre */
      var byName = {};
      nuevos.forEach(function (m) { if (m.name) byName[norm(m.name)] = m.id; });
      var oldNames = {};
      state.materials.forEach(function (m) { oldNames[m.id] = norm(m.name); });
      state.products.forEach(function (p) {
        p.materials.forEach(function (line) {
          var nuevoId = byName[oldNames[line.materialId]];
          if (nuevoId) { line.materialId = nuevoId; relinked++; }
        });
      });
      state.materials = nuevos;
    } else {
      state.materials = state.materials.concat(nuevos);
    }
    return { count: nuevos.length, relinked: relinked };
  }

  function importProductsCsv(text, mode) {
    var rows = parseCsv(text);
    if (rows.length < 2) return { error: "El CSV no tiene filas de datos." };
    var map = headerMap(rows[0]);
    if (map["nombre"] === undefined) {
      return { error: "No encuentro la columna Nombre. Usa un CSV exportado desde esta planilla." };
    }

    var nuevos = [];
    for (var i = 1; i < rows.length; i++) {
      var row = rows[i];
      var name = pick(map, row, ["nombre", "producto"]);
      if (!name) continue;

      var p = {
        id: uid(), name: name,
        type: norm(pick(map, row, ["tipo"])).indexOf("servicio") > -1 ? "servicio" : "producto",
        materials: [], costs: [],
        pricingMode: "manual", manualPrice: ""
      };

      /* los CSV antiguos traían modo y porcentaje; vale el precio ya calculado */
      p.manualPrice = parseNum(pick(map, row, ["precio neto", "precio"]));

      var mats = parseNum(pick(map, row, ["materiales"]));
      var fijos = parseNum(pick(map, row, ["costos fijos"]));
      var vars = parseNum(pick(map, row, ["costos variables"]));
      if (mats) p.costs.push({ id: uid(), name: "Materiales (del CSV)", amount: mats, kind: "variable" });
      if (vars) p.costs.push({ id: uid(), name: "Costos variables (del CSV)", amount: vars, kind: "variable" });
      if (fijos) p.costs.push({ id: uid(), name: "Costos fijos (del CSV)", amount: fijos, kind: "fijo" });

      nuevos.push(p);
    }

    if (!nuevos.length) return { error: "No encontré productos válidos en ese CSV." };
    state.products = mode === "reemplazar" ? nuevos : state.products.concat(nuevos);
    return { count: nuevos.length, partial: true };
  }

  function importBackup(text, mode) {
    var data;
    try { data = JSON.parse(text); } catch (e) { return { error: "Ese texto no es un respaldo válido (.json)." }; }
    if (!data || (!Array.isArray(data.materials) && !Array.isArray(data.products))) {
      return { error: "El archivo no tiene la estructura de un respaldo de esta planilla." };
    }

    var mats = Array.isArray(data.materials) ? data.materials : [];
    var prods = Array.isArray(data.products) ? data.products : [];

    if (mode === "reemplazar") {
      state.materials = mats;
      state.products = prods;
      if (Array.isArray(data.orders)) state.orders = data.orders;
      if (Array.isArray(data.historial)) state.historial = data.historial;
      if (Array.isArray(data.compras)) state.compras = data.compras;
      invalidarPPP();
      if (data.settings) state.settings = Object.assign(state.settings, data.settings);
    } else {
      var idMap = {};
      mats.forEach(function (m) {
        var nuevo = Object.assign({}, m, { id: uid() });
        idMap[m.id] = nuevo.id;
        state.materials.push(nuevo);
      });
      prods.forEach(function (p) {
        var nuevo = Object.assign({}, p, { id: uid() });
        nuevo.materials = (p.materials || []).map(function (l) {
          return Object.assign({}, l, { materialId: idMap[l.materialId] || l.materialId });
        });
        nuevo.costs = (p.costs || []).map(function (c) { return Object.assign({}, c, { id: uid() }); });
        state.products.push(nuevo);
      });
    }
    ui.open = {};
    return { count: mats.length + prods.length };
  }

  function openImportSheet(opts) {

    segOpts.forEach(function (o, i) {

          var btns = seg.querySelectorAll("button");
          for (var j = 0; j < btns.length; j++) btns[j].setAttribute("aria-pressed", j === i ? "true" : "false");
        } }));
    });

    var fileInput = el("input", { type: "file", accept: opts.accept, style: "display:none" });
    fileInput.addEventListener("change", function () {
      var f = fileInput.files && fileInput.files[0];
      if (!f) return;
      var reader = new FileReader();
      reader.onload = function () { ta.value = String(reader.result || ""); toast("Archivo cargado: " + f.name); };
      reader.onerror = function () { toast("No pude leer el archivo"); };
      reader.readAsText(f, "utf-8");
    });

    var bg = el("div", { class: "sheet-bg", onclick: function (e) { if (e.target === bg) bg.remove(); } });
    var sheet = el("div", { class: "sheet" }, [
      el("h3", { text: opts.title }),
      el("p", { class: "note", style: "margin:0 0 10px", text: opts.note }),
      el("button", { class: "btn wide", type: "button", text: "Elegir archivo", style: "margin-bottom:10px",
        onclick: function () { fileInput.click(); } }),
      fileInput,
      ta,
      seg,
      el("div", { class: "actions" }, [
        el("button", { class: "btn primary", type: "button", text: "Importar", onclick: function () {
          var text = ta.value.trim();
          if (!text) { toast("Pega el contenido o elige un archivo"); return; }
          var res = opts.run(text, mode);
          if (res.error) { toast(res.error); return; }
          guardarTodo(); bg.remove(); render();
          toast(res.count + " registro(s) importado(s)" + (res.partial ? " sin líneas de materiales" : ""));
        } }),
        el("button", { class: "btn", type: "button", text: "Cerrar", onclick: function () { bg.remove(); } })
      ])
    ]);
    bg.appendChild(sheet);
    document.body.appendChild(bg);
  }

  function importMaterialsSheet() {
    openImportSheet({
      title: "Importar materiales",
      note: "Acepta el CSV de materiales de esta planilla. Recupera unidad, origen del costo, medidas del pliego y modo de cobro.",
      accept: ".csv,text/csv,text/plain",
      run: importMaterialsCsv
    });
  }

  function importProductsSheet() {
    openImportSheet({
      title: "Importar productos",
      note: "El CSV de productos no guarda qué materiales usa cada uno. Se recuperan nombre, tipo y modo de precio; los costos llegan como líneas de costo, no como materiales con medidas. Para recuperar todo usa el respaldo .json.",
      accept: ".csv,text/csv,text/plain",
      run: importProductsCsv
    });
  }

  function importBackupSheet() {
    openImportSheet({
      title: "Restaurar respaldo",
      note: "Acepta el archivo .json exportado desde esta planilla. Recupera materiales, productos con sus medidas y ajustes.",
      accept: ".json,application/json,text/plain",
      run: importBackup
    });
  }

  /* ---------------- render general ---------------- */

  function render() {
    /* nombres de pestañas de versiones anteriores */
    if (ui.tab === "inicio") ui.tab = "pedidos";
    if (ui.tab === "inventario" && !moduloActivo("inventario")) ui.tab = "productos";
    ["pedidos", "productos", "inventario", "caja", "ajustes"].forEach(function (t) {
      document.getElementById("tab-" + t).hidden = ui.tab !== t;
    });
    var btns = document.querySelectorAll(".tabs button");
    for (var i = 0; i < btns.length; i++) {
      var activa = btns[i].dataset.tab === ui.tab;
      btns[i].setAttribute("aria-selected", activa ? "true" : "false");
      btns[i].setAttribute("tabindex", activa ? "0" : "-1");
    }
    if (ui.tab === "productos") renderProductos();
    else if (ui.tab === "pedidos") renderPedidos();
    else if (ui.tab === "inventario") renderInventario();
    else if (ui.tab === "caja") renderCaja();
    else renderAjustes();
    var cuenta = document.getElementById("btnCuenta");
    if (cuenta) cuenta.setAttribute("aria-pressed", ui.tab === "ajustes" ? "true" : "false");
    pintarContadores();
    if (hojaActiva) hojaActiva.repintar();
  }

  /* ---------------- arranque ---------------- */

  document.getElementById("btnNuevo").addEventListener("click", function () {
    ui.tab = "pedidos";
    addOrder();
  });

  var tabButtons = document.querySelectorAll(".tabs button");
  for (var i = 0; i < tabButtons.length; i++) {
    tabButtons[i].addEventListener("click", function () { ui.tab = this.dataset.tab; render(); });
  }

  /* una lista de pestañas se recorre con las flechas, no solo con el tabulador */
  document.querySelector(".tabs").addEventListener("keydown", function (e) {
    var paso = e.key === "ArrowRight" ? 1 : e.key === "ArrowLeft" ? -1 : 0;
    if (!paso && e.key !== "Home" && e.key !== "End") return;
    var visibles = Array.prototype.filter.call(tabButtons, function (b) { return !b.hidden; });
    if (!visibles.length) return;
    e.preventDefault();
    var actual = visibles.indexOf(document.activeElement);
    if (actual < 0) actual = 0;
    var destino = e.key === "Home" ? 0
      : e.key === "End" ? visibles.length - 1
      : (actual + paso + visibles.length) % visibles.length;
    visibles[destino].focus();
    ui.tab = visibles[destino].dataset.tab;
    render();
    /* render repinta: hay que recuperar el foco en la pestaña equivalente */
    var tras = document.querySelector('.tabs button[data-tab="' + ui.tab + '"]');
    if (tras) tras.focus();
  });

  /* instalable como app: el service worker guarda la planilla para abrir sin señal */
  if ("serviceWorker" in navigator && location.protocol !== "file:") {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("sw.js").catch(function () {});
    });
  }

  document.getElementById("btnGoogle").addEventListener("click", entrarConGoogle);
  gateOcupado(true, "Comprobando sesión…");

  /* nada se muestra hasta saber si hay sesión: la cuenta es obligatoria */
  fbInit().catch(function (err) {
    verGate(true);
    mostrarErrorAcceso(err);
  });
})();
</script>

</body>
</html>
