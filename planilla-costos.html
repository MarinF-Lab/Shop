    if (!state.materials.length) {
      matSec.appendChild(el("p", { class: "note", text: "Agrega " + rubro().insumoPlural + " en la pestaña " + rubro().insumos + " para poder asignarlos aquí." }));
    }

    p.materials.forEach(function (line, idx) {
      var m = materialById(line.materialId);
      var area = m && isArea(m.unit);
      var lineBox = el("div", { class: "mat-line" });

      var lineTotal = el("span", { class: "line-total", text: m ? money(lineCost(line).cost) : "—" });

      lineBox.appendChild(selectorMaterial(p, line, function () { save(p); render(); }));

      lineBox.appendChild(el("div", { class: "row", style: "margin-top:6px" }, [
        area ? null : el("div", { class: "grow" }, [el("label", { class: "field", style: "margin:0", text: "Cantidad" })]),
        area ? null : el("div", { class: "qty" }, [el("input", { class: "num", type: "text", inputmode: "decimal",
          value: line.qty, "aria-label": "Cantidad",
          oninput: function (e) { line.qty = e.target.value; save(p); refreshOutputs(); } })]),
        area ? null : lineTotal,
        deleteButton("Quitar material", function () { p.materials.splice(idx, 1); save(p); render(); })
      ]));

      if (area) {
        var side = sideUnit(m.unit);
        var detail = el("p", { class: "area-note" });

        function refreshLine() {
          var r2 = lineCost(line);
          var parts = [];
          if (r2.area > 0) parts.push(r2.area.toLocaleString("es-CL", { maximumFractionDigits: 2 }) + " " + m.unit + " = " + money(r2.costArea));
          if (r2.perSheet > 0) parts.push("entran " + r2.perSheet + " por pliego · usas " + r2.sheets + " = " + money(r2.costSheets));
          detail.textContent = parts.length ? parts.join(" · ") : "Ingresa alto, ancho y piezas.";
          detail.className = "area-note" + (m.areaMode === "pliego" && r2.costSheets != null ? " sheet" : "");
          lineTotal.textContent = money(r2.cost);

        function measure(label, key) {
          return el("div", { class: "grow" }, [
            el("label", { class: "field", text: label }),
            el("input", { class: "num", type: "text", inputmode: "decimal", value: line[key], placeholder: "0",

    matSec.appendChild(el("button", { class: "btn small", type: "button", text: "+ " + rubro().insumo,

      } }));

    /* crear el material sin salir del producto ni perder lo escrito */
    matSec.appendChild(el("button", { class: "btn small", type: "button",
      text: "+ " + rubro().insumo + " nuevo", style: "margin-left:6px",
      onclick: function () { crearMaterialDesdeProducto(p); } }));
    body.appendChild(matSec);

    /* costos adicionales */
    var costSec = el("div", { class: "sec" });
    costSec.appendChild(el("header", {}, [
      el("h4", { text: "Otros costos" }),
      el("span", { class: "sub", text: "Fijos " + money(r.fijos) + " · Variables " + money(r.variables) })
    ]));

    p.costs.forEach(function (c, idx) {

      });

      costSec.appendChild(el("div", { class: "row" }, [
        el("div", { class: "grow" }, [el("input", { type: "text", value: c.name, placeholder: "Ej: Mano de obra",
          oninput: function (e) { c.name = e.target.value; save(p); } })]),
        el("div", { class: "amt" }, [el("input", { class: "num", type: "text", inputmode: "decimal", value: c.amount, "aria-label": "Monto",
          oninput: function (e) { c.amount = e.target.value; save(p); refreshOutputs(); } })]),
        el("div", { class: "kind" }, [kindSel]),
        deleteButton("Quitar costo", function () { p.costs.splice(idx, 1); save(p); render(); })
      ]));
    });

    costSec.appendChild(el("button", { class: "btn small", type: "button", text: "+ Costo",
      onclick: function () { p.costs.push({ id: uid(), name: "", amount: "", kind: "variable" }); save(p); render(); } }));
    body.appendChild(costSec);

    /* precio */
    var priceSec = el("div", { class: "sec" });
    priceSec.appendChild(el("header", {}, [el("h4", { text: "Precio de venta" })]));
    priceSec.appendChild(el("p", { class: "note",
      text: "Precio neto que cobras, sin impuesto. La ganancia y el margen se calculan solos." }));

    priceSec.appendChild(el("div", { class: "campo-precio" }, [
      el("span", { class: "simbolo", text: cfg().symbol }),
      el("input", { class: "num", type: "text", inputmode: "decimal",
        value: p.manualPrice, placeholder: "0", "aria-label": "Precio neto",
        oninput: function (e) { p.manualPrice = e.target.value; save(p); refreshOutputs(); } })
    ]));
    body.appendChild(priceSec);

    /* publicación en la tienda */
    var pubCheck = el("input", { type: "checkbox" });
    pubCheck.checked = !!p.publicado;
    pubCheck.addEventListener("change", function () { p.publicado = pubCheck.checked; save(p); render(); });

    var pubSec = el("div", { class: "sec" }, [
      el("header", {}, [el("h4", { text: "Tienda pública" })]),
      el("label", { class: "switch" }, [pubCheck, el("span", { text: "Mostrar en el catálogo público" })])
    ]);
    if (p.publicado) {
      pubSec.appendChild(el("div", { class: "sec", style: "margin-top:10px" }, [
        el("label", { class: "field", text: "Descripción para el cliente" }),
        el("input", { type: "text", value: p.descripcionPublica || "", placeholder: "Ej: Tulipán artesanal de limpiapipas",
          oninput: function (e) { p.descripcionPublica = e.target.value; save(p); } })
      ]));
      pubSec.appendChild(el("p", { class: "note",
        text: "Se publica como " + money(r.final) + " y se ofrece por encargo: el cliente pide " +
          "la cantidad que quiera y tú la preparas. Tus costos y márgenes no salen a la tienda." }));
    }
    if (moduloActivo("tienda")) body.appendChild(pubSec);

    /* resultado */
    body.appendChild(resultTable(p));

    /* duplicar y eliminar */
    body.appendChild(el("div", { class: "sec" }, [
      el("button", { class: "btn small", type: "button", text: "Duplicar producto",
        style: "margin-right:6px", onclick: function () { duplicarProducto(p); } }),
      el("button", { class: "btn small peligro", type: "button", text: "Eliminar producto",
        onclick: function () {
          if (ui.confirming === p.id) {
            state.products = state.products.filter(function (x) { return x.id !== p.id; });
            marcarBorrado("productos", p.id);
            ui.confirming = null; render(); toast("Producto eliminado");
          } else {
            ui.confirming = p.id;
            toast("Toca otra vez para eliminar");
            setTimeout(function () { if (ui.confirming === p.id) ui.confirming = null; }, 3000);
          }
        } })
    ]));

    card.appendChild(body);
    return card;
  }

  function resultRow(label, value, cls) {
    var clases = (cls || "").split(" ").filter(Boolean);
    var esTotal = clases.indexOf("total") > -1;
    var color = clases.filter(function (c) { return c !== "total"; }).join(" ");
    return el("tr", esTotal ? { class: "total" } : {}, [
      el("th", { scope: "row", text: label }),
      el("td", { class: color, text: value })
    ]);
  }

  function resultTable(p) {
    var r = calc(p);
    var rows = [
      resultRow("Materiales", money(r.mats)),
      resultRow("Costos fijos", money(r.fijos)),
      resultRow("Costos variables", money(r.variables)),
      resultRow("Costo total", money(r.total), "total"),
      resultRow("Precio neto", money(r.neto))
    ];
    if (state.settings.taxEnabled) {
      rows.push(resultRow("Impuesto " + pct(parseNum(state.settings.taxRate)), money(r.tax)));
      rows.push(resultRow("Precio final", money(r.final), "total"));
    }
    /* la ganancia es la conclusión de la tabla: se lee como tal */
    rows.push(resultRow("Ganancia", money(r.ganancia), (r.ganancia < 0 ? "loss" : "gain") + " total"));
    rows.push(resultRow("De cada venta te queda", pct(r.margen)));

    var tbody = el("tbody", {}, rows);
    return el("div", { class: "result", "data-result": p.id }, [el("table", {}, [tbody])]);
  }

  function refreshOutputs() {
    /* actualiza chips y tabla de resultado sin re-render (mantiene el foco al escribir) */
    state.products.forEach(function (p) {
      var box = document.querySelector('[data-result="' + p.id + '"]');
      if (box) {
        var fresh = resultTable(p);
        box.parentNode.replaceChild(fresh, box);
      }
    });
    renderProductChips();
    renderStrip();
  }

  function renderProductChips() {
    var cards = document.querySelectorAll("#tab-productos .card");
    for (var i = 0; i < cards.length; i++) {
      var p = state.products[i];
      if (!p) continue;
      var r = calc(p);
      var chips = cards[i].querySelector(".chips");
      if (!chips) continue;
      chips.innerHTML = "";
      chips.appendChild(el("span", { class: "chip c", html: "Costo <b>" + money(r.total) + "</b>" }));
      chips.appendChild(el("span", { class: "chip p", html: "Precio <b>" + money(r.final) + "</b>" }));
      chips.appendChild(el("span", { class: "chip " + (r.ganancia < 0 ? "neg" : "g"),
        html: "Ganancia <b>" + money(r.ganancia) + "</b> · " + pct(r.margen) }));
    }
  }

  function renderStrip() {
    var strip = document.getElementById("stripTotals");
    if (!strip) return;
    var t = { costo: 0, precio: 0, ganancia: 0 };
    state.products.forEach(function (p) {
      var r = calc(p);
      t.costo += r.total; t.precio += r.final; t.ganancia += r.ganancia;
    });
    strip.innerHTML = "";
    [["Costo total", money(t.costo), ""], ["Ingreso total", money(t.precio), ""],
     ["Ganancia total", money(t.ganancia), t.ganancia < 0 ? "loss" : "gain"]].forEach(function (c) {
      strip.appendChild(el("div", {}, [
        el("dt", { text: c[0] }),
        el("dd", { text: c[1], style: c[2] === "gain" ? "color:var(--gain)" : c[2] === "loss" ? "color:var(--danger)" : "" })
      ]));
    });
  }

  function renderProductos() {
    var root = document.getElementById("tab-productos");
    root.innerHTML = "";
    root.appendChild(el("h2", { text: "Flores" }));
    root.appendChild(el("p", { class: "lead", text: "Lo que te cuesta cada flor y cuánto te queda al venderla." }));
    agregar(root, avisoPrecios());

    if (!state.products.length) {
      root.appendChild(el("div", { class: "empty" }, [
        el("p", { text: "Aún no hay productos ni servicios. Crea el primero y asígnale " + rubro().insumoPlural + " y costos." }),
        el("button", { class: "btn primary", type: "button", text: "Crear el primero", onclick: addProduct })
      ]));
    } else {
      var lista = el("div");

      var opciones = {
        texto: function (p) { return (p.name || "") + " " + (p.descripcionPublica || ""); },
        filtros: [
          { id: "publicados", label: "En la tienda",
            test: function (p) { return !!p.publicado; },
            contar: function () { return state.products.filter(function (p) { return p.publicado; }).length; } },
          { id: "sinprecio", label: "Sin precio",
            test: function (p) { return calc(p).final <= 0; },
            contar: function () { return state.products.filter(function (p) { return calc(p).final <= 0; }).length; } }
        ],
        ordenes: [
          { id: "nombre", label: "nombre", comparar: function (a, b) {
            return norm(a.name).localeCompare(norm(b.name)); } },
          { id: "ganancia", label: "más rentable", comparar: function (a, b) {
            return calc(b).ganancia - calc(a).ganancia; } },
          { id: "precio", label: "precio", comparar: function (a, b) {
            return calc(b).final - calc(a).final; } }
        ]
      };

      function pintarLista() {
        lista.innerHTML = "";
        var visibles = aplicarFiltro("productos", state.products.slice(), opciones);
        if (!visibles.length) { lista.appendChild(sinResultados("productos", pintarLista)); return; }
        visibles.forEach(function (p) { lista.appendChild(productCard(p)); });
      }

      agregar(root, barraBusqueda({
        lista: "productos",
        placeholder: "Buscar producto…",
        total: state.products.length,
        filtros: opciones.filtros,
        ordenes: opciones.ordenes,
        repintar: pintarLista
      }));
      root.appendChild(lista);
      pintarLista();

      root.appendChild(el("button", { class: "btn primary wide", type: "button", text: "+ Nueva flor", onclick: addProduct }));
      agregar(root, seccionHistorialCostos());
    }
  }

  function addProduct() {
    var p = { id: uid(), name: "", type: "producto", materials: [], costs: [],
      pricingMode: "manual", manualPrice: "", stock: "" };
    state.products.push(p);
    ui.open[p.id] = true;
    save(p); render();
  }

  /* ---------------- render: materiales ---------------- */

  /* cuánto le falta a un material para llegar a su nivel inicial */
  function falta(m) {
    var t = stockTarget(m);
    return t > 0 ? Math.max(0, t - parseNum(m.stock)) : 0;
  }

  /* ---------------- categorías de materiales ----------------
     Quien trabaja con limpiapipas no tiene doce materiales: tiene uno en
     doce colores. Las categorías se derivan de los propios materiales, así
     que no hay un catálogo aparte que mantener ni categorías huérfanas. */

  var SIN_CATEGORIA = "Sin categoría";

  function categoriaDe(m) {
    var c = (m && m.categoria ? String(m.categoria) : "").trim();
    return c || SIN_CATEGORIA;
  }

  function categoriasUsadas() {
    var vistas = {};
    state.materials.forEach(function (m) {
      var c = (m.categoria || "").trim();
      if (c) vistas[c] = true;
    });
    return Object.keys(vistas).sort(function (a, b) { return norm(a).localeCompare(norm(b)); });
  }

  /* agrupa una lista ya filtrada y ordenada; "Sin categoría" siempre al final */
  function agruparPorCategoria(materiales) {
    var mapa = {}, orden = [];
    materiales.forEach(function (m) {
      var c = categoriaDe(m);
      if (!mapa[c]) { mapa[c] = []; orden.push(c); }
      mapa[c].push(m);
    });
    orden.sort(function (a, b) {
      if (a === SIN_CATEGORIA) return 1;
      if (b === SIN_CATEGORIA) return -1;
      return norm(a).localeCompare(norm(b));
    });
    return orden.map(function (c) {
      var items = mapa[c];
      var valor = 0, bajos = 0;
      items.forEach(function (m) {
        valor += parseNum(m.stock) * stockUnitValue(m);
        if (falta(m) > 0) bajos++;
      });
      return { nombre: c, items: items, valor: valor, bajos: bajos };
    });
  }

  function claveCategoria(nombre) { return "cat:" + nombre; }

  /* desplegable con lo ya usado y la opción de crear una al vuelo */
  function selectorCategoria(m) {
    var sel = el("select", { "aria-label": "Categoría" });
    sel.appendChild(el("option", { value: "", text: SIN_CATEGORIA }));
    categoriasUsadas().forEach(function (c) {
      sel.appendChild(el("option", { value: c, text: c }));
    });
    sel.appendChild(el("option", { value: "__nueva__", text: "+ Crear categoría…" }));
    sel.value = (m.categoria || "").trim();

    sel.addEventListener("change", function () {
      if (sel.value !== "__nueva__") {
        m.categoria = sel.value;
        ui.ultimaCategoria = m.categoria;
        if (m.categoria) ui.open[claveCategoria(m.categoria)] = true;
        save(m); render();
        return;
      }
      sel.value = (m.categoria || "").trim();   /* hasta que se confirme */
      crearCategoria(m);
    });
    return sel;
  }

  function crearCategoria(m) {
    abrirVentana("Nueva categoría", function (cuerpo, sheet, cerrar) {
      var campo = el("input", { type: "text", placeholder: "Ej: Limpiapipas", "aria-label": "Nombre de la categoría" });
      cuerpo.appendChild(el("label", { class: "field", text: "Nombre" }));
      cuerpo.appendChild(campo);
      cuerpo.appendChild(el("p", { class: "note",
        text: "Agrupa " + rubro().insumoPlural + " que son lo mismo en distintas variantes: colores, tamaños, sabores." }));

      function guardar() {
        var nombre = campo.value.trim();
        if (!nombre) { toast("Ponle un nombre"); campo.focus(); return; }
        if (nombre === SIN_CATEGORIA) { toast("Ese nombre está reservado"); campo.focus(); return; }
        m.categoria = nombre;
        ui.ultimaCategoria = nombre;
        ui.open[claveCategoria(nombre)] = true;
        save(m); render(); cerrar();
        toast("Categoría “" + nombre + "” creada");
      }

      campo.addEventListener("keydown", function (e) { if (e.key === "Enter") guardar(); });
      sheet.appendChild(el("div", { class: "actions" }, [
        el("button", { class: "btn", type: "button", text: "Cancelar", onclick: cerrar }),
        el("button", { class: "btn primary", type: "button", text: "Crear", onclick: guardar })
      ]));
    });
  }

  /* renombrar, fusionar o eliminar una categoría desde su cabecera */
  function editarCategoria(g) {
    abrirVentana("Categoría " + g.nombre, function (cuerpo, sheet, cerrar) {
      var campo = el("input", { type: "text", value: g.nombre, "aria-label": "Nombre de la categoría" });
      cuerpo.appendChild(el("label", { class: "field", text: "Nombre" }));
      cuerpo.appendChild(campo);
      cuerpo.appendChild(el("p", { class: "note",
        text: "Agrupa " + g.items.length + " " + (g.items.length === 1 ? rubro().insumo.toLowerCase() : rubro().insumoPlural) + "." }));

      var aviso = el("p", { class: "note", style: "min-height:18px" });
      cuerpo.appendChild(aviso);

      /* si el nombre nuevo ya existe, renombrar es fusionar: hay que decirlo */
      function revisar() {
        var nuevo = campo.value.trim();
        var choca = nuevo && norm(nuevo) !== norm(g.nombre) &&
          categoriasUsadas().some(function (c) { return norm(c) === norm(nuevo); });
        aviso.className = "note" + (choca ? " aviso" : "");
        aviso.textContent = choca
          ? "Ya existe “" + nuevo + "”: se juntarán en una sola categoría."
          : "";
      }
      campo.addEventListener("input", revisar);
      revisar();

      function renombrar() {
        var nuevo = campo.value.trim();
        if (!nuevo) { toast("Ponle un nombre"); campo.focus(); return; }
        if (nuevo === SIN_CATEGORIA) { toast("Ese nombre está reservado"); campo.focus(); return; }
        if (nuevo === g.nombre) { cerrar(); return; }

        g.items.forEach(function (m) { m.categoria = nuevo; save(m); });
        /* la categoría no debe cerrarse sola por haberla renombrado */
        if (ui.open[claveCategoria(g.nombre)]) ui.open[claveCategoria(nuevo)] = true;
        delete ui.open[claveCategoria(g.nombre)];
        ui.ultimaCategoria = nuevo;
        render(); cerrar();
        toast("Ahora se llama “" + nuevo + "”");
      }

      function eliminar() {
        var cuantos = g.items.length;
        var mensaje = cuantos
          ? "Se eliminará la categoría y " + cuantos + " " +
            (cuantos === 1 ? rubro().insumo.toLowerCase() + " quedará" : rubro().insumoPlural + " quedarán") +
            " sin categoría. No se borra ninguno."
          : "Se eliminará la categoría.";
        if (!window.confirm(mensaje)) return;

        g.items.forEach(function (m) { m.categoria = ""; save(m); });
        delete ui.open[claveCategoria(g.nombre)];
        if (ui.ultimaCategoria === g.nombre) ui.ultimaCategoria = "";
        render(); cerrar();
        toast(cuantos ? cuantos + " sin categoría" : "Categoría eliminada");
      }

      campo.addEventListener("keydown", function (e) { if (e.key === "Enter") renombrar(); });

      cuerpo.appendChild(el("button", { class: "btn small peligro wide", type: "button",
        style: "margin-top:4px", text: "Eliminar categoría", onclick: eliminar }));

      sheet.appendChild(el("div", { class: "actions" }, [
        el("button", { class: "btn", type: "button", text: "Cancelar", onclick: cerrar }),
        el("button", { class: "btn primary", type: "button", text: "Guardar", onclick: renombrar })
      ]));
    });
  }

  /* botones con los colores de una categoría; muestra el stock y atenúa lo agotado */
  function selectorColor(categoria, actual, alElegir) {
    var fila = el("div", { class: "chips-filtro colores" });
    var opciones = state.materials.filter(function (m) { return categoriaDe(m) === categoria; })
      .sort(function (a, b) { return norm(a.name).localeCompare(norm(b.name)); });
    if (!categoria || !opciones.length) {
      fila.appendChild(el("p", { class: "note", style: "margin:0",
        text: categoria ? "No hay materiales en “" + categoria + "”." : "Elige primero el tipo de limpiapipas." }));
      return fila;
    }
    opciones.forEach(function (m) {
      var stock = parseNum(m.stock);
      var b = el("button", { class: "chip-filtro chip-mat" + (stock <= 0 ? " agotado" : ""), type: "button",
        "aria-pressed": actual === m.id ? "true" : "false",
        "aria-label": (m.name || "Sin nombre") + ", quedan " + fmtQty(stock),
        onclick: function () { alElegir(m.id); } }, [
        el("span", { class: "nom", text: m.name || "Sin nombre" }),
        el("small", { text: fmtQty(stock) })
      ]);
      fila.appendChild(b);
    });
    return fila;
  }

  function selectorCategoriaSimple(actual, alCambiar) {
    var sel = el("select", { "aria-label": "Tipo de limpiapipas" });
    sel.appendChild(el("option", { value: "", text: "Elegir tipo…" }));
    categoriasUsadas().forEach(function (c) { sel.appendChild(el("option", { value: c, text: c })); });
    sel.value = actual || "";
    sel.addEventListener("change", function () { alCambiar(sel.value); });
    return sel;
  }

  /* receta de la flor: cuántos pétalos y hojas, de qué tipo de limpiapipas */
  function seccionFlor(p) {
    if (!p.flor) p.flor = {};
    var f = p.flor;
    var sec = el("div", { class: "sec" });
    sec.appendChild(el("header", {}, [el("h4", { text: "Pétalos y hojas" })]));
    sec.appendChild(el("p", { class: "note", style: "margin:0 0 8px",
      text: "Lo que lleva color a elección del cliente. Barra, cinta y lo demás van en Otros materiales." }));

    function num(label, clave) {
      return el("div", { class: "grow" }, [
        el("label", { class: "field", text: label }),
        el("input", { class: "num", type: "text", inputmode: "decimal", value: f[clave] || "", placeholder: "0",
          "aria-label": label,
          oninput: function (e) { f[clave] = e.target.value; save(p); refreshOutputs(); } })
      ]);
    }

    sec.appendChild(el("label", { class: "field", text: "Tipo de limpiapipas de los pétalos" }));
    sec.appendChild(selectorCategoriaSimple(f.catPetalos, function (c) {
      f.catPetalos = c; f.colorDefecto = ""; save(p); render();
    }));
    sec.appendChild(el("div", { class: "row measures", style: "margin-top:8px" }, [
      num("Pétalos (un color)", "petalosUno"),
      num("Bicolor: primario", "petalosPrim"),
      num("Bicolor: secundario", "petalosSec")
    ]));
    if (f.catPetalos) {
      sec.appendChild(el("label", { class: "field", style: "margin-top:8px", text: "Color de referencia (para el costo)" }));
      sec.appendChild(selectorColor(f.catPetalos, f.colorDefecto, function (id) { f.colorDefecto = id; save(p); render(); }));
    }

    sec.appendChild(el("label", { class: "field", style: "margin-top:12px", text: "Tipo de limpiapipas de las hojas" }));
    sec.appendChild(selectorCategoriaSimple(f.catHojas, function (c) {
      f.catHojas = c; f.colorHojas = ""; save(p); render();
    }));
    sec.appendChild(el("div", { class: "row measures", style: "margin-top:8px" }, [num("Hojas por flor", "hojas")]));
    if (f.catHojas) {
      sec.appendChild(el("label", { class: "field", style: "margin-top:8px", text: "Color de hojas habitual" }));
      sec.appendChild(selectorColor(f.catHojas, f.colorHojas, function (id) { f.colorHojas = id; save(p); render(); }));
    }
    return sec;
  }

  /* en el pedido: un color o bicolor, primario, secundario y hojas */
  function coloresDePedido(o, it, p) {
    var f = florDe(p), e = eleccionDe(p, it);
    var caja = el("div", { class: "colores-pedido" });
    var cambiar = function (clave, valor) { it[clave] = valor; save(o); render(); };

    var tienePetalos = f.petalosUno > 0 || admiteBicolor(p);
    if (!tienePetalos && f.hojas <= 0) {
      caja.appendChild(el("p", { class: "note", style: "margin:0",
        text: "Esta flor no tiene pétalos ni hojas configurados en su receta." }));
      return caja;
    }

    if (tienePetalos) {
      if (admiteBicolor(p)) {
        var seg = el("div", { class: "seg tiny" });
        [["uno", "Un color · " + fmtQty(f.petalosUno) + " pétalos"],
         ["dos", "Bicolor · " + fmtQty(f.petalosPrim) + " + " + fmtQty(f.petalosSec)]].forEach(function (op) {
          seg.appendChild(el("button", { type: "button", text: op[1], "aria-pressed": e.modo === op[0],
            onclick: function () { cambiar("modo", op[0]); } }));
        });
        caja.appendChild(seg);
      }
      caja.appendChild(el("label", { class: "field", style: "margin-top:8px",
        text: e.modo === "dos" ? "Color primario" : "Color de los pétalos" }));
      caja.appendChild(selectorColor(f.catPetalos, e.primario, function (id) { cambiar("primario", id); }));
      if (e.modo === "dos") {
        caja.appendChild(el("label", { class: "field", style: "margin-top:8px", text: "Color secundario" }));
        caja.appendChild(selectorColor(f.catPetalos, e.secundario, function (id) { cambiar("secundario", id); }));
      }
    }
    if (f.hojas > 0) {
      caja.appendChild(el("label", { class: "field", style: "margin-top:8px", text: "Color de las hojas" }));
      caja.appendChild(selectorColor(f.catHojas, e.hojas, function (id) { cambiar("hojasColor", id); }));
    }
    caja.appendChild(el("p", { class: "note", style: "margin:8px 0 0", text: describirColores(p, it) }));
    return caja;
  }

  /* ---------------- pagos y abonos ----------------
     Un pago mixto son dos pagos; un abono es un pago más. Con eso basta. */

  var METODOS_PAGO = [["efectivo", "Efectivo"], ["transferencia", "Transferencia"]];

  function cobrado(o) {
    return (o.pagos || []).reduce(function (t, x) { return t + parseNum(x.monto); }, 0);
  }

  function estadoPago(o) {
    var total = orderTotals(o).ingreso, pagado = cobrado(o);
    if (pagado <= 0) return { id: "porcobrar", label: "Por cobrar", saldo: total };
    if (pagado + 0.5 < total) return { id: "abonado", label: "Abonado", saldo: total - pagado };
    return { id: "pagado", label: "Pagado", saldo: total - pagado };
  }

  function seccionPagos(o) {
    if (!o.pagos) o.pagos = [];
    var total = orderTotals(o).ingreso;
    var est = estadoPago(o);
    var sec = el("div", { class: "sec" });
    sec.appendChild(el("header", {}, [
      el("h4", { text: "Pagos" }),
      el("span", { class: "sub", text: money(cobrado(o)) + " de " + money(total) })
    ]));

    if (!o.pagos.length) {
      sec.appendChild(el("p", { class: "note", style: "margin:0 0 6px", text: "Sin pagos registrados." }));
    }
    o.pagos.forEach(function (x, idx) {
      var metodo = el("select", { "aria-label": "Forma de pago" });
      METODOS_PAGO.forEach(function (m) { metodo.appendChild(el("option", { value: m[0], text: m[1] })); });
      metodo.value = x.metodo || "efectivo";
      metodo.addEventListener("change", function () { x.metodo = metodo.value; save(o); render(); });
      sec.appendChild(el("div", { class: "row" }, [
        el("div", { class: "grow" }, [el("input", { type: "date", value: x.fecha || "", "aria-label": "Fecha del pago",
          onchange: function (e) { x.fecha = e.target.value; save(o); renderPronto(); } })]),
        el("div", { class: "grow" }, [metodo]),
        el("div", { class: "amt" }, [el("input", { class: "num", type: "text", inputmode: "decimal",
          value: x.monto, "aria-label": "Monto",
          oninput: function (e) { x.monto = e.target.value; save(o); },
          onchange: function () { renderPronto(); } })]),
        deleteButton("Quitar pago", function () { o.pagos.splice(idx, 1); save(o); render(); })
      ]));
    });

    sec.appendChild(el("button", { class: "btn small", type: "button", text: "+ Pago",
      onclick: function () {
        var saldo = Math.max(0, total - cobrado(o));
        o.pagos.push({ id: uid(), fecha: hoy(), metodo: "efectivo", monto: Math.round(saldo) });
        save(o); render();
      } }));

    var resumen = el("div", { class: "unit-cost" + (est.id === "pagado" ? "" : " low"), style: "margin-top:10px" });
    if (est.saldo < -0.5) {
      resumen.appendChild(el("span", { text: "Se cobró de más" }));
      resumen.appendChild(el("b", { text: money(-est.saldo) }));
    } else if (est.id === "pagado") {
      resumen.appendChild(el("span", { text: "Pagado completo" }));
      resumen.appendChild(el("b", { text: money(total) }));
    } else {
      resumen.appendChild(el("span", { text: "Falta por cobrar" }));
      resumen.appendChild(el("b", { text: money(est.saldo) }));
    }
    sec.appendChild(resumen);
    return sec;
  }

  /* qué se gastó en un pedido ya entregado */
  function seccionConsumo(o) {
    if (o.estado !== "entregado" || !(o.consumo || []).length) return null;
    var sec = el("div", { class: "sec" });
    sec.appendChild(el("header", {}, [el("h4", { text: "Lo que se usó" })]));
    (o.colores || []).forEach(function (c) {
      sec.appendChild(el("p", { class: "note", style: "margin:0 0 4px",
        text: fmtQty(c.qty) + " × " + c.flor + (c.detalle ? " · " + c.detalle : "") }));
    });
    var plan = el("div", { class: "plan" });
    o.consumo.forEach(function (c) {
      plan.appendChild(el("div", { class: "plan-row" }, [
        el("span", { class: "plan-name", text: c.nombre }),
        el("span", { class: "plan-use", text: conUnidad(c.cantidad, c.unidad) })
      ]));
    });
    sec.appendChild(plan);
    return sec;
  }

  /* ---------------- elegir material con botones ----------------
     Un desplegable nativo con cuarenta colores abre un menú que tapa la
     pantalla. Aquí la elección ocurre dentro del propio recuadro: primero
     la categoría, después el color. */

  var MINIMO_POR_CATEGORIA = 8;

  function botonChip(texto, activo, onclick) {
    return el("button", { class: "chip-filtro", type: "button",
      "aria-pressed": activo ? "true" : "false", text: texto, onclick: onclick });
  }

  /* el nombre manda; el precio acompaña, para no leer dos veces lo mismo */
  function botonMaterial(m, activo, onclick) {
    return el("button", { class: "chip-filtro chip-mat", type: "button",
      "aria-pressed": activo ? "true" : "false",
      "aria-label": etiquetaMaterial(m), onclick: onclick }, [
      el("span", { class: "nom", text: m.name || "Sin nombre" }),
      el("small", { text: money(materialCost(m)) + "/" + m.unit })
    ]);
  }

  function etiquetaMaterial(m) {
    return (m.name || "Sin nombre") + " (" + money(materialCost(m)) + "/" + m.unit + ")";
  }

  /* devuelve el bloque de selección para una línea de material de un producto */
  function selectorMaterial(p, line, alElegir) {
    var caja = el("div", { class: "selector-mat" });
    var elegido = materialById(line.materialId);

    /* qué categoría se está mirando; por defecto, la del material ya elegido */
    var claveVista = "sel:" + p.id + ":" + (line.materialId || "nuevo");
    if (ui.verCategoria[claveVista] === undefined) {
      ui.verCategoria[claveVista] = elegido ? categoriaDe(elegido) : null;
    }

    var grupos = agruparPorCategoria(state.materials.slice().sort(function (a, b) {
      return norm(a.name).localeCompare(norm(b.name));
    }));
    /* con pocos materiales, pedir dos toques sería peor que uno */
    var directo = grupos.length <= 1 || state.materials.length < MINIMO_POR_CATEGORIA;

    function pintar() {
      caja.innerHTML = "";

      if (elegido && !ui.cambiando[claveVista]) {
        caja.appendChild(el("div", { class: "mat-elegido" }, [
          el("span", { class: "nombre", text: etiquetaMaterial(elegido) }),
          el("button", { class: "btn small", type: "button", text: "Cambiar",
            onclick: function () { ui.cambiando[claveVista] = true; pintar(); } })
        ]));
        return;
      }

      var vista = ui.verCategoria[claveVista];

      if (!directo) {
        var filaCat = el("div", { class: "chips-filtro" });
        grupos.forEach(function (g) {
          filaCat.appendChild(botonChip(g.nombre + " · " + g.items.length, vista === g.nombre, function () {
            ui.verCategoria[claveVista] = vista === g.nombre ? null : g.nombre;
            pintar();
          }));
        });
        caja.appendChild(filaCat);
        if (!vista) {
          caja.appendChild(el("p", { class: "note", style: "margin:6px 2px 0",
            text: "Elige una categoría para ver sus " + rubro().insumoPlural + "." }));
          return;
        }
      }

      var items = directo
        ? state.materials.slice().sort(function (a, b) { return norm(a.name).localeCompare(norm(b.name)); })
        : (grupos.filter(function (g) { return g.nombre === vista; })[0] || { items: [] }).items;

      var filaMat = el("div", { class: "chips-filtro", style: "margin-top:6px" });
      items.forEach(function (m) {
        filaMat.appendChild(botonMaterial(m, line.materialId === m.id, function () {
          line.materialId = m.id;
          ui.cambiando[claveVista] = false;
          alElegir();
        }));
      });
      caja.appendChild(filaMat);
    }

    pintar();
    return caja;
  }

  /* vista de materiales dentro de Inventario: catálogo y existencias juntos */
  function pintarMateriales(root) {
    root.appendChild(el("p", { class: "note", style: "margin:0 2px 12px",
      text: "Esta lista se reutiliza en todos los productos. Escribe el costo por unidad, o el precio de compra y las unidades que trae para que se calcule solo." }));

    if (!state.materials.length) {
      root.appendChild(el("div", { class: "empty" }, [
        el("p", { text: "Sin " + rubro().insumoPlural + " todavía. Agrégalos con su unidad y costo, o con el precio de compra y cuántas unidades trae." }),
        el("button", { class: "btn primary", type: "button", text: "Agregar " + rubro().insumo.toLowerCase(), onclick: addMaterial })
      ]));
      return;
    }

    var t = inventoryTotals();
    var strip = el("dl", { class: "strip" });
    [["Valor en inventario", money(t.valor), ""],
     ["Bajo el inicial", String(t.bajos) + (t.bajos === 1 ? " ítem" : " ítems"), t.bajos ? "loss" : ""],
     ["Reponer cuesta", money(t.reposicion), "cost"]].forEach(function (c) {
      strip.appendChild(el("div", {}, [
        el("dt", { text: c[0] }),
        el("dd", { text: c[1], style: c[2] === "loss" ? "color:var(--danger)" : c[2] === "cost" ? "color:var(--cost)" : "" })
      ]));
    });
    root.appendChild(strip);

    var listaMat = el("div");

    var opsMat = {
      texto: function (m) { return m.name || ""; },
      filtros: [
        { id: "bajos", label: "Bajo el mínimo",
          test: function (m) { return stockTarget(m) > 0 && parseNum(m.stock) < stockTarget(m); },
          contar: function () { return inventoryTotals().bajos; } },
        { id: "sinstock", label: "Sin existencia",
          test: function (m) { return parseNum(m.stock) <= 0; },
          contar: function () { return state.materials.filter(function (m) { return parseNum(m.stock) <= 0; }).length; } },
        { id: "sincosto", label: "Sin costo",
          test: function (m) { return materialCost(m) <= 0; },
          contar: function () { return state.materials.filter(function (m) { return materialCost(m) <= 0; }).length; } }
      ],
      ordenes: [
        { id: "nombre", label: "nombre", comparar: function (a, b) {
          return norm(a.name).localeCompare(norm(b.name)); } },
        { id: "critico", label: "lo más crítico", comparar: function (a, b) {
          return falta(b) - falta(a); } },
        { id: "valor", label: "valor en inventario", comparar: function (a, b) {
          return parseNum(b.stock) * stockUnitValue(b) - parseNum(a.stock) * stockUnitValue(a); } }
      ]
    };

    agregar(root, barraBusqueda({
      lista: "materiales",
      placeholder: "Buscar " + rubro().insumo.toLowerCase() + "…",
      total: state.materials.length,
      filtros: opsMat.filtros,
      ordenes: opsMat.ordenes,
      repintar: function () { render(); }
    }));
    root.appendChild(listaMat);

    var visiblesMat = aplicarFiltro("materiales", state.materials.slice(), opsMat);
    if (!visiblesMat.length) {
      listaMat.appendChild(sinResultados("materiales", function () { render(); }));
    }

    var grupos = agruparPorCategoria(visiblesMat);
    var hayBusqueda = !!(filtro("materiales").q || filtro("materiales").tag);
    var destinos = {};   /* dónde va cada ficha: dentro de su categoría */

    grupos.forEach(function (g) {
      var clave = claveCategoria(g.nombre);
      /* con una sola categoría no tiene sentido obligar a abrirla;
         buscando, se abre sola o el buscador no serviría de nada */
      var abierta = hayBusqueda || grupos.length === 1 || !!ui.open[clave];

      var resumen = g.items.length + (g.items.length === 1 ? " ítem" : " ítems") + " · " + money(g.valor);
      var cabecera = el("div", { class: "cat-head" + (abierta ? " open" : ""), role: "button",
        tabindex: "0", "aria-expanded": abierta ? "true" : "false",
        onclick: function () { ui.open[clave] = !abierta; render(); } }, [
        el("span", { class: "caret", text: "▸" }),
        el("h4", { text: g.nombre }),
        g.bajos ? el("span", { class: "chip neg", text: g.bajos + " bajo" }) : null,
        el("span", { class: "cat-resumen", text: resumen }),
        /* "Sin categoría" no es una categoría: es la ausencia de una */
        g.nombre === SIN_CATEGORIA ? null : el("button", { class: "editar", type: "button",
          title: "Editar categoría", "aria-label": "Editar la categoría " + g.nombre, text: "✎",
          onclick: function (e) { e.stopPropagation(); editarCategoria(g); } })
      ]);
      cabecera.addEventListener("keydown", function (e) {
        if (e.key === "Enter" || e.key === " ") { e.preventDefault(); ui.open[clave] = !abierta; render(); }
      });

      var cuerpo = el("div", { class: "cat-body" });
      cuerpo.hidden = !abierta;
      listaMat.appendChild(el("div", { class: "cat" }, [cabecera, cuerpo]));
      g.items.forEach(function (m) { destinos[m.id] = cuerpo; });
    });

    visiblesMat.forEach(function (m) {
      var idx = state.materials.indexOf(m);
      var abiertaFicha = !!ui.open[m.id];
      var card = el("div", { class: "mat-card" + (abiertaFicha ? "" : " plegada") });

      /* fila de una línea: nombre, existencia y costo; se abre al tocarla */
      var fila = el("div", { class: "mat-head" + (abiertaFicha ? " open" : ""), role: "button",
        tabindex: "0", "aria-expanded": abiertaFicha ? "true" : "false",
        onclick: function () { ui.open[m.id] = !abiertaFicha; render(); } }, [
        el("span", { class: "caret", text: "▸" }),
        el("span", { class: "mat-nombre", text: m.name || "Sin nombre" }),
        el("span", { class: "mat-datos" + (falta(m) > 0 ? " low" : ""),
          text: conUnidad(parseNum(m.stock), stockUnit(m)) + " · " + money(materialCost(m)) })
      ]);
      fila.addEventListener("keydown", function (e) {
        if (e.key === "Enter" || e.key === " ") { e.preventDefault(); ui.open[m.id] = !abiertaFicha; render(); }
      });
      card.appendChild(fila);

      var detalle = el("div", { class: "mat-detalle" });
      detalle.hidden = !abiertaFicha;

      var unitSel = el("select", { "aria-label": "Unidad" });
      UNITS.forEach(function (u) { unitSel.appendChild(el("option", { value: u, text: u })); });
      if (UNITS.indexOf(m.unit) === -1) unitSel.appendChild(el("option", { value: m.unit, text: m.unit }));
      unitSel.value = m.unit;
      unitSel.addEventListener("change", function () { m.unit = unitSel.value; save(m); render(); });

      var readout = el("div", { class: "unit-cost" }, [
        el("span", { "data-unitlabel": m.id, text: "Costo por " + m.unit }),
        el("b", { "data-unitcost": m.id, text: money(materialCost(m)) })
      ]);

      function refresh() {
        var node = card.querySelector("[data-unitcost]");
        if (node) node.textContent = money(materialCost(m));
        var lbl = card.querySelector("[data-unitlabel]");
        if (lbl) {
          lbl.textContent = "Costo por " + m.unit +

  function addMaterial() {
    var nuevo = { id: uid(), name: "", unit: "unidad", mode: "directo", cost: "",
      buyPrice: "", buyQty: "", sheetH: "", sheetW: "", sheetQty: "1", areaMode: "area",
      stock: "", stockMin: "", categoria: ui.ultimaCategoria || "" };
    state.materials.push(nuevo);
    ui.open[nuevo.id] = true;   /* nace abierto: hay que escribir en él */
    if (nuevo.categoria) ui.open[claveCategoria(nuevo.categoria)] = true;
    save(nuevo); render();
    var ficha = document.querySelector('.mat-card .mat-detalle:not([hidden]) input[type=text]');
    if (ficha) { ficha.focus(); ficha.scrollIntoView({ block: "center" }); }
  }

  /* ---------------- render: pedidos ---------------- */

  function estadoLabel(id) {
    for (var i = 0; i < ESTADOS.length; i++) if (ESTADOS[i].id === id) return ESTADOS[i].label;
    return id;
  }

  /* ---------------- Ramo: la agenda ----------------
     Arriba, todo lo que falta hacer en una franja; al centro, el pedido más
     urgente (o el elegido) dibujado como ramo; debajo, la lista completa en
     orden de entrega y lo entregado el último mes. */

  var ETAPAS = [["pendiente", "Anotado"], ["proceso", "Armando"], ["listo", "Listo"]];

  function estaAbierto(o) { return o.estado === "pendiente" || o.estado === "proceso" || o.estado === "listo"; }

  function ordenEntrega(a, b) {
    var fa = a.fecha || "9999-12-31", fb2 = b.fecha || "9999-12-31";
    return fa !== fb2 ? fa.localeCompare(fb2) : String(a.creado || "").localeCompare(String(b.creado || ""));
  }

  /* el color de un limpiapipas se deduce de su nombre: "Rosa", "Verde claro"… */
  var COLORES_NOMBRE = [
    ["verde claro", "#7BBF5A"], ["verde lima", "#A4CF3E"], ["lima", "#A4CF3E"], ["verde oscuro", "#2F6B3A"],
    ["verde agua", "#7FD1B9"], ["menta", "#9ED9C0"], ["verde", "#4E9F3D"],
    ["rosa palo", "#F1C1C9"], ["rosado", "#F28DB2"], ["fucsia", "#D63384"], ["magenta", "#C2185B"], ["rosa", "#F28DB2"],
    ["rojo", "#D7263D"], ["burdeo", "#7B1E2B"], ["vino", "#7B1E2B"], ["coral", "#F27059"], ["salmon", "#F4A28C"],
    ["naranjo", "#F08A24"], ["naranja", "#F08A24"], ["amarillo", "#F6C431"], ["mostaza", "#D4A017"],
    ["dorado", "#D4AF37"], ["oro", "#D4AF37"],
    ["lila", "#B79CED"], ["lavanda", "#C3B1E1"], ["morado", "#6B3FA0"], ["violeta", "#7F4FC9"], ["purpura", "#6B3FA0"],
    ["celeste", "#7EC8E3"], ["turquesa", "#30B5B0"], ["calipso", "#30B5B0"], ["azul", "#2F5DA8"],
    ["blanco", "#FFFFFF"], ["crema", "#F5ECD7"], ["beige", "#E8D8B8"], ["cafe", "#7A5230"], ["marron", "#7A5230"],
    ["gris", "#9A9A9A"], ["plateado", "#C0C0C0"], ["plata", "#C0C0C0"], ["negro", "#2B2A26"]
  ];

  /* neutro: para materiales que no son de color (tallos, cinta) */
  function colorDe(materialId, neutro) {
    var m = materialById(materialId);
    if (!m) return "#E6DCCB";
    if (/^#[0-9a-f]{3,8}$/i.test(String(m.color || ""))) return m.color;
    var n = norm(m.name || "");
    for (var i = 0; i < COLORES_NOMBRE.length; i++) {
      if (n.indexOf(COLORES_NOMBRE[i][0]) > -1) return COLORES_NOMBRE[i][1];
    }
    if (neutro) return "#D9CFBF";
    /* sin pista en el nombre: un tono suave, siempre el mismo para ese material */
    var h = 0;
    for (var j = 0; j < n.length; j++) h = (h * 31 + n.charCodeAt(j)) % 360;
    return "hsl(" + h + ", 55%, 70%)";
  }

  function coloresLinea(it) {
    var p = productById(it.productId);
    if (!p) return null;
    var e = eleccionDe(p, it);
    var p1 = colorDe(e.primario);
    return { p1: p1, p2: e.modo === "dos" && e.secundario ? colorDe(e.secundario) : p1,
      hoja: e.hojas ? colorDe(e.hojas) : "#4E9F3D" };
  }

  function coloresPedido(o) {
    var items = o.items || [];
    for (var i = 0; i < items.length; i++) {
      var c = coloresLinea(items[i]);
      if (c) return c;
    }
    return { p1: "#E6DCCB", p2: "#E6DCCB", hoja: "#4E9F3D" };
  }

  function degradado(c) { return "background:linear-gradient(90deg," + c.p1 + " 50%," + c.p2 + " 50%)"; }

  function petalosSvg(a, b, tam) {
    var s = '<svg viewBox="0 0 48 48" width="' + tam + '" height="' + tam + '" aria-hidden="true"><g transform="translate(24 24)">';
    for (var i = 0; i < 6; i++) {
      s += '<ellipse cx="0" cy="-10" rx="6.5" ry="10.5" fill="' + (i % 2 ? b : a) +
        '" stroke="#5B4A3A" stroke-opacity="0.35" transform="rotate(' + (i * 60) + ')"/>';
    }
    return s + '<circle r="4.5" fill="#E9B949"/></g></svg>';
  }

  function svgEl(html) { var t = document.createElement("span"); t.innerHTML = html; return t.firstChild; }

  /* el ramo del pedido: hasta siete flores con sus colores, tallos del color de las hojas */
  var POS_RAMO = [[110, 44, 0], [72, 66, -18], [148, 66, 18], [44, 104, -30], [176, 104, 30], [90, 108, -8], [130, 110, 10]];

  function ramoSvg(o, tarde) {
    var u = [];
    (o.items || []).forEach(function (it) {
      var c = coloresLinea(it);
      if (!c) return;
      for (var k = 0; k < parseNum(it.qty) && u.length < POS_RAMO.length; k++) u.push(c);
    });
    var s = '<svg viewBox="0 0 220 230" width="220" height="230" aria-hidden="true">' +
      '<circle cx="110" cy="100" r="90" fill="' + (tarde ? "#F7E2D9" : "#EEF5E8") + '"/>';
    u.forEach(function (c, i) {
      var q = POS_RAMO[i];
      s += '<line x1="' + q[0] + '" y1="' + q[1] + '" x2="110" y2="196" stroke="' + c.hoja + '" stroke-width="3" stroke-linecap="round"/>';
    });
    u.forEach(function (c, i) {
      var q = POS_RAMO[i], a = i % 2 ? c.p2 : c.p1, b = i % 2 ? c.p1 : c.p2;
      s += '<g transform="translate(' + q[0] + ' ' + q[1] + ') rotate(' + q[2] + ') scale(1.04)">';
      for (var j = 0; j < 6; j++) {
        s += '<ellipse cx="0" cy="-10" rx="6.5" ry="10.5" fill="' + (j % 2 ? b : a) +
          '" stroke="#5B4A3A" stroke-opacity="0.35" transform="rotate(' + (j * 60) + ')"/>';
      }
      s += '<circle r="4.5" fill="#E9B949"/></g>';
    });
    s += '<path d="M62 168 L158 168 L114 228 L106 228 Z" fill="#D9B98C"/>' +
      '<path d="M62 168 L110 176 L158 168 L150 180 L110 186 L70 180 Z" fill="#C9A672"/>' +
      '<path d="M96 196 Q110 204 124 196 L120 206 Q110 211 100 206 Z" fill="#2F5D3A"/>';
    return s + "</svg>";
  }

  /* "jue 15 oct" */
  function diaCorto(iso) {
    var d = new Date(String(iso).slice(0, 10) + "T12:00:00");
    if (isNaN(d)) return String(iso || "");
    return DIAS_CORTOS[d.getDay()] + " " + d.getDate() + " " + MESES_CORTOS[d.getMonth()];
  }

  function cuandoTxt(o) {
    var n = diasHasta(o.fecha);
    if (n === null) return "Sin fecha";
    if (n < 0) return "Atrasado " + (-n) + (n === -1 ? " día" : " días");
    if (n === 0) return "Hoy";
    if (n === 1) return "Mañana";
    return "En " + n + " días";
  }

  function claseCuando(o) {
    if (estaAbierto(o) && atrasado(o)) return " tarde";
    return diasHasta(o.fecha) === 0 ? " hoy" : "";
  }

  /* "6 tulipanes"; si el nombre tiene varias palabras, "Rosa grande ×6" */
  function nombreFlor(p, q) {
    var n = p.name || "Flor";
    if (q === 1) return "1 " + n;
    if (/\s/.test(n.trim())) return n + " ×" + fmtQty(q);
    var plural;
    if (/[aeiouáéíóú]$/i.test(n)) plural = n + "s";
    else if (/z$/i.test(n)) plural = n.slice(0, -1) + "ces";
    else {
      var sin = { "á": "a", "é": "e", "í": "i", "ó": "o", "ú": "u" };
      plural = n.replace(/([áéíóú])([^aeiouáéíóú]*)$/i, function (x, v, r) { return (sin[v] || v) + r; }) + "es";
    }
    return fmtQty(q) + " " + plural.toLowerCase();
  }

  function textoPedido(o) {
    return (o.cliente || "") + " " + (o.instagram || "") + " " + (o.whatsapp || "") + " " + (o.comuna || "") + " " +
      (o.notas || "") + " " + (o.items || []).map(function (it) {
        var p = productById(it.productId);
        return p ? p.name : "";
      }).join(" ");
  }

  function renderPedidos() {
    var root = document.getElementById("tab-pedidos");
    root.innerHTML = "";

    if (!state.products.length) {
      root.appendChild(el("div", { class: "empty" }, [
        el("p", { text: "Los pedidos se arman con tus flores. Crea al menos una primero." }),
        el("button", { class: "btn primary", type: "button", text: "Ir a Flores",
          onclick: function () { ui.tab = "productos"; render(); } })
      ]));
      return;
    }

    var porHacer = state.orders.filter(estaAbierto).sort(ordenEntrega);
    var foco = porHacer.filter(function (o) { return o.id === ui.foco; })[0] || porHacer[0] || null;

    if (porHacer.length > 1) root.appendChild(franjaPorHacer(porHacer, foco));
    if (foco) {
      root.appendChild(el("p", { class: "etiqueta", text: foco.id === ui.foco ? "Pedido elegido" : "Lo más urgente" }));
      root.appendChild(tarjetaRamo(foco));
    } else {
      root.appendChild(el("div", { class: "ramo-vacio" }, [
        el("p", { text: state.orders.length ? "No queda nada por hacer. ¡A descansar!" : "Tu agenda está vacía." }),
        el("button", { class: "btn primary", type: "button", text: "Anotar un pedido", onclick: addOrder })
      ]));
    }
    if (porHacer.length > 1) root.appendChild(listaPorHacer(porHacer, foco));
    root.appendChild(seccionHechos());
  }

  function franjaPorHacer(lista, foco) {
    var caja = el("div", { class: "franja" }, [el("h3", { class: "etiqueta", text: "Por hacer · " + lista.length })]);
    var fila = el("div", { class: "franja-fila", role: "group", "aria-label": "Pedidos por hacer" });
    lista.forEach(function (o) {
      var c = coloresPedido(o), on = !!foco && o.id === foco.id;
      var b = el("button", { type: "button", class: "franja-chip" + (on ? " on" : "") + claseCuando(o),
        "aria-pressed": on, "aria-label": (o.cliente || "Sin nombre") + ", " + resumenFlores(o) + ", " + cuandoTxt(o),
        onclick: function () { ui.foco = o.id; render(); } });
      b.appendChild(svgEl(petalosSvg(c.p1, c.p2, 32)));
      b.appendChild(el("span", { class: "nom", text: (o.cliente || "Sin nombre").split(" ")[0] }));
      b.appendChild(el("span", { class: "dia", text: o.fecha ? diaCorto(o.fecha) : "sin fecha" }));
      b.appendChild(el("span", { class: "cuando" + claseCuando(o), text: cuandoTxt(o) }));
      fila.appendChild(b);
    });
    caja.appendChild(fila);
    return caja;
  }

  function tarjetaRamo(o) {
    var t = orderTotals(o), pago = estadoPago(o), tarde = atrasado(o);
    var card = el("article", { class: "ramo-card", "aria-labelledby": "foco-nombre" });

    var dibujo = el("div", { class: "ramo-dibujo" });
    dibujo.innerHTML = ramoSvg(o, tarde);
    if (t.unidades > POS_RAMO.length) dibujo.appendChild(el("span", { class: "ramo-mas", text: "×" + fmtQty(t.unidades) }));
    card.appendChild(dibujo);

    card.appendChild(el("div", { class: "ramo-titulo" }, [
      el("span", { class: "cuando-chip" + claseCuando(o), text: cuandoTxt(o) + (o.fecha ? " · " + diaCorto(o.fecha) : "") }),
      el("h2", { id: "foco-nombre", text: o.cliente || "Sin nombre" }),
      el("p", { text: [o.instagram, o.whatsapp].filter(Boolean).join(" · ") || "Sin contacto" })
    ]));

    var lineas = el("ul", { class: "ramo-lineas" });
    (o.items || []).forEach(function (it) {
      var p = productById(it.productId);
      if (!p) return;
      var q = parseNum(it.qty);
      lineas.appendChild(el("li", {}, [
        el("span", { class: "punto-color", style: degradado(coloresLinea(it)) }),
        el("span", { class: "txt" }, [
          el("strong", { text: nombreFlor(p, q) }),
          el("span", { text: describirColores(p, it) || "—" })
        ]),
        el("span", { class: "sub", text: money((parseNum(it.price) || calc(p).final) * q) })
      ]));
    });
    card.appendChild(lineas);

    card.appendChild(el("div", { class: "ramo-datos" }, [
      el("strong", { text: [o.metodo, o.comuna].filter(Boolean).join(" · ") || "Entrega por definir" }),
      o.creado ? el("span", { text: "Pedido el " + diaCorto(o.creado) }) : null,
      o.notas ? el("span", { text: "Notas: " + o.notas }) : null
    ]));

    var plan = planEntrega(o);
    if (!plan.ok) card.appendChild(el("p", { class: "ramo-aviso", text: textoFaltantes(plan) }));

    var etapas = el("div", { class: "seg ramo-etapas", role: "group", "aria-label": "Avance del pedido" });
    ETAPAS.forEach(function (e2) {
      etapas.appendChild(el("button", { type: "button", text: e2[1], "aria-pressed": o.estado === e2[0],
        onclick: function () { o.estado = e2[0]; sincronizarEstado(o); save(o); render(); } }));
    });
    card.appendChild(etapas);

    card.appendChild(el("div", { class: "ramo-pago" }, [
      el("span", { class: "chip pago-" + pago.id, text: pago.label }),
      el("span", { class: "grow" }, [document.createTextNode("Pagado "), el("strong", { text: money(cobrado(o)) }),
        document.createTextNode(" de " + money(t.ingreso))]),
      pago.saldo > 0.5 ? el("span", { class: "falta", text: "Falta " + money(pago.saldo) }) : null
    ]));

    card.appendChild(el("div", { class: "ramo-acciones" }, [
      el("button", { class: "btn", type: "button", text: "Editar", onclick: function () { abrirPedido(o); } }),
      el("button", { class: "btn", type: "button", text: "Registrar abono", onclick: function () { abrirAbono(o); } })
    ]));
    card.appendChild(el("button", { class: "btn primary grande wide", type: "button", text: "Marcar como entregado",
      onclick: function () { abrirEntrega(o); } }));
    return card;
  }

  /* una fila de la agenda: bloque de fecha, cliente, flores y pago */
  function filaPedido(o, on, onclick) {
    var abiertoYa = estaAbierto(o), pago = estadoPago(o);
    var ref = abiertoYa ? o.fecha : (o.entregado || o.fecha);
    var dt = ref ? new Date(String(ref).slice(0, 10) + "T12:00:00") : null;
    var dia = el("span", { class: "fila-dia" + (abiertoYa ? claseCuando(o) : ""), "aria-hidden": "true" },
      dt && !isNaN(dt) ? [el("span", { class: "dsem", text: DIAS_CORTOS[dt.getDay()] }),
        el("span", { class: "dnum", text: String(dt.getDate()) })]
        : [el("span", { class: "dsem", text: "sin" }), el("span", { class: "dnum", text: "—" })]);
    var cuando = abiertoYa ? cuandoTxt(o)
      : o.estado === "cancelado" ? "Cancelado"
      : "Entregado" + (o.entregado ? " el " + diaCorto(o.entregado) : "");
    var b = el("button", { type: "button", class: "fila-ramo" + (on ? " on" : "") + (abiertoYa ? claseCuando(o) : ""),
      "aria-label": (o.cliente || "Sin nombre") + ", " + resumenFlores(o) + ", " + cuando + ", " + pago.label +
        (on ? ", en la tarjeta" : ""),
      onclick: onclick }, [
      dia,
      el("span", { class: "fila-info" }, [
        el("span", { class: "cli", text: o.cliente || "Sin nombre" }),
        el("span", { class: "res", text: resumenFlores(o) }),
        el("span", { class: "cuando" + (abiertoYa ? claseCuando(o) : ""), text: cuando })
      ]),
      el("span", { class: "chip pago-" + pago.id, text: abiertoYa || pago.saldo > 0.5 ? pago.label : money(orderTotals(o).ingreso) })
    ]);
    if (on) b.setAttribute("aria-current", "true");
    return b;
  }

  function listaPorHacer(lista, foco) {
    var caja = el("div", {}, [el("h3", { class: "etiqueta", text: "Por hacer · en orden de entrega" })]);
    var ul = el("ul", { class: "lista-ramo" });
    lista.forEach(function (o) {
      ul.appendChild(el("li", {}, [filaPedido(o, !!foco && foco.id === o.id, function () {
        ui.foco = o.id; render(); window.scrollTo(0, 0);
      })]));
    });
    caja.appendChild(ul);
    return caja;
  }

  /* lo hecho crece sin fin: a la vista, el último mes; lo demás, a pedido.
     Buscando se recorren todos los pedidos. */
  function seccionHechos() {
    var caja = el("div", { class: "hechos" });
    var titulo = el("h3", { class: "etiqueta" });
    var buscador = el("input", { type: "search", class: "buscar-pedidos", placeholder: "Buscar en todos los pedidos…",
      "aria-label": "Buscar pedidos", value: ui.buscarPedidos || "" });
    var lista = el("div");
    caja.appendChild(titulo);
    caja.appendChild(buscador);
    caja.appendChild(lista);

    function abrirDesdeLista(o) {
      if (estaAbierto(o)) { ui.foco = o.id; render(); window.scrollTo(0, 0); }
      else abrirPedido(o);
    }

    function pintar() {
      lista.innerHTML = "";
      var q = (ui.buscarPedidos || "").trim();
      var ul = el("ul", { class: "lista-ramo" });
      if (q) {
        titulo.textContent = "Resultados";
        var res = state.orders.filter(function (o) { return coincide(textoPedido(o), q); })
          .sort(function (a, b) { return String(b.fecha || b.creado || "").localeCompare(String(a.fecha || a.creado || "")); });
        if (!res.length) {
          lista.appendChild(el("p", { class: "note", text: "Ningún pedido coincide con “" + q + "”." }));
          return;
        }
        res.forEach(function (o) { ul.appendChild(el("li", {}, [filaPedido(o, false, function () { abrirDesdeLista(o); })])); });
        lista.appendChild(ul);
        return;
      }
      titulo.textContent = "Hechos · último mes";
      var hechos = state.orders.filter(function (o) { return !estaAbierto(o); }).sort(function (a, b) {
        return String(b.entregado || b.fecha || b.creado || "").localeCompare(String(a.entregado || a.fecha || a.creado || ""));
      });
      var corte = new Date(); corte.setDate(corte.getDate() - 30);
      var desde = fechaLocal(corte);
      var recientes = hechos.filter(function (o) { return String(o.entregado || o.fecha || o.creado || "") >= desde; });
      var antiguos = hechos.length - recientes.length;
      var visibles = ui.hechosAntiguos ? hechos : recientes;
      if (!visibles.length) lista.appendChild(el("p", { class: "note", text: "Aún no entregas nada este mes." }));
      visibles.forEach(function (o) { ul.appendChild(el("li", {}, [filaPedido(o, false, function () { abrirPedido(o); })])); });
      if (visibles.length) lista.appendChild(ul);
      if (antiguos) {
        lista.appendChild(el("button", { class: "btn wide ver-anteriores", type: "button", "aria-expanded": !!ui.hechosAntiguos,
          text: ui.hechosAntiguos ? "Ocultar anteriores" : "Ver anteriores (" + antiguos + ")",
          onclick: function () { ui.hechosAntiguos = !ui.hechosAntiguos; pintar(); } }));
      }
    }

    buscador.addEventListener("input", function () { ui.buscarPedidos = buscador.value; pintar(); });
    pintar();
    return caja;
  }

  /* "sáb 18 oct": la fecha de entrega se lee de un vistazo en la agenda */
  var DIAS_CORTOS = ["dom", "lun", "mar", "mié", "jue", "vie", "sáb"];
  var MESES_CORTOS = ["ene", "feb", "mar", "abr", "may", "jun", "jul", "ago", "sep", "oct", "nov", "dic"];

  function fechaCorta(iso) {
    var d = new Date(String(iso).slice(0, 10) + "T12:00:00");
    if (isNaN(d)) return String(iso || "");
    var dias = diasHasta(String(iso).slice(0, 10));
    var base = DIAS_CORTOS[d.getDay()] + " " + d.getDate() + " " + MESES_CORTOS[d.getMonth()];
    if (dias === 0) return "hoy, " + base;
    if (dias === 1) return "mañana, " + base;
    if (d.getFullYear() !== new Date().getFullYear()) base += " " + d.getFullYear();
    return base;
  }

  /* lo que este pedido va a consumir con los colores elegidos, frente al stock */
  function seccionMaterialesPorUsar(o) {
    var plan = planEntrega(o);
    var consumo = {};
    plan.lineas.forEach(function (l) {
      l.consumos.forEach(function (c) {
        if (!consumo[c.material.id]) consumo[c.material.id] = { material: c.material, use: 0 };
        consumo[c.material.id].use += c.use;
      });
    });
    var sec = el("div", { class: "sec" });
    sec.appendChild(el("header", {}, [el("h4", { text: "Materiales que usará" })]));
    var claves = Object.keys(consumo);
    if (!claves.length) {
      sec.appendChild(el("p", { class: "note", style: "margin:0",
        text: "Elige las flores y sus colores para ver qué materiales necesita." }));
      return sec;
    }
    var lista = el("div", { class: "plan" });
    claves.forEach(function (k) {
      var c = consumo[k], stock = parseNum(c.material.stock), falta = c.use - stock;
      lista.appendChild(el("div", { class: "plan-row" + (falta > 1e-9 ? " short" : "") }, [
        el("span", { class: "plan-name", text: c.material.name || "Sin nombre" }),
        el("span", { class: "plan-use", text: conUnidad(c.use, stockUnit(c.material)) +
          (falta > 1e-9 ? " · faltan " + fmtQty(falta) : " · hay " + fmtQty(stock)) })
      ]));
    });
    sec.appendChild(lista);
    var pend = plan.faltantes.filter(function (f) { return f.sinCantidad; });
    if (pend.length) {
      sec.appendChild(el("p", { class: "note aviso", style: "margin:6px 0 0",
        text: pend.map(function (f) { return f.nombre; }).join(" · ") }));
    }
    return sec;
  }

  /* resumen de las flores: "Tulipán ×2, Rosa ×1" */
  function resumenFlores(o) {
    var cuenta = {}, orden = [];
    (o.items || []).forEach(function (it) {
      var p = productById(it.productId);
      var n = p ? (p.name || "Flor") : "Flor sin elegir";
      if (!(n in cuenta)) { cuenta[n] = 0; orden.push(n); }
      cuenta[n] += parseNum(it.qty);
    });
    if (!orden.length) return "sin flores";
    return orden.map(function (n) { return n + " ×" + fmtQty(cuenta[n]); }).join(", ");
  }

  /* ---------------- hojas del pedido ----------------
     Una hoja inferior se repinta con cada render(): los selectores de color
     y los pagos ya llaman a render() al cambiar, y así se mantiene al día. */

  var hojaActiva = null;

  function abrirHoja(titulo, pintar, alCerrar) {
    var h = {};
    abrirVentana(titulo, function (cuerpo, sheet, cerrar) {
      h.sheet = sheet;
      h.cerrar = cerrar;
      h.repintar = function () {
        if (!document.body.contains(sheet)) { if (hojaActiva === h) hojaActiva = null; return; }
        var arriba = sheet.scrollTop;
        var antes = enfocables(sheet), idx = antes.indexOf(document.activeElement);
        cuerpo.innerHTML = "";
        pintar(cuerpo, cerrar, h);
        sheet.scrollTop = arriba;
        /* el foco vuelve al mismo lugar: sin esto, cada toque lo perdería */
        if (idx > -1) {
          var despues = enfocables(sheet);
          if (despues[idx]) despues[idx].focus({ preventScroll: true });
        }
      };
      hojaActiva = h;
      pintar(cuerpo, cerrar, h);
    }, function () {
      if (hojaActiva === h) hojaActiva = null;
      if (alCerrar) alCerrar();
    });
    return h;
  }

  function campoHoja(id, etiqueta, valor, opts) {
    opts = opts || {};
    return el("div", { class: "hoja-campo" }, [
      el("label", { for: id, text: etiqueta }),
      el("input", { id: id, type: opts.tipo || "text", value: valor || "", placeholder: opts.placeholder || "",
        inputmode: opts.inputmode || null, autocomplete: "off", oninput: opts.oninput })
    ]);
  }

  function nuevaLinea() {
    var p = state.products[0];
    return { productId: p ? p.id : "", qty: 1, price: p ? Math.round(calc(p).final) : 0 };
  }

  var PASOS_PEDIDO = ["Cliente", "Flores", "Entrega", "Pago"];

  function validarPaso(o, paso) {
    if (paso === 1 && !String(o.cliente || "").trim()) return { msg: "Falta el nombre de quien encarga." };
    if (paso === 2) {
      if (!(o.items || []).length) return { msg: "Agrega al menos una flor." };
      for (var i = 0; i < o.items.length; i++) {
        var p = productById(o.items[i].productId);
        if (!p) return { msg: "Elige qué flor es la " + (i + 1) + ".", linea: i };
        var faltan = coloresPendientes(p, o.items[i]);
        if (faltan.length) return { msg: "Falta elegir " + faltan.join(" y ") + " de la flor " + (i + 1) + ".", linea: i };
      }
    }
    return null;
  }

  /* pedido nuevo o existente, en cuatro pasos cortos */
  function abrirPedido(o, nuevo) {
    var paso = 1, linea = 0, error = "";
    abrirHoja(nuevo ? "Nuevo pedido" : "Editar pedido", function (cuerpo, cerrar, h) {
      /* si el pedido se borró desde otro dispositivo, la hoja no tiene qué mostrar */
      if (state.orders.indexOf(o) < 0) {
        var vivo = state.orders.filter(function (x) { return x.id === o.id; })[0];
        if (!vivo) { cerrar(); return; }
        o = vivo;
      }
      function ir(n) {
        for (var k = paso; k < n; k++) {
          var e = validarPaso(o, k);
          if (e) {
            error = e.msg; paso = k;
            if (e.linea != null) linea = e.linea;
            h.repintar();
            return false;
          }
        }
        error = ""; paso = n;
        h.repintar();
        h.sheet.scrollTop = 0;
        return true;
      }

      var pasos = el("div", { class: "seg pasos", role: "group", "aria-label": "Pasos del pedido" });
      PASOS_PEDIDO.forEach(function (nombre, i) {
        pasos.appendChild(el("button", { type: "button", text: nombre, "aria-pressed": paso === i + 1,
          onclick: function () { ir(i + 1); } }));
      });
      cuerpo.appendChild(pasos);

      if (paso === 1) pasoCliente(cuerpo, o);
      else if (paso === 2) pasoFlores(cuerpo, o, linea, function (i) { linea = i; error = ""; h.repintar(); });
      else if (paso === 3) pasoEntrega(cuerpo, o);
      else pasoPago(cuerpo, o, cerrar);

      if (error) cuerpo.appendChild(el("p", { class: "error-hoja", role: "alert", text: error }));

      var pie = el("div", { class: "pie-hoja" });
      if (paso > 1) pie.appendChild(el("button", { class: "btn", type: "button", text: "Atrás",
        onclick: function () { error = ""; paso--; h.repintar(); h.sheet.scrollTop = 0; } }));
      if (paso < 4) pie.appendChild(el("button", { class: "btn primary", type: "button", text: "Siguiente",
        onclick: function () { ir(paso + 1); } }));
      else pie.appendChild(el("button", { class: "btn primary", type: "button", text: nuevo ? "Guardar pedido" : "Listo",
        onclick: function () { if (ir(4)) { cerrar(); toast(nuevo ? "Pedido anotado" : "Pedido guardado"); } } }));
      cuerpo.appendChild(pie);
    }, function () {
      /* un pedido nuevo que se cerró sin datos no queda como "Sin nombre" */
      if (nuevo && !String(o.cliente || "").trim() && !(o.pagos || []).length) {
        state.orders = state.orders.filter(function (x) { return x.id !== o.id; });
        marcarBorrado("pedidos", o.id);
      } else if (nuevo) {
        ui.foco = o.id;
      }
      render();
    });
  }

  function pasoCliente(cuerpo, o) {
    cuerpo.appendChild(campoHoja("ped-cliente", "¿Quién lo encarga?", o.cliente,
      { placeholder: "Nombre", oninput: function (e) { o.cliente = e.target.value; save(o); } }));
    cuerpo.appendChild(campoHoja("ped-ig", "Instagram", o.instagram,
      { placeholder: "@usuario", oninput: function (e) { o.instagram = e.target.value; save(o); } }));
    cuerpo.appendChild(campoHoja("ped-tel", "Teléfono", o.whatsapp,
      { tipo: "tel", placeholder: "+56 9 …", oninput: function (e) { o.whatsapp = e.target.value; save(o); } }));
  }

  function pasoFlores(cuerpo, o, linea, elegir) {
    if (!o.items) o.items = [];
    if (!o.items.length) { o.items.push(nuevaLinea()); save(o); }
    linea = Math.max(0, Math.min(linea, o.items.length - 1));

    var chips = el("div", { class: "lineas-pedido", role: "group", "aria-label": "Flores del pedido" });
    o.items.forEach(function (it, i) {
      var p = productById(it.productId), c = coloresLinea(it) || coloresPedido({});
      chips.appendChild(el("button", { type: "button", class: "linea-chip" + (i === linea ? " on" : ""),
        "aria-pressed": i === linea, onclick: function () { elegir(i); } }, [
        el("span", { class: "punto-color", style: degradado(c) }),
        el("span", { text: p ? nombreFlor(p, parseNum(it.qty)) : "Elige la flor" })
      ]));
    });
    chips.appendChild(el("button", { type: "button", class: "linea-chip mas", text: "+ Otra flor",
      onclick: function () { o.items.push(nuevaLinea()); save(o); elegir(o.items.length - 1); } }));
    cuerpo.appendChild(chips);

    var it = o.items[linea], p = productById(it.productId), q = parseNum(it.qty);
    var c = coloresLinea(it) || coloresPedido({});
    cuerpo.appendChild(el("div", { class: "vista-flor" }, [
      svgEl(petalosSvg(c.p1, c.p2, 52)),
      el("div", {}, [
        el("strong", { text: p ? nombreFlor(p, q) + " · " + money((parseNum(it.price) || calc(p).final) * q) : "Elige la flor" }),
        el("span", { "aria-live": "polite", text: p ? describirColores(p, it) : "" })
      ])
    ]));

    var flores = el("div", { class: "chips-filtro", role: "group", "aria-label": "Flor" });
    state.products.forEach(function (p2) {
      flores.appendChild(el("button", { type: "button", class: "chip-filtro", "aria-pressed": it.productId === p2.id,
        text: (p2.name || "Sin nombre") + " · " + money(calc(p2).final),
        onclick: function () { it.productId = p2.id; it.price = Math.round(calc(p2).final); save(o); render(); } }));
    });
    cuerpo.appendChild(el("fieldset", { class: "hoja-grupo" }, [el("legend", { text: "Flor y cantidad" }), flores,
      el("div", { class: "stepper" }, [
        el("button", { class: "icon-btn", type: "button", "aria-label": "Una menos", text: "−",
          onclick: function () { it.qty = Math.max(1, parseNum(it.qty) - 1); save(o); render(); } }),
        el("output", { "aria-live": "polite", text: fmtQty(q) }),
        el("button", { class: "icon-btn", type: "button", "aria-label": "Una más", text: "+",
          onclick: function () { it.qty = parseNum(it.qty) + 1; save(o); render(); } })
      ])]));

    if (p) cuerpo.appendChild(coloresDePedido(o, it, p));
    if (o.items.length > 1) {
      cuerpo.appendChild(el("button", { class: "btn peligro wide", type: "button", text: "Quitar esta flor",
        style: "margin-top:10px", onclick: function () { o.items.splice(linea, 1); save(o); elegir(Math.max(0, linea - 1)); } }));
    }
    cuerpo.appendChild(seccionMaterialesPorUsar(o));
  }

  function pasoEntrega(cuerpo, o) {
    cuerpo.appendChild(el("div", { class: "hoja-fila" }, [
      campoHoja("ped-creado", "Pedido el", o.creado, { tipo: "date", oninput: function (e) { o.creado = e.target.value; save(o); } }),
      campoHoja("ped-fecha", "Entrega el", o.fecha, { tipo: "date", oninput: function (e) { o.fecha = e.target.value; save(o); } })
    ]));
    var formas = el("div", { class: "seg formas", role: "group", "aria-label": "Forma de entrega" });
    METODOS.forEach(function (m) {
      formas.appendChild(el("button", { type: "button", text: m, "aria-pressed": (o.metodo || METODOS[0]) === m,
        onclick: function () { o.metodo = m; save(o); render(); } }));
    });
    cuerpo.appendChild(el("fieldset", { class: "hoja-grupo" }, [el("legend", { text: "Forma de entrega" }), formas]));
    cuerpo.appendChild(campoHoja("ped-dir", "Dirección o comuna", o.comuna,
      { placeholder: "Ej: Ñuñoa, o el punto de encuentro", oninput: function (e) { o.comuna = e.target.value; save(o); } }));
    cuerpo.appendChild(campoHoja("ped-notas", "Notas", o.notas,
      { placeholder: "Dedicatoria, envoltorio, detalles", oninput: function (e) { o.notas = e.target.value; save(o); } }));
  }

  function pasoPago(cuerpo, o, cerrar) {
    var t = orderTotals(o);
    var lineas = el("ul", { class: "resumen-pago" });
    (o.items || []).forEach(function (it) {
      var p = productById(it.productId);
      if (!p) return;
      var q = parseNum(it.qty), precio = parseNum(it.price) || calc(p).final;
      lineas.appendChild(el("li", {}, [el("span", { text: nombreFlor(p, q) + " × " + money(precio) }),
        el("span", { text: money(precio * q) })]));
    });
    cuerpo.appendChild(lineas);
    cuerpo.appendChild(el("div", { class: "total-pago" }, [el("span", { text: "Total" }), el("strong", { text: money(t.ingreso) })]));
    cuerpo.appendChild(seccionPagos(o));

    if (o.estado === "entregado") {
      cuerpo.appendChild(el("p", { class: "note", text: "Entregado" + (o.entregado ? " el " + diaCorto(o.entregado) : "") + "." }));
      agregar(cuerpo, seccionConsumo(o));
    } else {
      var estados = el("div", { class: "seg", role: "group", "aria-label": "Estado del pedido" });
      ETAPAS.concat([["cancelado", "Cancelado"]]).forEach(function (e2) {
        estados.appendChild(el("button", { type: "button", text: e2[1], "aria-pressed": o.estado === e2[0],
          onclick: function () { o.estado = e2[0]; sincronizarEstado(o); save(o); render(); } }));
      });
      cuerpo.appendChild(el("fieldset", { class: "hoja-grupo", style: "margin-top:16px" }, [el("legend", { text: "Estado" }), estados]));
    }

    cuerpo.appendChild(el("button", { class: "btn peligro wide", type: "button", text: "Eliminar pedido", style: "margin-top:16px",
      onclick: function () {
        if (ui.confirming === o.id) {
          state.orders = state.orders.filter(function (x) { return x.id !== o.id; });
          marcarBorrado("pedidos", o.id);
          ui.confirming = null;
          cerrar(); render(); toast("Pedido eliminado");
        } else {
          ui.confirming = o.id;
          toast("Toca otra vez para eliminar");
          setTimeout(function () { if (ui.confirming === o.id) ui.confirming = null; }, 3000);
        }
      } }));
  }

  function abrirAbono(o, resto) {
    var saldo0 = Math.max(0, estadoPago(o).saldo);
    var monto = resto && saldo0 > 0 ? String(Math.round(saldo0 * 100) / 100) : "", metodo = "transferencia", error = "";
    abrirHoja("Registrar abono", function (cuerpo, cerrar, h) {
      var total = orderTotals(o).ingreso, saldo = Math.max(0, estadoPago(o).saldo);
      cuerpo.appendChild(el("p", { class: "lead", text: (o.cliente || "Sin nombre") + " · falta " + money(saldo) + " de " + money(total) }));
      cuerpo.appendChild(campoHoja("abono-monto", "Monto", monto,
        { inputmode: "decimal", placeholder: "0", oninput: function (e) { monto = e.target.value; } }));

  /* entregar: lo que se usará según la receta, ajustable antes de descontar */

    abrirHoja("Entregar a " + (o.cliente || "cliente"), function (cuerpo, cerrar, h) {

  function textoCapacidad(p) {

      (cap.limiting ? " · limita " + (cap.limiting.name || "sin nombre") : "");

  /* unidades ya prometidas en pedidos que aún no se entregan */
  function unidadesComprometidas() {
    var out = {};

      out[it.productId] = (out[it.productId] || 0) + parseNum(it.qty);
