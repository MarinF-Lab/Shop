  /* ---------------- buscar, filtrar y ordenar ----------------
     Una sola barra para todas las listas: al crecer el catálogo, encontrar
     algo no debería obligar a recorrer la pantalla entera. */

  function norm(txt) {
    return String(txt == null ? "" : txt).toLowerCase()
      .normalize("NFD").replace(/[̀-ͯ]/g, "");
  }

  function coincide(texto, consulta) {
    if (!consulta) return true;
    var t = norm(texto);
    return norm(consulta).split(/\s+/).every(function (palabra) {
      return !palabra || t.indexOf(palabra) > -1;
    });
  }

  /* estado de búsqueda por lista, para no mezclar pestañas */
  function filtro(lista) {
    if (!ui.filtros[lista]) ui.filtros[lista] = { q: "", tag: "", orden: "" };
    return ui.filtros[lista];
  }

  /* Con pocos elementos la barra estorba más de lo que ayuda: se muestra
     a partir de cinco, o si ya hay una búsqueda escrita. */
  var MINIMO_BUSCADOR = 5;

  function barraBusqueda(opts) {
    var f = filtro(opts.lista);
    if (opts.total < MINIMO_BUSCADOR && !f.q && !f.tag) return null;
    var caja = el("div", { class: "buscador" });

    var input = el("input", { type: "search", value: f.q, placeholder: opts.placeholder || "Buscar…",
      "aria-label": opts.placeholder || "Buscar" });
    /* se repinta solo la lista: repintar todo quitaría el foco */
    input.addEventListener("input", function () {
      f.q = input.value;
      opts.repintar();
    });
    caja.appendChild(input);

    if (opts.filtros && opts.filtros.length) {
      var chips = el("div", { class: "chips-filtro" });
      [{ id: "", label: "Todos" }].concat(opts.filtros).forEach(function (op) {
        var n = op.id === "" ? opts.total : op.contar();
        chips.appendChild(el("button", { type: "button", class: "chip-filtro",
          "aria-pressed": f.tag === op.id,
          text: op.label + (n != null ? " · " + n : ""),
          onclick: function () { f.tag = f.tag === op.id ? "" : op.id; opts.repintar(); } }));
      });
      caja.appendChild(chips);
    }

    if (opts.ordenes && opts.ordenes.length > 1 && opts.total >= MINIMO_BUSCADOR) {
      var sel = el("select", { class: "orden", "aria-label": "Ordenar" });
      opts.ordenes.forEach(function (o) {
        sel.appendChild(el("option", { value: o.id, text: "Orden: " + o.label }));
      });
      sel.value = f.orden || opts.ordenes[0].id;
      sel.addEventListener("change", function () { f.orden = sel.value; opts.repintar(); });
      caja.appendChild(sel);
    }

    return caja;
  }

  /* aplica consulta, chip y orden sobre una lista */
  function aplicarFiltro(lista, items, opts) {
    var f = filtro(lista);
    var out = items.filter(function (it) {
      if (!coincide(opts.texto(it), f.q)) return false;
      if (!f.tag) return true;
      var def = null;
      (opts.filtros || []).forEach(function (o) { if (o.id === f.tag) def = o; });
      return def ? def.test(it) : true;
    });

    var orden = f.orden || (opts.ordenes && opts.ordenes.length ? opts.ordenes[0].id : "");
    (opts.ordenes || []).forEach(function (o) {
      if (o.id === orden && o.comparar) out.sort(o.comparar);
    });
    return out;
  }

  function sinResultados(lista, repintar) {
    var f = filtro(lista);
    return el("div", { class: "empty" }, [
      el("p", { text: "Nada coincide con “" + (f.q || "ese filtro") + "”." }),
      el("button", { class: "btn small", type: "button", text: "Limpiar búsqueda",
        onclick: function () { f.q = ""; f.tag = ""; repintar(); } })
    ]);
  }

  /* ---------------- render: inicio ----------------
     Lo que hay que mirar hoy: qué urge, qué falta comprar y cómo va el mes. */

  function mesActual() { return hoy().slice(0, 7); }

  function mesAnterior() {
    var d = new Date();
    d.setDate(1);
    d.setMonth(d.getMonth() - 1);
    return d.toISOString().slice(0, 7);
  }

  /* ingreso, costo y ganancia de lo entregado en un mes */
  function balanceMes(mes) {
    var b = { ingreso: 0, costo: 0, ganancia: 0, pedidos: 0 };
    state.orders.forEach(function (o) {
      if (o.estado !== "entregado") return;
      var fecha = o.entregado || o.fecha || o.creado || "";
      if (String(fecha).slice(0, 7) !== mes) return;
      var t = orderTotals(o);
      b.ingreso += t.ingreso; b.costo += t.costo; b.ganancia += t.ganancia;
      b.pedidos++;
    });
    return b;
  }

  function diasHasta(fecha) {
    if (!fecha) return null;
    var ms = new Date(fecha + "T00:00:00") - new Date(hoy() + "T00:00:00");
    return Math.round(ms / 86400000);
  }

  function textoPlazo(o) {
    var d = diasHasta(o.fecha);
    if (d == null) return "sin fecha comprometida";
    if (d < 0) return "atrasado " + Math.abs(d) + (Math.abs(d) === 1 ? " día" : " días");
    if (d === 0) return "entrega hoy";
    if (d === 1) return "entrega mañana";
    return "entrega en " + d + " días";
  }

  function renderInicio() {
    var root = document.getElementById("tab-inicio");
    root.innerHTML = "";

    var abiertos = pendingOrders();
    var atrasados = state.orders.filter(atrasado);

    /* --- el mes --- */
    var mes = balanceMes(mesActual()), previo = balanceMes(mesAnterior());
    var strip = el("dl", { class: "strip" });
    [["Ingreso del mes", money(mes.ingreso), ""],
     ["Costo", money(mes.costo), "cost"],
     ["Ganancia", money(mes.ganancia), mes.ganancia < 0 ? "loss" : "gain"]].forEach(function (c) {
      strip.appendChild(el("div", {}, [
        el("dt", { text: c[0] }),
        el("dd", { text: c[1], style: c[2] === "gain" ? "color:var(--gain)" : c[2] === "loss" ? "color:var(--danger)"
          : c[2] === "cost" ? "color:var(--cost)" : "" })
      ]));
    });
    root.appendChild(strip);

    var comparacion = el("p", { class: "note", style: "margin:0 2px 14px" });
    if (!mes.pedidos && !previo.pedidos) {
      comparacion.textContent = "Cuando marques pedidos como entregados, aquí verás cómo va el mes.";
    } else if (!previo.ganancia) {
      comparacion.textContent = mes.pedidos + (mes.pedidos === 1 ? " pedido entregado" : " pedidos entregados") + " este mes.";
    } else {
      var dif = mes.ganancia - previo.ganancia;
      var pct = Math.round(Math.abs(dif) / Math.abs(previo.ganancia) * 100);
      comparacion.textContent = mes.pedidos + (mes.pedidos === 1 ? " pedido entregado" : " pedidos entregados") +
        " · ganancia " + (dif >= 0 ? "+" : "−") + pct + "% frente al mes pasado (" + money(previo.ganancia) + ").";
    }
    root.appendChild(comparacion);

    /* --- pedidos que urgen --- */
    var cardPedidos = el("div", { class: "mat-card" });
    cardPedidos.appendChild(el("div", { class: "row" }, [
      el("div", { class: "grow" }, [el("h4", { style: "margin:0;font-size:14px", text: "Pedidos que urgen" })]),
      el("button", { class: "btn small", type: "button", text: "Ver todos",
        onclick: function () { ui.tab = "pedidos"; render(); } })
    ]));

    if (!abiertos.length) {
      cardPedidos.appendChild(el("p", { class: "note", style: "margin:8px 0 0",
        text: state.orders.length ? "No hay pedidos abiertos. Todo al día." : "Todavía no tienes pedidos." }));
    } else {
      var urgentes = abiertos.slice().sort(function (a, b) {
        return (a.fecha || "9999-12-31").localeCompare(b.fecha || "9999-12-31");
      }).slice(0, 5);

      var plan = el("div", { class: "plan" });
      urgentes.forEach(function (o) {
        var fila = el("div", { class: "plan-row" + (atrasado(o) ? " short" : ""),
          style: "cursor:pointer", onclick: function () {
            ui.tab = "pedidos"; ui.open[o.id] = true; render();
          } }, [
          el("span", { class: "plan-name", text: o.cliente || "Sin nombre" }),
          el("span", { class: "plan-use", text: textoPlazo(o) }),
          el("span", { class: "plan-cost", text: money(orderTotals(o).ingreso) })
        ]);
        plan.appendChild(fila);
      });
      cardPedidos.appendChild(plan);

      cardPedidos.appendChild(el("div", { class: "unit-cost" + (atrasados.length ? " low" : "") }, [
        el("span", { text: atrasados.length
          ? atrasados.length + (atrasados.length === 1 ? " pedido atrasado" : " pedidos atrasados")
          : abiertos.length + (abiertos.length === 1 ? " pedido abierto" : " pedidos abiertos") }),
        el("b", { text: money(abiertos.reduce(function (t, o) { return t + orderTotals(o).ingreso; }, 0)) })
      ]));
    }
    root.appendChild(cardPedidos);

    /* --- qué falta comprar --- */
    if (llevaMateriales()) root.appendChild(tarjetaCompras(abiertos));

    /* --- márgenes que se erosionaron --- */
    var erosionados = productosErosionados();
    if (erosionados.length) {
      var aviso = el("div", { class: "mat-card" });
      aviso.appendChild(el("div", { class: "row" }, [
        el("div", { class: "grow" }, [el("h4", { style: "margin:0;font-size:14px", text: "Revisa estos precios" })]),
        el("button", { class: "btn small", type: "button", text: "Ver productos",
          onclick: function () { ui.tab = "productos"; render(); } })
      ]));
      aviso.appendChild(el("p", { class: "note", style: "margin:6px 0 0",
        text: "Subió el costo de algún insumo y el precio quedó corto." }));

      var planAviso = el("div", { class: "plan" });
      erosionados.slice(0, 5).forEach(function (x) {
        planAviso.appendChild(el("div", { class: "plan-row short", style: "cursor:pointer",
          onclick: function () { ui.tab = "productos"; ui.open[x.producto.id] = true; render(); } }, [
          el("span", { class: "plan-name", text: x.producto.name || "Sin nombre" }),
          el("span", { class: "plan-use", text: x.ganancia < 0 ? "pierdes " + money(-x.ganancia) + " por unidad"
            : "solo te queda " + pct(x.margen) }),
          el("span", { class: "plan-cost", text: money(parseNum(x.producto.manualPrice)) })
        ]));
      });
      aviso.appendChild(planAviso);
      root.appendChild(aviso);
    }

    /* --- accesos rápidos --- */
    var accesos = el("div", { class: "mat-card" });
    accesos.appendChild(el("h4", { style: "margin:0 0 8px;font-size:14px", text: "Empezar algo" }));
    accesos.appendChild(el("button", { class: "btn primary wide", type: "button", text: "+ Nuevo pedido",
      onclick: function () { ui.tab = "pedidos"; render(); addOrder(); } }));
    accesos.appendChild(el("button", { class: "btn wide", type: "button", text: "+ Nuevo producto",
      style: "margin-top:8px", onclick: function () { ui.tab = "productos"; render(); addProduct(); } }));
    if (llevaMateriales()) {
      accesos.appendChild(el("button", { class: "btn wide", type: "button",
        text: "+ Nuevo " + rubro().insumo.toLowerCase(), style: "margin-top:8px",
        onclick: function () { ui.tab = "inventario"; ui.vista = "materiales"; render(); addMaterial(); } }));
    }
    root.appendChild(accesos);
  }

  /* lo que hay que comprar: lo que falta para los pedidos y lo bajo el mínimo */
  function tarjetaCompras(abiertos) {
    var card = el("div", { class: "mat-card" });
    card.appendChild(el("div", { class: "row" }, [
      el("div", { class: "grow" }, [el("h4", { style: "margin:0;font-size:14px", text: "Qué falta comprar" })]),
      el("button", { class: "btn small", type: "button", text: "Ver inventario",
        onclick: function () { ui.tab = "inventario"; ui.vista = "materiales"; render(); } })
    ]));

    var porPedidos = abiertos.length ? shoppingFor(pendingItems()) : { lines: [], total: 0, ok: true };
    var faltanPedidos = porPedidos.lines.filter(function (l) { return l.falta > 1e-9; });

    var bajos = state.materials.filter(function (m) { return falta(m) > 0; });
    var yaListados = {};
    faltanPedidos.forEach(function (l) { yaListados[l.material.id] = true; });

    if (!faltanPedidos.length && !bajos.length) {
      card.appendChild(el("div", { class: "unit-cost", style: "margin-top:8px" }, [
        el("span", { text: "No falta nada por ahora" }),
        el("b", { text: money(0) })
      ]));
      return card;
    }

    var total = 0;
    var plan = el("div", { class: "plan" });

    faltanPedidos.forEach(function (l) {
      total += l.cost;
      plan.appendChild(el("div", { class: "plan-row short" }, [
        el("span", { class: "plan-name", text: l.material.name || "Sin nombre" }),
        el("span", { class: "plan-use", text: "faltan " + conUnidad(l.falta, stockUnit(l.material)) + " para los pedidos" }),
        el("span", { class: "plan-cost", text: l.packs
          ? l.packs + (l.packs === 1 ? " paquete " : " paquetes ") + money(l.cost) : money(l.cost) })
      ]));
    });

    bajos.forEach(function (m) {
      if (yaListados[m.id]) return;
      var rc = restockCost(m, falta(m));
      total += rc.cost;
      plan.appendChild(el("div", { class: "plan-row" }, [
        el("span", { class: "plan-name", text: m.name || "Sin nombre" }),
        el("span", { class: "plan-use", text: "bajo el mínimo · faltan " + conUnidad(falta(m), stockUnit(m)) }),
        el("span", { class: "plan-cost", text: rc.packs
          ? rc.packs + (rc.packs === 1 ? " paquete " : " paquetes ") + money(rc.cost) : money(rc.cost) })
      ]));
    });

    card.appendChild(plan);
    card.appendChild(el("div", { class: "unit-cost" + (faltanPedidos.length ? " low" : "") }, [
      el("span", { text: faltanPedidos.length ? "Comprar para los pedidos" : "Para volver al nivel inicial" }),
      el("b", { text: money(total) })
    ]));
    return card;
  }

  /* ---------------- render: productos ---------------- */

  function productCard(p) {
    var r = calc(p);
    var open = !!ui.open[p.id];

    var head = el("div", { class: "card-head" + (open ? " open" : ""), onclick: function () {
      ui.open[p.id] = !ui.open[p.id];
      render();
    } }, [
      el("span", { class: "caret", text: "▶" }),
      el("h3", { text: p.name || "Sin nombre" })
    ]);

    var chips = el("div", { class: "chips" }, [
      el("span", { class: "chip c", html: "Costo <b>" + money(r.total) + "</b>" }),
      el("span", { class: "chip p", html: "Precio <b>" + money(r.final) + "</b>" }),
      el("span", { class: "chip " + (r.ganancia < 0 ? "neg" : "g"), html: "Ganancia <b>" + money(r.ganancia) + "</b> · " + pct(r.margen) })
    ]);

    var card = el("div", { class: "card " + (p.type === "servicio" ? "servicio" : "producto"),
      "data-card": p.id }, [head, chips]);
    if (!open) return card;

    var body = el("div", { class: "card-body" });

    /* nombre + tipo */
    body.appendChild(el("div", { class: "sec" }, [
      el("label", { class: "field", text: "Nombre" }),
      el("input", { type: "text", value: p.name, placeholder: "Ej: Tarjetas de presentación",
        oninput: function (e) { p.name = e.target.value; head.querySelector("h3").textContent = p.name || "Sin nombre"; save(p); } })
    ]));

    var segTipo = el("div", { class: "seg" });
    [["producto", "Producto"], ["servicio", "Servicio"]].forEach(function (opt) {
      segTipo.appendChild(el("button", { type: "button", text: opt[1], "aria-pressed": p.type === opt[0],
        onclick: function () { p.type = opt[0]; save(p); render(); } }));
    });
    body.appendChild(el("div", { class: "sec" }, [el("label", { class: "field", text: "Tipo" }), segTipo]));

    /* materiales */
    var matSec = el("div", { class: "sec" });
    matSec.appendChild(el("header", {}, [
      el("h4", { text: rubro().receta }),
      el("span", { class: "sub", text: money(r.mats) })
    ]));

    if (!state.materials.length) {
      matSec.appendChild(el("p", { class: "note", text: "Agrega " + rubro().insumoPlural + " en la pestaña " + rubro().insumos + " para poder asignarlos aquí." }));
    }

    p.materials.forEach(function (line, idx) {
      var m = materialById(line.materialId);
      var area = m && isArea(m.unit);
      var lineBox = el("div", { class: "mat-line" });

      var lineTotal = el("span", { class: "line-total", text: m ? money(lineCost(line).cost) : "—" });

      lineBox.appendChild(selectorMaterial(p, line, function () { save(p); render(); }));

      lineBox.appendChild(el("div", { class: "row", style: "margin-top:6px" }, [
        area ? null : el("div", { class: "grow" }, [el("label", { class: "field", style: "margin:0", text: "Cantidad" })]),
        area ? null : el("div", { class: "qty" }, [el("input", { class: "num", type: "text", inputmode: "decimal",
          value: line.qty, "aria-label": "Cantidad",
          oninput: function (e) { line.qty = e.target.value; save(p); refreshOutputs(); } })]),
        area ? null : lineTotal,
        deleteButton("Quitar material", function () { p.materials.splice(idx, 1); save(p); render(); })
      ]));

      if (area) {
        var side = sideUnit(m.unit);
        var detail = el("p", { class: "area-note" });

        function refreshLine() {
          var r2 = lineCost(line);
          var parts = [];
          if (r2.area > 0) parts.push(r2.area.toLocaleString("es-CL", { maximumFractionDigits: 2 }) + " " + m.unit + " = " + money(r2.costArea));
          if (r2.perSheet > 0) parts.push("entran " + r2.perSheet + " por pliego · usas " + r2.sheets + " = " + money(r2.costSheets));
          detail.textContent = parts.length ? parts.join(" · ") : "Ingresa alto, ancho y piezas.";
          detail.className = "area-note" + (m.areaMode === "pliego" && r2.costSheets != null ? " sheet" : "");
          lineTotal.textContent = money(r2.cost);
        }

        function measure(label, key) {
          return el("div", { class: "grow" }, [
            el("label", { class: "field", text: label }),
            el("input", { class: "num", type: "text", inputmode: "decimal", value: line[key], placeholder: "0",
              oninput: function (e) { line[key] = e.target.value; save(p); refreshLine(); refreshOutputs(); } })
          ]);
        }

        lineBox.appendChild(el("div", { class: "row measures" }, [
          measure("Alto (" + side + ")", "h"),
          measure("Ancho (" + side + ")", "w"),
          measure("Piezas", "pieces")
        ]));

        lineBox.appendChild(el("div", { class: "row", style: "justify-content:space-between" }, [
          detail, lineTotal
        ]));
        refreshLine();
      }

      matSec.appendChild(lineBox);
    });

    matSec.appendChild(el("button", { class: "btn small", type: "button", text: "+ " + rubro().insumo,
      onclick: function () {
        p.materials.push({ materialId: "", qty: 1, h: "", w: "", pieces: 1 });
        save(p); render();
        enfocarUltimaLinea(p.id);
      } }));

    /* crear el material sin salir del producto ni perder lo escrito */
    matSec.appendChild(el("button", { class: "btn small", type: "button",
      text: "+ " + rubro().insumo + " nuevo", style: "margin-left:6px",
      onclick: function () { crearMaterialDesdeProducto(p); } }));
    body.appendChild(matSec);

    /* costos adicionales */
    var costSec = el("div", { class: "sec" });
    costSec.appendChild(el("header", {}, [
      el("h4", { text: "Otros costos" }),
      el("span", { class: "sub", text: "Fijos " + money(r.fijos) + " · Variables " + money(r.variables) })
    ]));

    p.costs.forEach(function (c, idx) {
      var kindSel = el("select", { "aria-label": "Tipo de costo" });
      [["variable", "Variable"], ["fijo", "Fijo"]].forEach(function (o) {
        kindSel.appendChild(el("option", { value: o[0], text: o[1] }));
      });
      kindSel.value = c.kind;
      kindSel.addEventListener("change", function () { c.kind = kindSel.value; save(p); render(); });

      costSec.appendChild(el("div", { class: "row" }, [
        el("div", { class: "grow" }, [el("input", { type: "text", value: c.name, placeholder: "Ej: Mano de obra",
          oninput: function (e) { c.name = e.target.value; save(p); } })]),
        el("div", { class: "amt" }, [el("input", { class: "num", type: "text", inputmode: "decimal", value: c.amount, "aria-label": "Monto",
          oninput: function (e) { c.amount = e.target.value; save(p); refreshOutputs(); } })]),
        el("div", { class: "kind" }, [kindSel]),
        deleteButton("Quitar costo", function () { p.costs.splice(idx, 1); save(p); render(); })
      ]));
    });

    costSec.appendChild(el("button", { class: "btn small", type: "button", text: "+ Costo",
      onclick: function () { p.costs.push({ id: uid(), name: "", amount: "", kind: "variable" }); save(p); render(); } }));
    body.appendChild(costSec);

    /* precio */
    var priceSec = el("div", { class: "sec" });
    priceSec.appendChild(el("header", {}, [el("h4", { text: "Precio de venta" })]));
    priceSec.appendChild(el("p", { class: "note",
      text: "Precio neto que cobras, sin impuesto. La ganancia y el margen se calculan solos." }));

    priceSec.appendChild(el("div", { class: "campo-precio" }, [
      el("span", { class: "simbolo", text: cfg().symbol }),
      el("input", { class: "num", type: "text", inputmode: "decimal",
        value: p.manualPrice, placeholder: "0", "aria-label": "Precio neto",
        oninput: function (e) { p.manualPrice = e.target.value; save(p); refreshOutputs(); } })
    ]));
    body.appendChild(priceSec);

    /* publicación en la tienda */
    var pubCheck = el("input", { type: "checkbox" });
    pubCheck.checked = !!p.publicado;
    pubCheck.addEventListener("change", function () { p.publicado = pubCheck.checked; save(p); render(); });

    var pubSec = el("div", { class: "sec" }, [
      el("header", {}, [el("h4", { text: "Tienda pública" })]),
      el("label", { class: "switch" }, [pubCheck, el("span", { text: "Mostrar en el catálogo público" })])
    ]);
    if (p.publicado) {
      pubSec.appendChild(el("div", { class: "sec", style: "margin-top:10px" }, [
        el("label", { class: "field", text: "Descripción para el cliente" }),
        el("input", { type: "text", value: p.descripcionPublica || "", placeholder: "Ej: Tulipán artesanal de limpiapipas",
          oninput: function (e) { p.descripcionPublica = e.target.value; save(p); } })
      ]));
      pubSec.appendChild(el("p", { class: "note",
        text: "Se publica como " + money(r.final) + " y se ofrece por encargo: el cliente pide " +
          "la cantidad que quiera y tú la preparas. Tus costos y márgenes no salen a la tienda." }));
    }
    body.appendChild(pubSec);

    /* resultado */
    body.appendChild(resultTable(p));

    /* duplicar y eliminar */
    body.appendChild(el("div", { class: "sec" }, [
      el("button", { class: "btn small", type: "button", text: "Duplicar producto",
        style: "margin-right:6px", onclick: function () { duplicarProducto(p); } }),
      el("button", { class: "btn small peligro", type: "button", text: "Eliminar producto",
        onclick: function () {
          if (ui.confirming === p.id) {
            state.products = state.products.filter(function (x) { return x.id !== p.id; });
            marcarBorrado("productos", p.id);
            ui.confirming = null; render(); toast("Producto eliminado");
          } else {
            ui.confirming = p.id;
            toast("Toca otra vez para eliminar");
            setTimeout(function () { if (ui.confirming === p.id) ui.confirming = null; }, 3000);
          }
        } })
    ]));

    card.appendChild(body);
    return card;
  }

  function resultRow(label, value, cls) {
    var clases = (cls || "").split(" ").filter(Boolean);
    var esTotal = clases.indexOf("total") > -1;
    var color = clases.filter(function (c) { return c !== "total"; }).join(" ");
    return el("tr", esTotal ? { class: "total" } : {}, [
      el("th", { scope: "row", text: label }),
      el("td", { class: color, text: value })
    ]);
  }

  function resultTable(p) {
    var r = calc(p);
    var rows = [
      resultRow("Materiales", money(r.mats)),
      resultRow("Costos fijos", money(r.fijos)),
      resultRow("Costos variables", money(r.variables)),
      resultRow("Costo total", money(r.total), "total"),
      resultRow("Precio neto", money(r.neto))
    ];
    if (state.settings.taxEnabled) {
      rows.push(resultRow("Impuesto " + pct(parseNum(state.settings.taxRate)), money(r.tax)));
      rows.push(resultRow("Precio final", money(r.final), "total"));
    }
    /* la ganancia es la conclusión de la tabla: se lee como tal */
    rows.push(resultRow("Ganancia", money(r.ganancia), (r.ganancia < 0 ? "loss" : "gain") + " total"));
    rows.push(resultRow("De cada venta te queda", pct(r.margen)));

    var tbody = el("tbody", {}, rows);
    return el("div", { class: "result", "data-result": p.id }, [el("table", {}, [tbody])]);
  }

  function refreshOutputs() {
    /* actualiza chips y tabla de resultado sin re-render (mantiene el foco al escribir) */
    state.products.forEach(function (p) {
      var box = document.querySelector('[data-result="' + p.id + '"]');
      if (box) {
        var fresh = resultTable(p);
        box.parentNode.replaceChild(fresh, box);
      }
    });
    renderProductChips();
    renderStrip();
  }

  function renderProductChips() {
    var cards = document.querySelectorAll("#tab-productos .card");
    for (var i = 0; i < cards.length; i++) {
      var p = state.products[i];
      if (!p) continue;
      var r = calc(p);
      var chips = cards[i].querySelector(".chips");
      if (!chips) continue;
      chips.innerHTML = "";
      chips.appendChild(el("span", { class: "chip c", html: "Costo <b>" + money(r.total) + "</b>" }));
      chips.appendChild(el("span", { class: "chip p", html: "Precio <b>" + money(r.final) + "</b>" }));
      chips.appendChild(el("span", { class: "chip " + (r.ganancia < 0 ? "neg" : "g"),
        html: "Ganancia <b>" + money(r.ganancia) + "</b> · " + pct(r.margen) }));
    }
  }

  function renderStrip() {
    var strip = document.getElementById("stripTotals");
    if (!strip) return;
    var t = { costo: 0, precio: 0, ganancia: 0 };
    state.products.forEach(function (p) {
      var r = calc(p);
      t.costo += r.total; t.precio += r.final; t.ganancia += r.ganancia;
    });
    strip.innerHTML = "";
    [["Costo total", money(t.costo), ""], ["Ingreso total", money(t.precio), ""],
     ["Ganancia total", money(t.ganancia), t.ganancia < 0 ? "loss" : "gain"]].forEach(function (c) {
      strip.appendChild(el("div", {}, [
        el("dt", { text: c[0] }),
        el("dd", { text: c[1], style: c[2] === "gain" ? "color:var(--gain)" : c[2] === "loss" ? "color:var(--danger)" : "" })
      ]));
    });
  }

  function renderProductos() {
    var root = document.getElementById("tab-productos");
    root.innerHTML = "";
    root.appendChild(el("dl", { class: "strip", id: "stripTotals" }));

    if (!state.products.length) {
      root.appendChild(el("div", { class: "empty" }, [
        el("p", { text: "Aún no hay productos ni servicios. Crea el primero y asígnale " + rubro().insumoPlural + " y costos." }),
        el("button", { class: "btn primary", type: "button", text: "Crear el primero", onclick: addProduct })
      ]));
    } else {
      var lista = el("div");

      var opciones = {
        texto: function (p) { return (p.name || "") + " " + (p.descripcionPublica || ""); },
        filtros: [
          { id: "publicados", label: "En la tienda",
            test: function (p) { return !!p.publicado; },
            contar: function () { return state.products.filter(function (p) { return p.publicado; }).length; } },
          { id: "servicios", label: "Servicios",
            test: function (p) { return p.type === "servicio"; },
            contar: function () { return state.products.filter(function (p) { return p.type === "servicio"; }).length; } },
          { id: "sinprecio", label: "Sin precio",
            test: function (p) { return calc(p).final <= 0; },
            contar: function () { return state.products.filter(function (p) { return calc(p).final <= 0; }).length; } }
        ],
        ordenes: [
          { id: "nombre", label: "nombre", comparar: function (a, b) {
            return norm(a.name).localeCompare(norm(b.name)); } },
          { id: "ganancia", label: "más rentable", comparar: function (a, b) {
            return calc(b).ganancia - calc(a).ganancia; } },
          { id: "precio", label: "precio", comparar: function (a, b) {
            return calc(b).final - calc(a).final; } }
        ]
      };

      function pintarLista() {
        lista.innerHTML = "";
        var visibles = aplicarFiltro("productos", state.products.slice(), opciones);
        if (!visibles.length) { lista.appendChild(sinResultados("productos", pintarLista)); return; }
        visibles.forEach(function (p) { lista.appendChild(productCard(p)); });
      }

      agregar(root, barraBusqueda({
        lista: "productos",
        placeholder: "Buscar producto…",
        total: state.products.length,
        filtros: opciones.filtros,
        ordenes: opciones.ordenes,
        repintar: pintarLista
      }));
      root.appendChild(lista);
      pintarLista();

      root.appendChild(el("button", { class: "btn primary wide", type: "button", text: "+ Nuevo producto o servicio", onclick: addProduct }));
    }
    renderStrip();
  }

  function addProduct() {
    var p = { id: uid(), name: "", type: "producto", materials: [], costs: [],
      pricingMode: "manual", manualPrice: "", stock: "" };
    state.products.push(p);
    ui.open[p.id] = true;
    save(p); render();
  }

  /* ---------------- render: materiales ---------------- */

  /* cuánto le falta a un material para llegar a su nivel inicial */
  function falta(m) {
    var t = stockTarget(m);
    return t > 0 ? Math.max(0, t - parseNum(m.stock)) : 0;
  }

  /* ---------------- categorías de materiales ----------------
     Quien trabaja con limpiapipas no tiene doce materiales: tiene uno en
     doce colores. Las categorías se derivan de los propios materiales, así
     que no hay un catálogo aparte que mantener ni categorías huérfanas. */

  var SIN_CATEGORIA = "Sin categoría";

  function categoriaDe(m) {
    var c = (m && m.categoria ? String(m.categoria) : "").trim();
    return c || SIN_CATEGORIA;
  }

  function categoriasUsadas() {
    var vistas = {};
    state.materials.forEach(function (m) {
      var c = (m.categoria || "").trim();
      if (c) vistas[c] = true;
    });
    return Object.keys(vistas).sort(function (a, b) { return norm(a).localeCompare(norm(b)); });
  }

  /* agrupa una lista ya filtrada y ordenada; "Sin categoría" siempre al final */
  function agruparPorCategoria(materiales) {
    var mapa = {}, orden = [];
    materiales.forEach(function (m) {
      var c = categoriaDe(m);
      if (!mapa[c]) { mapa[c] = []; orden.push(c); }
      mapa[c].push(m);
    });
    orden.sort(function (a, b) {
      if (a === SIN_CATEGORIA) return 1;
      if (b === SIN_CATEGORIA) return -1;
      return norm(a).localeCompare(norm(b));
    });
    return orden.map(function (c) {
      var items = mapa[c];
      var valor = 0, bajos = 0;
      items.forEach(function (m) {
        valor += parseNum(m.stock) * stockUnitValue(m);
        if (falta(m) > 0) bajos++;
      });
      return { nombre: c, items: items, valor: valor, bajos: bajos };
    });
  }

  function claveCategoria(nombre) { return "cat:" + nombre; }

  /* desplegable con lo ya usado y la opción de crear una al vuelo */
  function selectorCategoria(m) {
    var sel = el("select", { "aria-label": "Categoría" });
    sel.appendChild(el("option", { value: "", text: SIN_CATEGORIA }));
    categoriasUsadas().forEach(function (c) {
      sel.appendChild(el("option", { value: c, text: c }));
    });
    sel.appendChild(el("option", { value: "__nueva__", text: "+ Crear categoría…" }));
    sel.value = (m.categoria || "").trim();

    sel.addEventListener("change", function () {
      if (sel.value !== "__nueva__") {
        m.categoria = sel.value;
        ui.ultimaCategoria = m.categoria;
        if (m.categoria) ui.open[claveCategoria(m.categoria)] = true;
        save(m); render();
        return;
      }
      sel.value = (m.categoria || "").trim();   /* hasta que se confirme */
      crearCategoria(m);
    });
    return sel;
  }

  function crearCategoria(m) {
    abrirVentana("Nueva categoría", function (cuerpo, sheet, cerrar) {
      var campo = el("input", { type: "text", placeholder: "Ej: Limpiapipas", "aria-label": "Nombre de la categoría" });
      cuerpo.appendChild(el("label", { class: "field", text: "Nombre" }));
      cuerpo.appendChild(campo);
      cuerpo.appendChild(el("p", { class: "note",
        text: "Agrupa " + rubro().insumoPlural + " que son lo mismo en distintas variantes: colores, tamaños, sabores." }));

      function guardar() {
        var nombre = campo.value.trim();
        if (!nombre) { toast("Ponle un nombre"); campo.focus(); return; }
        if (nombre === SIN_CATEGORIA) { toast("Ese nombre está reservado"); campo.focus(); return; }
        m.categoria = nombre;
        ui.ultimaCategoria = nombre;
        ui.open[claveCategoria(nombre)] = true;
        save(m); render(); cerrar();
        toast("Categoría “" + nombre + "” creada");
      }

      campo.addEventListener("keydown", function (e) { if (e.key === "Enter") guardar(); });
      sheet.appendChild(el("div", { class: "actions" }, [
        el("button", { class: "btn", type: "button", text: "Cancelar", onclick: cerrar }),
        el("button", { class: "btn primary", type: "button", text: "Crear", onclick: guardar })
      ]));
    });
  }

  /* renombrar, fusionar o eliminar una categoría desde su cabecera */
  function editarCategoria(g) {
    abrirVentana("Categoría " + g.nombre, function (cuerpo, sheet, cerrar) {
      var campo = el("input", { type: "text", value: g.nombre, "aria-label": "Nombre de la categoría" });
      cuerpo.appendChild(el("label", { class: "field", text: "Nombre" }));
      cuerpo.appendChild(campo);
      cuerpo.appendChild(el("p", { class: "note",
        text: "Agrupa " + g.items.length + " " + (g.items.length === 1 ? rubro().insumo.toLowerCase() : rubro().insumoPlural) + "." }));

      var aviso = el("p", { class: "note", style: "min-height:18px" });
      cuerpo.appendChild(aviso);

      /* si el nombre nuevo ya existe, renombrar es fusionar: hay que decirlo */
      function revisar() {
        var nuevo = campo.value.trim();
        var choca = nuevo && norm(nuevo) !== norm(g.nombre) &&
          categoriasUsadas().some(function (c) { return norm(c) === norm(nuevo); });
        aviso.className = "note" + (choca ? " aviso" : "");
        aviso.textContent = choca
          ? "Ya existe “" + nuevo + "”: se juntarán en una sola categoría."
          : "";
      }
      campo.addEventListener("input", revisar);
      revisar();

      function renombrar() {
        var nuevo = campo.value.trim();
        if (!nuevo) { toast("Ponle un nombre"); campo.focus(); return; }
        if (nuevo === SIN_CATEGORIA) { toast("Ese nombre está reservado"); campo.focus(); return; }
        if (nuevo === g.nombre) { cerrar(); return; }

        g.items.forEach(function (m) { m.categoria = nuevo; save(m); });
        /* la categoría no debe cerrarse sola por haberla renombrado */
        if (ui.open[claveCategoria(g.nombre)]) ui.open[claveCategoria(nuevo)] = true;
        delete ui.open[claveCategoria(g.nombre)];
        ui.ultimaCategoria = nuevo;
        render(); cerrar();
        toast("Ahora se llama “" + nuevo + "”");
      }

      function eliminar() {
        var cuantos = g.items.length;
        var mensaje = cuantos
          ? "Se eliminará la categoría y " + cuantos + " " +
            (cuantos === 1 ? rubro().insumo.toLowerCase() + " quedará" : rubro().insumoPlural + " quedarán") +
            " sin categoría. No se borra ninguno."
          : "Se eliminará la categoría.";
        if (!window.confirm(mensaje)) return;

        g.items.forEach(function (m) { m.categoria = ""; save(m); });
        delete ui.open[claveCategoria(g.nombre)];
        if (ui.ultimaCategoria === g.nombre) ui.ultimaCategoria = "";
        render(); cerrar();
        toast(cuantos ? cuantos + " sin categoría" : "Categoría eliminada");
      }

      campo.addEventListener("keydown", function (e) { if (e.key === "Enter") renombrar(); });

      cuerpo.appendChild(el("button", { class: "btn small peligro wide", type: "button",
        style: "margin-top:4px", text: "Eliminar categoría", onclick: eliminar }));

      sheet.appendChild(el("div", { class: "actions" }, [
        el("button", { class: "btn", type: "button", text: "Cancelar", onclick: cerrar }),
        el("button", { class: "btn primary", type: "button", text: "Guardar", onclick: renombrar })
      ]));
    });
  }

  /* ---------------- elegir material con botones ----------------
     Un desplegable nativo con cuarenta colores abre un menú que tapa la
     pantalla. Aquí la elección ocurre dentro del propio recuadro: primero
     la categoría, después el color. */

  var MINIMO_POR_CATEGORIA = 8;

  function botonChip(texto, activo, onclick) {
    return el("button", { class: "chip-filtro", type: "button",
      "aria-pressed": activo ? "true" : "false", text: texto, onclick: onclick });
  }

  /* el nombre manda; el precio acompaña, para no leer dos veces lo mismo */
  function botonMaterial(m, activo, onclick) {
    return el("button", { class: "chip-filtro chip-mat", type: "button",
      "aria-pressed": activo ? "true" : "false",
      "aria-label": etiquetaMaterial(m), onclick: onclick }, [
      el("span", { class: "nom", text: m.name || "Sin nombre" }),
      el("small", { text: money(materialCost(m)) + "/" + m.unit })
    ]);
  }

  function etiquetaMaterial(m) {
    return (m.name || "Sin nombre") + " (" + money(materialCost(m)) + "/" + m.unit + ")";
  }

  /* devuelve el bloque de selección para una línea de material de un producto */
  function selectorMaterial(p, line, alElegir) {
    var caja = el("div", { class: "selector-mat" });
    var elegido = materialById(line.materialId);

    /* qué categoría se está mirando; por defecto, la del material ya elegido */
    var claveVista = "sel:" + p.id + ":" + (line.materialId || "nuevo");
    if (ui.verCategoria[claveVista] === undefined) {
      ui.verCategoria[claveVista] = elegido ? categoriaDe(elegido) : null;
    }

    var grupos = agruparPorCategoria(state.materials.slice().sort(function (a, b) {
      return norm(a.name).localeCompare(norm(b.name));
    }));
    /* con pocos materiales, pedir dos toques sería peor que uno */
    var directo = grupos.length <= 1 || state.materials.length < MINIMO_POR_CATEGORIA;

    function pintar() {
      caja.innerHTML = "";

      if (elegido && !ui.cambiando[claveVista]) {
        caja.appendChild(el("div", { class: "mat-elegido" }, [
          el("span", { class: "nombre", text: etiquetaMaterial(elegido) }),
          el("button", { class: "btn small", type: "button", text: "Cambiar",
            onclick: function () { ui.cambiando[claveVista] = true; pintar(); } })
        ]));
        return;
      }

      var vista = ui.verCategoria[claveVista];

      if (!directo) {
        var filaCat = el("div", { class: "chips-filtro" });
        grupos.forEach(function (g) {
          filaCat.appendChild(botonChip(g.nombre + " · " + g.items.length, vista === g.nombre, function () {
            ui.verCategoria[claveVista] = vista === g.nombre ? null : g.nombre;
            pintar();
          }));
        });
        caja.appendChild(filaCat);
        if (!vista) {
          caja.appendChild(el("p", { class: "note", style: "margin:6px 2px 0",
            text: "Elige una categoría para ver sus " + rubro().insumoPlural + "." }));
          return;
        }
      }

      var items = directo
        ? state.materials.slice().sort(function (a, b) { return norm(a.name).localeCompare(norm(b.name)); })
        : (grupos.filter(function (g) { return g.nombre === vista; })[0] || { items: [] }).items;

      var filaMat = el("div", { class: "chips-filtro", style: "margin-top:6px" });
      items.forEach(function (m) {
        filaMat.appendChild(botonMaterial(m, line.materialId === m.id, function () {
          line.materialId = m.id;
          ui.cambiando[claveVista] = false;
          alElegir();
        }));
      });
      caja.appendChild(filaMat);
    }

    pintar();
    return caja;
  }

  /* vista de materiales dentro de Inventario: catálogo y existencias juntos */
  function pintarMateriales(root) {
    root.appendChild(el("p", { class: "note", style: "margin:0 2px 12px",
      text: "Esta lista se reutiliza en todos los productos. Escribe el costo por unidad, o el precio de compra y las unidades que trae para que se calcule solo." }));

    if (!state.materials.length) {
      root.appendChild(el("div", { class: "empty" }, [
        el("p", { text: "Sin " + rubro().insumoPlural + " todavía. Agrégalos con su unidad y costo, o con el precio de compra y cuántas unidades trae." }),
        el("button", { class: "btn primary", type: "button", text: "Agregar " + rubro().insumo.toLowerCase(), onclick: addMaterial })
      ]));
      return;
    }

    var t = inventoryTotals();
    var strip = el("dl", { class: "strip" });
    [["Valor en inventario", money(t.valor), ""],
     ["Bajo el inicial", String(t.bajos) + (t.bajos === 1 ? " ítem" : " ítems"), t.bajos ? "loss" : ""],
     ["Reponer cuesta", money(t.reposicion), "cost"]].forEach(function (c) {
      strip.appendChild(el("div", {}, [
        el("dt", { text: c[0] }),
        el("dd", { text: c[1], style: c[2] === "loss" ? "color:var(--danger)" : c[2] === "cost" ? "color:var(--cost)" : "" })
      ]));
    });
    root.appendChild(strip);

    var listaMat = el("div");

    var opsMat = {
      texto: function (m) { return m.name || ""; },
      filtros: [
        { id: "bajos", label: "Bajo el mínimo",
          test: function (m) { return stockTarget(m) > 0 && parseNum(m.stock) < stockTarget(m); },
          contar: function () { return inventoryTotals().bajos; } },
        { id: "sinstock", label: "Sin existencia",
          test: function (m) { return parseNum(m.stock) <= 0; },
          contar: function () { return state.materials.filter(function (m) { return parseNum(m.stock) <= 0; }).length; } },
        { id: "sincosto", label: "Sin costo",
          test: function (m) { return materialCost(m) <= 0; },
          contar: function () { return state.materials.filter(function (m) { return materialCost(m) <= 0; }).length; } }
      ],
      ordenes: [
        { id: "nombre", label: "nombre", comparar: function (a, b) {
          return norm(a.name).localeCompare(norm(b.name)); } },
        { id: "critico", label: "lo más crítico", comparar: function (a, b) {
          return falta(b) - falta(a); } },
        { id: "valor", label: "valor en inventario", comparar: function (a, b) {
          return parseNum(b.stock) * stockUnitValue(b) - parseNum(a.stock) * stockUnitValue(a); } }
      ]
    };

    agregar(root, barraBusqueda({
      lista: "materiales",
      placeholder: "Buscar " + rubro().insumo.toLowerCase() + "…",
      total: state.materials.length,
      filtros: opsMat.filtros,
      ordenes: opsMat.ordenes,
      repintar: function () { render(); }
    }));
    root.appendChild(listaMat);

    var visiblesMat = aplicarFiltro("materiales", state.materials.slice(), opsMat);
    if (!visiblesMat.length) {
      listaMat.appendChild(sinResultados("materiales", function () { render(); }));
    }

    var grupos = agruparPorCategoria(visiblesMat);
    var hayBusqueda = !!(filtro("materiales").q || filtro("materiales").tag);
    var destinos = {};   /* dónde va cada ficha: dentro de su categoría */

    grupos.forEach(function (g) {
      var clave = claveCategoria(g.nombre);
      /* con una sola categoría no tiene sentido obligar a abrirla;
         buscando, se abre sola o el buscador no serviría de nada */
      var abierta = hayBusqueda || grupos.length === 1 || !!ui.open[clave];

      var resumen = g.items.length + (g.items.length === 1 ? " ítem" : " ítems") + " · " + money(g.valor);
      var cabecera = el("div", { class: "cat-head" + (abierta ? " open" : ""), role: "button",
        tabindex: "0", "aria-expanded": abierta ? "true" : "false",
        onclick: function () { ui.open[clave] = !abierta; render(); } }, [
        el("span", { class: "caret", text: "▸" }),
        el("h4", { text: g.nombre }),
        g.bajos ? el("span", { class: "chip neg", text: g.bajos + " bajo" }) : null,
        el("span", { class: "cat-resumen", text: resumen }),
        /* "Sin categoría" no es una categoría: es la ausencia de una */
        g.nombre === SIN_CATEGORIA ? null : el("button", { class: "editar", type: "button",
          title: "Editar categoría", "aria-label": "Editar la categoría " + g.nombre, text: "✎",
          onclick: function (e) { e.stopPropagation(); editarCategoria(g); } })
      ]);
      cabecera.addEventListener("keydown", function (e) {
        if (e.key === "Enter" || e.key === " ") { e.preventDefault(); ui.open[clave] = !abierta; render(); }
      });

      var cuerpo = el("div", { class: "cat-body" });
      cuerpo.hidden = !abierta;
      listaMat.appendChild(el("div", { class: "cat" }, [cabecera, cuerpo]));
      g.items.forEach(function (m) { destinos[m.id] = cuerpo; });
    });

    visiblesMat.forEach(function (m) {
      var idx = state.materials.indexOf(m);
      var abiertaFicha = !!ui.open[m.id];
      var card = el("div", { class: "mat-card" + (abiertaFicha ? "" : " plegada") });

      /* fila de una línea: nombre, existencia y costo; se abre al tocarla */
      var fila = el("div", { class: "mat-head" + (abiertaFicha ? " open" : ""), role: "button",
        tabindex: "0", "aria-expanded": abiertaFicha ? "true" : "false",
        onclick: function () { ui.open[m.id] = !abiertaFicha; render(); } }, [
        el("span", { class: "caret", text: "▸" }),
        el("span", { class: "mat-nombre", text: m.name || "Sin nombre" }),
        el("span", { class: "mat-datos" + (falta(m) > 0 ? " low" : ""),
          text: conUnidad(parseNum(m.stock), stockUnit(m)) + " · " + money(materialCost(m)) })
      ]);
      fila.addEventListener("keydown", function (e) {
        if (e.key === "Enter" || e.key === " ") { e.preventDefault(); ui.open[m.id] = !abiertaFicha; render(); }
      });
      card.appendChild(fila);

      var detalle = el("div", { class: "mat-detalle" });
      detalle.hidden = !abiertaFicha;

      var unitSel = el("select", { "aria-label": "Unidad" });
      UNITS.forEach(function (u) { unitSel.appendChild(el("option", { value: u, text: u })); });
      if (UNITS.indexOf(m.unit) === -1) unitSel.appendChild(el("option", { value: m.unit, text: m.unit }));
      unitSel.value = m.unit;
      unitSel.addEventListener("change", function () { m.unit = unitSel.value; save(m); render(); });

      var readout = el("div", { class: "unit-cost" }, [
        el("span", { "data-unitlabel": m.id, text: "Costo por " + m.unit }),
        el("b", { "data-unitcost": m.id, text: money(materialCost(m)) })
      ]);

      function refresh() {
        var node = card.querySelector("[data-unitcost]");
        if (node) node.textContent = money(materialCost(m));
        var lbl = card.querySelector("[data-unitlabel]");
        if (lbl) {
          lbl.textContent = "Costo por " + m.unit +
            (hasSheet(m) ? " · pliego de " + sheetArea(m).toLocaleString("es-CL", { maximumFractionDigits: 2 }) + " " + m.unit : "");
        }
      }

      detalle.appendChild(el("div", { class: "row" }, [
        el("div", { class: "grow" }, [el("input", { type: "text", value: m.name, placeholder: "Ej: Papel couché 300g",
          "aria-label": "Nombre del material",
          oninput: function (e) { m.name = e.target.value; save(m); } })]),
        deleteButton("Eliminar material", function () {
          var usados = 0;
          state.products.forEach(function (p) {
            var antes = p.materials.length;
            p.materials = p.materials.filter(function (l) { return l.materialId !== m.id; });
            if (p.materials.length !== antes) save(p);   /* el producto también cambió */
            usados += antes - p.materials.length;
          });
          state.materials.splice(idx, 1);
          marcarBorrado("materiales", m.id);
          render();
          toast(usados ? "Material eliminado y quitado de " + usados + " línea(s)" : "Material eliminado");
        })
      ]));

      detalle.appendChild(el("div", { class: "row" }, [
        el("div", { class: "grow" }, [el("label", { class: "field", style: "margin:0", text: "Unidad de uso" })]),
        el("div", { class: "unit" }, [unitSel])
      ]));

      detalle.appendChild(el("label", { class: "field", style: "margin-top:10px", text: "Categoría" }));
      detalle.appendChild(selectorCategoria(m));

      var seg = el("div", { class: "seg tiny" });
      [["directo", "Costo por unidad"], ["compra", "Calcular desde compra"]].forEach(function (o) {
        seg.appendChild(el("button", { type: "button", text: o[1], "aria-pressed": (m.mode || "directo") === o[0],
          onclick: function () { m.mode = o[0]; save(m); render(); } }));
      });
      detalle.appendChild(seg);

      if (m.mode === "compra") {
        detalle.appendChild(el("div", { class: "row" }, [
          el("div", { class: "grow" }, [el("label", { class: "field", style: "margin:0", text: "Precio pagado" })]),
          el("div", { class: "amt" }, [el("input", { class: "num", type: "text", inputmode: "decimal",
            value: m.buyPrice, placeholder: "0", "aria-label": "Precio de compra",
            oninput: function (e) { var antes = materialCost(m); m.buyPrice = e.target.value; save(m); refresh(); anotarCosto(m, antes); } })])
        ]));

        if (isArea(m.unit)) {
          var side = sideUnit(m.unit);
          detalle.appendChild(el("div", { class: "row measures" }, [
            el("div", { class: "grow" }, [
              el("label", { class: "field", text: "Alto pliego (" + side + ")" }),
              el("input", { class: "num", type: "text", inputmode: "decimal", value: m.sheetH, placeholder: "0",
                oninput: function (e) { m.sheetH = e.target.value; save(m); refresh(); } })
            ]),
            el("div", { class: "grow" }, [
              el("label", { class: "field", text: "Ancho pliego (" + side + ")" }),
              el("input", { class: "num", type: "text", inputmode: "decimal", value: m.sheetW, placeholder: "0",
                oninput: function (e) { m.sheetW = e.target.value; save(m); refresh(); } })
            ]),
            el("div", { class: "grow" }, [
              el("label", { class: "field", text: "Pliegos" }),
              el("input", { class: "num", type: "text", inputmode: "decimal", value: m.sheetQty, placeholder: "1",
                oninput: function (e) { m.sheetQty = e.target.value; save(m); refresh(); } })
            ])
          ]));
        } else {
          detalle.appendChild(el("div", { class: "row" }, [
            el("div", { class: "grow" }, [el("label", { class: "field", style: "margin:0", text: "Unidades que trae" })]),
            el("div", { class: "amt" }, [el("input", { class: "num", type: "text", inputmode: "decimal",
              value: m.buyQty, placeholder: "0", "aria-label": "Cantidad comprada",
              oninput: function (e) { var antes = materialCost(m); m.buyQty = e.target.value; save(m); refresh(); anotarCosto(m, antes); } })])
          ]));
        }

  function pintarFabricados(root) {
    if (!state.products.length) {
      root.appendChild(el("div", { class: "empty" }, [
        el("p", { text: "Aquí llevas la cuenta de lo que ya tienes hecho. Crea un producto para empezar." }),
        el("button", { class: "btn primary", type: "button", text: "Ir a Productos",

      return;
    }

    var unidades = 0, valor = 0, sinStock = 0;
    state.products.forEach(function (p) {

    });

    var strip = el("dl", { class: "strip" });
    [["Unidades hechas", fmtQty(unidades), ""],
     ["Sin existencia", String(sinStock) + (sinStock === 1 ? " producto" : " productos"), sinStock ? "loss" : ""],
     ["Costo inmovilizado", money(valor), "cost"]].forEach(function (c) {

      ]));

    root.appendChild(el("p", { class: "note", style: "margin:0 2px 10px",
      text: llevaMateriales()

        : "Ajusta a mano lo que tengas hecho. Al entregar un pedido se descuenta de aquí." }));

    var reservado = unidadesComprometidas();

    state.products.forEach(function (p) {
      var card = el("div", { class: "mat-card" });
      var pedidas = reservado[p.id] || 0;

      card.appendChild(el("div", { class: "row" }, [
        el("div", { class: "grow" }, [
          el("h4", { style: "margin:0;font-size:14px", text: p.name || "Sin nombre" }),

        ])
      ]));

      var estado = el("div", { class: "unit-cost" });
      function refreshEstado() {
        var hay = hechos(p);
        var falta = pedidas - hay;
        estado.innerHTML = "";

          estado.appendChild(el("span", { text: "Faltan " + fmtQty(falta) + " para cubrir los pedidos" }));
          estado.appendChild(el("b", { text: fmtQty(hay) + " hechas" }));
        } else {
          estado.appendChild(el("span", { text: "Valor de lo fabricado" }));
          estado.appendChild(el("b", { text: money(hay * calc(p).total) }));
        }
      }

      card.appendChild(el("div", { class: "row measures", style: "margin-top:10px" }, [
        el("div", { class: "grow" }, [
          el("label", { class: "field", text: "Unidades hechas" }),
          el("input", { class: "num", type: "text", inputmode: "decimal", value: p.stock == null ? "" : p.stock,
            placeholder: "0", "aria-label": "Unidades hechas de " + (p.name || "producto"),
            oninput: function (e) { p.stock = e.target.value; save(p); refreshEstado(); } })
        ]),
        el("div", { class: "grow" }, [
          el("label", { class: "field", text: "Se puede fabricar" }),
          el("p", { class: "note", style: "margin:6px 0 0", text: textoCapacidad(p) })
        ])
      ]));

      card.appendChild(estado);
      refreshEstado();

      if (llevaMateriales() && p.materials.length) {
        card.appendChild(el("button", { class: "btn small", type: "button", text: "Fabricar…",
          style: "margin-top:10px", onclick: function () { abrirProducir(p); } }));
      }

      root.appendChild(card);
    });
  }

  function textoCapacidad(p) {
    if (!llevaMateriales()) return "Ajuste manual";
    var cap = capacity(p);
    if (cap.units == null) return "Sin consumo definido";
    return fmtQty(cap.units) + (cap.units === 1 ? " unidad" : " unidades") +
      (cap.limiting ? " · limita " + (cap.limiting.name || "sin nombre") : "");
  }

  /* unidades ya prometidas en pedidos que aún no se entregan */
  function unidadesComprometidas() {
    var out = {};
    pendingItems().forEach(function (it) {
      out[it.productId] = (out[it.productId] || 0) + parseNum(it.qty);
    });
    return out;
  }

  /* ---------------- firebase ---------------- */

  var fb = { app: null, db: null, auth: null, user: null, unsubs: [], estado: "apagado",
    aplicando: false, remotos: { materiales: {}, productos: {}, pedidos: {}, historial: {} } };

  function loadScript(src) {
    return new Promise(function (resolve, reject) {
      var s = document.createElement("script");
      s.src = src; s.onload = resolve; s.onerror = function () { reject(new Error("sin_red")); };
      document.head.appendChild(s);
    });
  }

  var SDK = "https://www.gstatic.com/firebasejs/10.12.2/";

  function fbInit() {
    if (fb.app) return Promise.resolve();
    fb.estado = "cargando";
    return loadScript(SDK + "firebase-app-compat.js")
      .then(function () { return loadScript(SDK + "firebase-auth-compat.js"); })
      .then(function () { return loadScript(SDK + "firebase-firestore-compat.js"); })
      .then(function () {
        fb.app = window.firebase.initializeApp(FIREBASE);
        fb.auth = window.firebase.auth();
        fb.db = window.firebase.firestore();
        fb.estado = "listo";
        /* caché offline: la planilla sigue viva sin señal y reenvía al volver */
        fb.db.enablePersistence({ synchronizeTabs: true }).catch(function () {});
        /* la sesión sobrevive al cierre del navegador */
        return fb.auth.setPersistence(window.firebase.auth.Auth.Persistence.LOCAL).catch(function () {});
      })
      .then(function () {
        fb.auth.onAuthStateChanged(sesionCambio);
        /* si se entró por redirección (móvil), aquí llega el resultado */
        return fb.auth.getRedirectResult().catch(function (err) { mostrarErrorAcceso(err); });
      })
      .catch(function (err) { fb.estado = "error"; throw err; });
  }

  /* ---------------- pantalla de acceso ---------------- */

  var uidActual = null;

  function verGate(ver) {
    document.getElementById("gate").hidden = !ver;
    document.querySelector(".app").hidden = ver;
  }

  function gateOcupado(ocupado, txt) {
    var b = document.getElementById("btnGoogle");
    b.disabled = ocupado;
    document.getElementById("btnGoogleTxt").textContent = txt || "Entrar con Google";
  }

  var ERRORES = {
    "auth/popup-blocked": "Tu navegador bloqueó la ventana de Google. Permite las ventanas emergentes de este sitio e intenta otra vez.",
    "auth/popup-closed-by-user": "Cerraste la ventana de Google antes de terminar.",
    "auth/cancelled-popup-request": "Quedó otra ventana de acceso abierta. Ciérrala e intenta de nuevo.",
    "auth/unauthorized-domain": "Este sitio todavía no está autorizado en Firebase. Agrega su dominio en Authentication → Settings → Authorized domains.",
    "auth/operation-not-allowed": "El acceso con Google no está habilitado en Firebase. Actívalo en Authentication → Sign-in method.",
    "auth/network-request-failed": "Sin conexión. Revisa tu internet e intenta otra vez.",
    "auth/user-disabled": "Esta cuenta está deshabilitada.",
    "auth/too-many-requests": "Demasiados intentos seguidos. Espera un momento y vuelve a probar.",
    "sin_red": "No pude cargar Firebase. Revisa tu conexión y recarga la página."
  };

  function textoError(err) {
    if (!err) return "No pude entrar. Intenta otra vez.";
    return ERRORES[err.code] || ERRORES[err.message] || "No pude entrar. Intenta otra vez.";
  }

  function mostrarErrorAcceso(err) {
    if (!err) return;
    var n = document.getElementById("gateAviso");
    n.className = "aviso error";
    n.textContent = textoError(err);
    gateOcupado(false);
  }

  function entrarConGoogle() {
    document.getElementById("gateAviso").textContent = "";
    gateOcupado(true, "Conectando…");
    fbInit().then(function () {
      var prov = new window.firebase.auth.GoogleAuthProvider();
      prov.setCustomParameters({ prompt: "select_account" });
      return fb.auth.signInWithPopup(prov).catch(function (err) {
        /* en móvil o con emergentes bloqueadas se entra por redirección */
        var code = (err && err.code) || "";
        if (code === "auth/popup-blocked" || code === "auth/operation-not-supported-in-this-environment") {
          gateOcupado(true, "Redirigiendo…");
          return fb.auth.signInWithRedirect(prov);
        }
        throw err;
      });
    }).catch(mostrarErrorAcceso);
  }

  /* ---------------- sesión ---------------- */

  function sesionCambio(u) {
    if (u && uidActual === u.uid) return;

    pararSync();
    limpiarEstado();
    fb.user = u || null;
    uidActual = u ? u.uid : null;

    if (!u) {
      storageKey = STORAGE_BASE;
      pintarCuenta();
      gateOcupado(false);
      verGate(true);
      return;
    }

    storageKey = STORAGE_BASE + ":" + u.uid;
    verGate(false);
    setSaveState("Cargando…");
    load().then(function () {
      pintarCuenta();
      aplicarLenguaje();
      render();
      arrancarSync();
    });
  }

  function pintarCuenta() {
    var n = document.getElementById("cuenta");
    n.innerHTML = "";
    if (!fb.user) return;
    if (fb.user.photoURL) {
      n.appendChild(el("img", { src: fb.user.photoURL, alt: "" }));
    }
    n.appendChild(el("span", { class: "correo", text: fb.user.email || fb.user.displayName || "Mi cuenta" }));
    n.appendChild(el("button", { type: "button", text: "Salir", onclick: cerrarSesion }));
  }

  function cerrarSesion() {
    if (pendiente && !window.confirm("Hay cambios sin subir. ¿Cerrar sesión de todas formas?")) return;
    pararSync();
    fb.auth.signOut().catch(function () {});
  }

  /* ---------------- rutas por usuario ---------------- */

  function tiendaRef() { return fb.db.collection("tiendas").doc(fb.user.uid); }
  function colRef(nombre) { return tiendaRef().collection(nombre); }
  function publicoRef() { return tiendaRef().collection("publico").doc("tienda"); }

  /* ---------------- sincronización ---------------- */

  function pararSync() {
    fb.unsubs.forEach(function (u) { try { u(); } catch (e) {} });
    fb.unsubs = [];
    fb.remotos = { materiales: {}, productos: {}, pedidos: {}, historial: {} };
  }

  /* Firestore es la fuente de verdad: al entrar bajamos la nube; si está
     vacía, subimos lo que ya había en este dispositivo (migración). */
  function arrancarSync() {
    if (fb.unsubs.length) return;
    setSaveState("Sincronizando…");
    Promise.all(COLECCIONES.map(function (c) { return colRef(c.nombre).get(); }))
      .then(function (snaps) {
        var vacia = snaps.every(function (s) { return s.empty; });
        return tiendaRef().get().then(function (doc) {
          if (doc.exists && doc.data().settings) aplicarSettings(doc.data().settings);
          /* una cuenta que ya venía trabajando no pasa por el asistente */
          if (!vacia && !state.settings.configurado) state.settings.configurado = true;
          if (vacia && state.settings.configurado) return subirTodo();
        });
      })
      .then(function () {
        escucharNube();
        revisarAsistente();
      })
      .catch(function () { setSaveState("Sin conexión"); toast("No pude sincronizar. Reintentaré al volver la señal."); });
  }

  /* el asistente solo aparece la primera vez, con la nube ya consultada */
  function revisarAsistente() {
    if (necesitaAsistente()) abrirAsistente();
    else { aplicarLenguaje(); render(); }
  }

  function aplicarSettings(s) {
    state.settings = Object.assign(state.settings, s);
    delete state.settings.firebase; /* quedó en respaldos antiguos; ya no se usa */
    state.settings.tienda = Object.assign({ nombre: "", whatsapp: "" }, s.tienda || {});
  }

  function escucharNube() {
    COLECCIONES.forEach(function (c) {
      fb.unsubs.push(colRef(c.nombre).onSnapshot(function (snap) {
        /* el eco de lo que acabamos de subir no trae nada nuevo: repintar
           con él le quitaría el foco a quien está escribiendo */
        if (snap.metadata && snap.metadata.hasPendingWrites) { setSaveState("Sincronizado"); return; }

        var items = [], mapa = {};
        snap.forEach(function (d) {
          var item = Object.assign({ id: d.id }, d.data());
          items.push(item); mapa[d.id] = true;
        });
        fb.remotos[c.nombre] = mapa;
        fb.aplicando = true;
        state[c.campo] = items;
        if (c.campo === "materials") {
          state.materials.forEach(function (m) {
            if (m.stockTarget == null && m.stockMin != null) m.stockTarget = m.stockMin;
          });
        }
        if (c.campo === "orders") normalizarPedidos();
        /* productos de versiones con margen o markup: se pasan a precio fijo */
        var migrados = c.campo === "products" ? state.products.filter(migrarPrecio) : [];
        guardarLocal();
        fb.aplicando = false;
        if (migrados.length) {
          migrados.forEach(save);
          toast(migrados.length + (migrados.length === 1 ? " producto pasó" : " productos pasaron") + " a precio fijo");
        }
        setSaveState("Sincronizado");
        renderSeguro();
      }, function () { setSaveState("Sin conexión"); }));
    });

    fb.unsubs.push(tiendaRef().onSnapshot(function (doc) {
      if (!doc.exists || (doc.metadata && doc.metadata.hasPendingWrites)) return;
      var d = doc.data();
      if (!d.settings) return;
      fb.aplicando = true;
      aplicarSettings(d.settings);
      guardarLocal();
      fb.aplicando = false;
      renderSeguro();
    }, function () {}));
  }

  /* Un cambio que llega de otro dispositivo no debe borrar lo que se está
     escribiendo aquí: se espera a que el campo pierda el foco. */
  var esperaRender = null, prontoTimer = null;

  /* Un cambio confirmado (salir de un campo) suele venir de un clic en otro
     sitio: si se repinta de inmediato, ese clic se pierde con el nodo. */
  function renderPronto() {
    clearTimeout(prontoTimer);
    prontoTimer = setTimeout(function () {
      if (escribiendo()) { renderSeguro(); return; }
      render();
    }, 300);
  }

  function escribiendo() {
    var a = document.activeElement;
    if (!a) return false;
    var tag = a.tagName;
    return (tag === "INPUT" || tag === "TEXTAREA") && !!a.closest(".app");
  }

  /* Repintar en el blur reconstruiría la pantalla justo mientras se pulsa un
     botón, y ese toque se perdería. Se espera a que nadie esté escribiendo. */
  function renderSeguro() {
    if (!escribiendo()) {
      if (esperaRender) { clearInterval(esperaRender); esperaRender = null; }
      render();
      return;
    }
    if (esperaRender) return;
    esperaRender = setInterval(function () {
      if (escribiendo()) return;
      clearInterval(esperaRender);
      esperaRender = null;
      render();
    }, 700);
  }

  /* los pedidos que entran desde la tienda traen fechas y números en crudo */
  function normalizarPedidos() {
    state.orders.forEach(function (o) {
      o.estado = o.estado || "pendiente";
      o.metodo = o.metodo || METODOS[0];
      o.origen = o.origen || "tienda";
      if (o.creado) o.creado = String(o.creado).slice(0, 10);
      o.items = (o.items || []).map(function (i) {
        return { productId: i.productId, qty: parseNum(i.qty), price: parseNum(i.price) };
      });
    });
    state.orders.sort(function (a, b) { return String(b.creado || "").localeCompare(String(a.creado || "")); });
  }

  /* sube todo el estado; borra en la nube lo que ya no existe aquí */
  /* Firestore acepta como mucho 500 operaciones por lote */
  var TOPE_LOTE = 400;

  function enviarOperaciones(ops) {
    if (!ops.length) return Promise.resolve();
    var tandas = [];
    for (var i = 0; i < ops.length; i += TOPE_LOTE) tandas.push(ops.slice(i, i + TOPE_LOTE));
    return tandas.reduce(function (cadena, tanda) {
      return cadena.then(function () {
        var batch = fb.db.batch();
        tanda.forEach(function (op) {
          if (op.borrar) batch.delete(op.ref);
          else batch.set(op.ref, op.datos, op.fundir ? { merge: true } : undefined);
        });
        return batch.commit();
      });
    }, Promise.resolve());
  }

  function opAjustes() {
    var settings = Object.assign({}, state.settings);
    delete settings.firebase; /* pudo venir de un respaldo antiguo */
    return { ref: tiendaRef(), datos: { settings: settings, actualizado: new Date().toISOString() }, fundir: true };
  }

  /* sube solo lo marcado como sucio, y borra lo marcado como borrado */
  function subirCambios() {
    if (!fb.user) return Promise.resolve();

    var ops = [], aLimpiar = { materiales: [], productos: [], pedidos: [] };

    COLECCIONES.forEach(function (c) {
      Object.keys(sucios[c.nombre]).forEach(function (id) {
        var item = null;
        (state[c.campo] || []).forEach(function (x) { if (x.id === id) item = x; });
        /* si ya no está en la lista, se borró: lo resuelve la rama de borrados */
        if (!item) return;
        ops.push({ ref: colRef(c.nombre).doc(id), datos: limpiar(item) });
        aLimpiar[c.nombre].push(id);
      });
      Object.keys(borrados[c.nombre]).forEach(function (id) {
        ops.push({ ref: colRef(c.nombre).doc(id), borrar: true });
        aLimpiar[c.nombre].push(id);
      });
    });

    var subiaAjustes = sucioAjustes;
    if (subiaAjustes) ops.push(opAjustes());
    if (!ops.length) return Promise.resolve();

    return enviarOperaciones(ops).then(function () {
      /* se limpia solo lo efectivamente enviado: lo editado entretanto sigue pendiente */
      COLECCIONES.forEach(function (c) {
        aLimpiar[c.nombre].forEach(function (id) {
          delete sucios[c.nombre][id];
          delete borrados[c.nombre][id];
        });
      });
      if (subiaAjustes) sucioAjustes = false;
    });
  }

  /* subida completa: migración inicial y el botón de Ajustes */
  function subirTodo() {
    if (!fb.user) return Promise.resolve();
    var ops = [];
    COLECCIONES.forEach(function (c) {
      var vivos = {};
      (state[c.campo] || []).forEach(function (item) {
        if (!item.id) item.id = uid();
        vivos[item.id] = true;
        ops.push({ ref: colRef(c.nombre).doc(item.id), datos: limpiar(item) });
      });
      Object.keys(fb.remotos[c.nombre] || {}).forEach(function (id) {
        if (!vivos[id]) ops.push({ ref: colRef(c.nombre).doc(id), borrar: true });
      });
    });
    ops.push(opAjustes());
    return enviarOperaciones(ops).then(function () { limpiarPendientes(); });
  }

  /* Firestore no acepta undefined ni el id duplicado dentro del documento */
  function limpiar(item) {
    var out = {};
    Object.keys(item).forEach(function (k) {
      if (k === "id" || item[k] === undefined) return;
      out[k] = item[k] === null ? null : item[k];
    });
    return out;
  }

  /* ---------------- publicación de la tienda ---------------- */

  function publicarCatalogo() {
    if (!fb.user) return Promise.reject(new Error("Inicia sesión primero."));
    var cat = publicCatalog();
    var batch = fb.db.batch();
    cat.forEach(function (item) {
      batch.set(colRef("catalogo").doc(item.id), item);
    });
    return colRef("catalogo").get().then(function (snap) {
      var vivos = {};
      cat.forEach(function (i) { vivos[i.id] = true; });
      snap.forEach(function (doc) { if (!vivos[doc.id]) batch.delete(doc.ref); });
      batch.set(publicoRef(), {
        nombre: state.settings.tienda.nombre || "",
        whatsapp: state.settings.tienda.whatsapp || "",
        moneda: state.settings.currency,
        actualizado: new Date().toISOString()
      });
      return batch.commit();
    }).then(function () { return cat.length; });
  }

  function urlTienda() {
    if (!fb.user) return "";
    return location.href.replace(/[^/]*$/, "") + "tienda.html?tienda=" + fb.user.uid;
  }

  /* los estados de pedido viajan con el resto del estado */
  function sincronizarEstado(o) {
    if (!fb.user || !o || !o.id) return;
    colRef("pedidos").doc(o.id).set({ estado: o.estado }, { merge: true }).catch(function () {});
  }

  /* ---------------- rubros, módulos y lenguaje ---------------- */

  /* El rubro decide qué módulos se activan y cómo se llaman las cosas:
     nadie debería tener que entender una pantalla de ajustes para empezar. */
  var RUBROS = {
    manualidades: {
      emoji: "🧶",
      label: "Hecho a mano",
      detalle: "Tejido, joyería, decoración, papelería, velas.",
      insumo: "Material", insumos: "Materiales", insumoPlural: "materiales",
      receta: "Materiales que lleva",
      modulos: { inventario: true, tienda: true, lotes: false, materiales: true, fabricados: false }
    },
    comida: {
      emoji: "🧁",
      label: "Comida y repostería",
      detalle: "Tortas, panadería, conservas, catering.",
      insumo: "Ingrediente", insumos: "Ingredientes", insumoPlural: "ingredientes",
      receta: "Receta",
      modulos: { inventario: true, tienda: true, lotes: true, materiales: true, fabricados: false }
    },
    general: {
      emoji: "📦",
      label: "Otro rubro",
      detalle: "Cualquier cosa que produzcas con insumos.",
      insumo: "Insumo", insumos: "Insumos", insumoPlural: "insumos",
      receta: "Insumos que lleva",
      modulos: { inventario: true, tienda: true, lotes: false, materiales: true, fabricados: false }
    }
  };

  function rubro() { return RUBROS[state.settings.rubro] || RUBROS.general; }

  function modulos() {
    return Object.assign({}, rubro().modulos, state.settings.modulos || {});
  }

  function moduloActivo(nombre) { return modulos()[nombre] !== false; }

  /* ---------------- asistente de configuración ---------------- */

  var wiz = null;

  function necesitaAsistente() { return !state.settings.configurado; }

  function abrirAsistente() {
    wiz = {
      paso: 0,
      nombre: state.settings.tienda.nombre || "",
      rubro: state.settings.rubro || "",
      currency: state.settings.currency || "CLP",
      taxEnabled: !!state.settings.taxEnabled,
      taxRate: state.settings.taxRate || 19,
      modo: state.settings.modo || "",
      tienda: state.settings.modulos ? state.settings.modulos.tienda !== false : true
    };
    document.getElementById("wizard").hidden = false;
    document.querySelector(".app").hidden = true;
    pintarAsistente();
  }

  var PASOS = ["negocio", "rubro", "dinero", "venta"];

  function pintarAsistente() {
    var card = document.getElementById("wizardCard");
    card.innerHTML = "";

    var barra = el("div", { class: "barra-paso" });
    PASOS.forEach(function (_, i) {
      barra.appendChild(el("i", { class: i <= wiz.paso ? "on" : "" }));
    });
    card.appendChild(barra);
    card.appendChild(el("p", { class: "paso", text: "Paso " + (wiz.paso + 1) + " de " + PASOS.length }));

    if (PASOS[wiz.paso] === "negocio") pasoNegocio(card);
    else if (PASOS[wiz.paso] === "rubro") pasoRubro(card);
    else if (PASOS[wiz.paso] === "dinero") pasoDinero(card);
    else pasoVenta(card);

    var acciones = el("div", { class: "acciones" });
    if (wiz.paso > 0) {
      acciones.appendChild(el("button", { class: "btn", type: "button", text: "Atrás",
        onclick: function () { wiz.paso--; pintarAsistente(); } }));
    }
    var ultimo = wiz.paso === PASOS.length - 1;
    acciones.appendChild(el("button", { class: "btn primary", type: "button",
      text: ultimo ? "Empezar" : "Continuar",
      disabled: !pasoCompleto(),
      onclick: function () {
        if (!pasoCompleto()) return;
        if (ultimo) cerrarAsistente();
        else { wiz.paso++; pintarAsistente(); }
      } }));
    card.appendChild(acciones);
  }

  function pasoCompleto() {
    var p = PASOS[wiz.paso];
    if (p === "negocio") return !!wiz.nombre.trim();
    if (p === "rubro") return !!wiz.rubro;
    if (p === "venta") return !!wiz.modo;
    return true;
  }

  function opcion(seleccionado, emoji, titulo, detalle, onclick) {
    return el("button", { class: "opcion", type: "button", "aria-pressed": seleccionado ? "true" : "false",
      onclick: onclick }, [
      el("span", { class: "emoji", text: emoji }),
      el("span", {}, [el("b", { text: titulo }), el("small", { text: detalle })])
    ]);
  }

  function pasoNegocio(card) {
    card.appendChild(el("h1", { text: "¿Cómo se llama tu emprendimiento?" }));
    card.appendChild(el("p", { class: "intro", text: "Es el nombre que verán tus clientes. Puedes cambiarlo cuando quieras." }));
    var campos = el("div", { class: "campos" });
    var input = el("input", { type: "text", value: wiz.nombre, placeholder: "Ej: Taller Aurora",
      "aria-label": "Nombre del emprendimiento" });
    input.addEventListener("input", function () {
      wiz.nombre = input.value;
      card.querySelector(".acciones .btn.primary").disabled = !wiz.nombre.trim();
    });
    campos.appendChild(input);
    card.appendChild(campos);
    setTimeout(function () { input.focus(); }, 30);
  }

    var r = RUBROS[wiz.rubro] || RUBROS.general;

    state.settings.rubro = wiz.rubro || "general";

  /* pone en pantalla las palabras del rubro y esconde lo que no se usa */

    var r = rubro();

    if (tabInv) tabInv.hidden = !moduloActivo("inventario");

  /* número junto al nombre de cada pestaña: lo que reclama atención */
  function pintarContadores() {
    var cuentas = {
      productos: state.products.length || null,
      pedidos: state.orders.filter(function (o) {
        return o.estado === "pendiente" || o.estado === "proceso";
      }).length || null,

    };
    Object.keys(cuentas).forEach(function (tab) {

      if (!btn) return;

    });
